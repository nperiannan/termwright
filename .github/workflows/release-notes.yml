name: release notes

# Rewrites the notes of releases that are already published from CHANGELOG.md
# and the commit list (Actions → release notes → Run workflow).
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Release tags separated by spaces, or "all"'
        default: all
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAGS: ${{ inputs.tags }}
        run: |
          if [ "$TAGS" = all ]; then TAGS=$(gh release list --limit 200 --json tagName -q '.[].tagName' | grep '^v' || true); fi
          for t in $TAGS; do
            git rev-parse -q --verify "refs/tags/$t" >/dev/null || { echo "skip $t: no such tag"; continue; }
            scripts/release-notes.sh "$t" > notes.md
            gh release edit "$t" --notes-file notes.md && echo "updated $t"
          done
