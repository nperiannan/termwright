name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces a build that is still running
# (tag builds always finish).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  APP_VERSION: 0.20.1

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24' }
      - run: go mod verify
      - name: Software smart card for the PKCS#11 tests
        run: sudo apt-get install -y --no-install-recommends softhsm2 opensc || echo "::warning::SoftHSM2 not installed - smart card tests are skipped"
      - run: go vet ./internal/...
      - run: go test -race ./internal/...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       platform: darwin/arm64,  tags: '',         name: macos-arm64 }
          - { os: windows-latest, platform: windows/amd64, tags: '',         name: windows-amd64, nsis: '-nsis' }
          - { os: ubuntu-24.04,     platform: linux/amd64, tags: webkit2_41, name: linux-amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, tags: webkit2_41, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v7
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      # The packages are kept in the Actions cache, so builds do not depend on
      # how fast the Ubuntu mirror is that day (it once took over 15 minutes).
      - name: Linux package cache
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.os }}-gtk3-webkit41-v1
      - name: Linux dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 25
        run: |
          # skip the slow man-page index rebuild after installing packages
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null 2>&1 || true
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-cache/partial
          PKGS="libgtk-3-dev libwebkit2gtk-4.1-dev"
          APT="-o Dir::Cache::Archives=$HOME/apt-cache -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o DPkg::Lock::Timeout=120"
          # fresh package lists (the runner image's lists can point at removed versions: 404)
          sudo apt-get update $APT
          sudo apt-get install -y --no-install-recommends $APT $PKGS
          # let the cache step read the downloaded packages
          sudo rm -rf ~/apt-cache/partial ~/apt-cache/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache
      - name: NSIS (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
      - name: Install Wails
        shell: bash
        # retried: the Go module and checksum servers sometimes drop a connection
        run: |
          for i in 1 2 3 4; do
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2 && exit 0
            echo "attempt $i failed, retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
      - name: Go modules
        shell: bash
        run: |
          for i in 1 2 3 4; do
            go mod download && exit 0
            echo "attempt $i failed, retrying in $((i * 15)) s"; sleep $((i * 15))
          done
          exit 1
      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then V="${GITHUB_REF_NAME#v}"; else V="${APP_VERSION}~git${GITHUB_SHA::7}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          if [ "$RUNNER_OS" = Windows ]; then
            # smart cards (PKCS#11) need cgo: the runner's MinGW gcc
            if command -v gcc >/dev/null; then export CGO_ENABLED=1; gcc --version | head -1
            else echo "::warning::gcc not found - smart cards are disabled in the Windows build"; fi
          fi
          wails build -clean -skipbindings ${{ matrix.nsis }} -platform ${{ matrix.platform }} -tags "${{ matrix.tags }}" -ldflags "-X main.Version=$VERSION"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist && cd build/bin
          APP=$(ls -d *.app | head -1)
          # ad-hoc sign so Apple Silicon runs it; not notarized
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" ../../dist/termwright-${{ matrix.name }}.zip
          # drag-to-Applications disk image
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Termwright -srcfolder dmg -ov -format UDZO ../../dist/Termwright-${VERSION//\~/-}-macos-arm64.dmg
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/bin/termwright.exe -DestinationPath dist/termwright-${{ matrix.name }}.zip
          Get-ChildItem build/bin/*installer*.exe | ForEach-Object { Copy-Item $_ "dist/Termwright-$($env:VERSION -replace '~','-')-windows-amd64-setup.exe" }
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist && tar -C build/bin -czf dist/termwright-${{ matrix.name }}.tar.gz .
          build/linux/build-deb.sh "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: termwright-${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }  # all tags and commits, for the release notes
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
            gh release create "$GITHUB_REF_NAME" dist/* --title "Termwright $GITHUB_REF_NAME" --notes-file notes.md
          else
            scripts/release-notes.sh nightly > notes.md
            # Keep one "nightly" pre-release: move its tag to this commit and
            # replace the files (deleting and re-creating it races with
            # GitHub's tag clean-up and fails now and then).
            TITLE="Termwright nightly (${GITHUB_SHA::7})"
            if gh release view nightly >/dev/null 2>&1; then
              gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null \
                || gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
              for a in $(gh release view nightly --json assets -q '.assets[].name'); do gh release delete-asset nightly "$a" --yes; done
              gh release upload nightly dist/* --clobber
              gh release edit nightly --prerelease --title "$TITLE" --notes-file notes.md
            else
              for i in 1 2 3; do
                gh release create nightly dist/* --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md && break
                echo "retrying in 20 s"; sleep 20
                [ "$i" = 3 ] && exit 1
              done
            fi
          fi
