<style>

  --accent:#5b9dff;--accent2:#a78bfa;--soft:#18263a;--seq1:#1a2a44;--seq2:#244a85;--seq3:#3a6fd0;--seq4:#5b9dff;--seq5:#a9cbff;

  --accent:#5b9dff;--accent2:#a78bfa;--soft:#18263a;--seq1:#1a2a44;--seq2:#244a85;--seq3:#3a6fd0;--seq4:#5b9dff;--seq5:#a9cbff;
  --ok:#4ade80;--okbg:#122a1b;--bad:#f87171;--badbg:#341717;--warn:#f5bd52;--warnbg:#33260f;--shadow:0 1px 0 rgba(255,255,255,.03) inset;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
aside{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 14px}.brand img{width:34px;height:34px}
.brand b{display:block;font-size:14.5px;letter-spacing:-.01em}.brand span{color:var(--muted);font-size:11.5px}
.team{margin:0 4px 14px;padding:10px 12px;border-radius:9px;background:var(--card);border:1px solid var(--line)}
.team b{display:block;font-size:13.5px;word-break:break-word}.team span{color:var(--muted);font-size:11.5px}
.grp{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 11px;border-radius:7px;color:var(--text2);cursor:pointer;font-weight:500;margin:1px 0}
.nav a:hover{background:color-mix(in srgb,var(--text) 5%,transparent)}.nav a.on{background:var(--soft);color:var(--accent)}
.nav svg{width:16px;height:16px;flex:none}.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:9px;padding:0 7px;font-size:11px;font-weight:600}
.me{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.me b{color:var(--text);display:block;font-size:13px}.me a{color:var(--accent);cursor:pointer}
.me .ver{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px;gap:2px}

.seg button.on{background:var(--soft);color:var(--accent)}.seg svg{width:14px;height:14px}
main{padding:22px 28px 60px;min-width:0;max-width:1500px}
.lead{color:var(--muted);margin:0 0 18px;max-width:980px}

.card>h3{margin:0;padding:12px 16px;font-size:13.5px;font-weight:600;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.card>h3 small{font-weight:400;color:var(--muted);font-size:12px}.card>h3 .sp{flex:1}
.pad{padding:14px 16px}.sp{flex:1}

.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}.kpi .d{font-size:11.5px;color:var(--muted)}
.up{color:var(--ok)}.down{color:var(--bad)}
.g2{display:grid;grid-template-columns:3fr 2fr;gap:18px}.g2b{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:1200px){.g2,.g2b{grid-template-columns:1fr}}@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto}}
.tool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:11px 16px;border-bottom:1px solid var(--line)}
button{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 12px;background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap}
button:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.p:hover{filter:brightness(1.07)}
button.d{color:var(--bad)}button:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--card);color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);padding:0;vertical-align:-2px}
.mono{font-family:var(--mono);font-size:12.3px}.muted{color:var(--muted)}.small{font-size:12px}.num{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--card2);position:sticky;top:0;white-space:nowrap;z-index:1}
th[data-sort]{cursor:pointer}th[data-sort]:hover{color:var(--text)}th.num{text-align:right}
td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--accent) 4%,transparent)}
th.c,td.c{width:36px;text-align:center}
tr.f td{background:var(--card2);font-weight:600;cursor:pointer}td a,.link{color:var(--accent);cursor:pointer;margin-right:10px;text-decoration:none}td a.d{color:var(--bad)}
.pill{display:inline-block;font-size:11px;border-radius:10px;padding:1px 8px;background:color-mix(in srgb,var(--text) 7%,transparent);white-space:nowrap;font-weight:500}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.dot.off{background:var(--muted);opacity:.45}
.empty{padding:30px;text-align:center;color:var(--muted)}
.msg{position:fixed;right:22px;bottom:22px;max-width:460px;padding:11px 15px;border-radius:10px;background:var(--card);border:1px solid var(--line);box-shadow:0 14px 30px rgba(0,0,0,.18);z-index:20}.msg.err{border-color:var(--bad);color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:200px}.bar i{display:block;height:100%;background:var(--accent)}
.meter{display:inline-flex;align-items:center;gap:8px;min-width:120px}.meter span{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}.meter i{display:block;height:100%;border-radius:3px;background:var(--seq4)}
.scroll{max-height:calc(100vh - 300px);overflow:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:0;width:min(540px,94vw);box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(780px,94vw)}dialog .scroll table{width:100%}dialog::backdrop{background:rgba(10,14,20,.45)}dialog h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
dialog .g{display:grid;grid-template-columns:120px 1fr;gap:10px 12px;padding:16px 18px;align-items:center}dialog .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}.steps li{position:relative;padding:0 0 14px 40px;line-height:1.55}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:12.5px}
.help h4{margin:14px 0 6px}.help p{line-height:1.6;margin:6px 0}
.gate{max-width:560px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;line-height:1.6}.gate img{width:52px}
.kv{display:grid;grid-template-columns:160px 1fr;gap:7px 14px}.kv span:nth-child(odd){color:var(--muted)}
.chart{padding:10px 12px 6px}.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:10.5px;font-family:inherit}.chart .gl{stroke:var(--line2)}.chart .ax{stroke:var(--line)}
.chart rect.b{fill:var(--seq4)}.chart rect.b:hover{fill:var(--seq5)}.chart rect.hit{fill:transparent}
.heat td{padding:0;border:0;height:20px}.heat td.h{width:auto}.heat .lab{font-size:10.5px;color:var(--muted);padding-right:8px;white-space:nowrap;text-align:right;width:40px}
.heat i{display:block;height:18px;margin:1px;border-radius:3px}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:6px 12px 12px}.legend i{width:16px;height:10px;border-radius:2px;display:inline-block}
.ins{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line2)}.ins:last-child{border-bottom:0}
.ins .ic{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center}.ins .ic svg{width:16px;height:16px}
.ins.buy .ic{background:var(--warnbg);color:var(--warn)}.ins.rm .ic{background:var(--soft);color:var(--accent)}.ins.bad .ic{background:var(--badbg);color:var(--bad)}.ins.ok .ic{background:var(--okbg);color:var(--ok)}

#tip{position:fixed;pointer-events:none;z-index:30;background:var(--text);color:var(--bg);padding:6px 9px;border-radius:7px;font-size:12px;line-height:1.4;display:none;max-width:280px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px}.tabs a{padding:10px 12px;color:var(--muted);cursor:pointer;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}

.app{background:linear-gradient(90deg,var(--side) 240px,transparent 240px)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chipk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;box-shadow:var(--shadow);cursor:pointer;min-width:140px}

.chips{display:flex;gap:4px;flex-wrap:wrap}.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--text2);background:var(--card2)}

.ib{border:0;background:transparent;padding:5px;border-radius:6px;color:var(--muted)}.ib:hover{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)}.ib.d:hover{color:var(--bad)}.ib svg{width:15px;height:15px;display:block}

.scanbox{display:grid;grid-template-columns:1fr 240px auto;gap:12px;align-items:end;padding:16px}.scanbox label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}

.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}

  if (l.u.length) return { rank: 1, text: 'in use by ' + l.u.map(x => x.name).join(', '), html: `<span class="pill warn" title="${esc(l.u.map(x => x.name).join(', '))}">● ${esc(l.u.map(x => x.name.split(' ')[0]).join(', '))}</span>` };
  if (!tracked(d.deviceType)) return { rank: 3, text: 'not tracked', html: '<span class="muted small">not tracked</span>' };

function csvRows(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ',' || c === ';') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const COLS = ['name', 'folder', 'address', 'port', 'protocol', 'deviceType', 'mac', 'description'];

async function importCSV(file) {
  const rows = csvRows(await file.text()); if (!rows.length) return flash('The file is empty.', true);

  if (col('address') < 0 && col('host') < 0 && col('hostname') < 0 && col('ip') < 0) return flash('The first line needs the column names: ' + COLS.join(', ') + ' (address, host or ip for the address).', true);
  const devices = rows.slice(1).map(r => ({ name: at(r, 'name'), folder: at(r, 'folder'), host: at(r, 'address', 'host', 'hostname', 'ip'), port: Number(at(r, 'port')) || 0,

    const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
    const rows = [['when', 'who', 'what']].concat(r.items.map(a => [a.at, a.who, a.what.replace(/\{t:([^}]+)\}/g, '$1')]));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(x => x.map(q).join(',')).join('\n') + '\n'], { type: 'text/csv' }));
    a.download = `${st.team.name.replace(/[^\w.-]+/g, '-')}-activity.csv`; a.click();
  } catch (e) { flash(e.message, true); }
}
function activity() {
  if (!ui.act) { setTimeout(() => { if (!ui.act) loadAct(true); }, 0); }
  const a = ui.act || { total: 0, items: [] };
  return `<p class="lead">Who added, changed, approved, reserved, released and removed what, and who signed in here - the last 5000 events.</p>
  <div class="card"><div class="tool"><input id="aq" data-k="aq" placeholder="Filter by who or what, e.g. reserved or Anisha" value="${esc(ui.actQ || '')}" style="flex:1;min-width:260px">
    <span class="muted small">${a.items.length} of ${a.total}</span><span class="sp"></span><button id="acsv">Export CSV</button></div>
  <div class="scroll">${actTable(a.items)}</div>
  ${a.items.length < a.total ? '<div class="pad" style="text-align:center"><button id="amore">Show 200 more</button></div>' : ''}</div>`;
}

// ---------- single sign-on (owner) ----------
function sso() {
  const c = st.sso || {}, on = !!c.clientId, f = ui.ssoForm || (ui.ssoForm = { label: c.label || 'Microsoft', issuer: c.issuer || '', clientId: c.clientId || '', secret: '',
    domains: (c.domains || []).join(', '), groups: (c.groups || []).join(', '), inviteToo: on ? !!c.inviteToo : true, renewDays: on ? (c.renewDays || 0) : 30 });
  const redirect = 'https://' + location.host + '/sso/callback';
  const fld = (k, label, hint, attrs = '') => `<label class="fl"><span>${label}</span><input data-k="sso-${k}" data-sso="${k}" value="${esc(f[k])}" ${attrs}>${hint ? `<small>${hint}</small>` : ''}</label>`;
  return `<p class="lead">Members join and stay in ${esc(st.team.name)} with their company account - Microsoft Entra ID, Okta, Google or any OpenID Connect sign-in - instead of the invite key. ${on ? '<span class="pill ok">On</span>' : '<span class="pill">Off</span>'}</p>
  <div class="g2b"><div class="card"><h3>Sign-in service</h3><div class="pad form">
    ${fld('label', 'Button name', 'what members see: <i>Join with Microsoft</i>')}
    ${fld('issuer', 'Issuer', 'Entra ID: <span class="mono">https://login.microsoftonline.com/&lt;Directory (tenant) ID&gt;/v2.0</span>', 'placeholder="https://login.microsoftonline.com/…/v2.0"')}
    ${fld('clientId', 'Application (client) ID', '')}
    ${fld('secret', 'Client secret', c.hasSecret ? 'saved - type a new one to change it' : 'empty for a public client (Entra: Allow public client flows)', 'type="password" autocomplete="off"')}
    ${fld('domains', 'Allowed e-mail domains', 'e.g. example.com - empty: any account the service signs in', 'placeholder="example.com"')}
    ${fld('groups', 'Allowed groups (ids)', 'empty: any; needs the <i>groups</i> claim in the app registration')}
    <label class="ck"><input type="checkbox" data-sso="inviteToo" ${f.inviteToo ? 'checked' : ''}> Members may also join with the invite key</label>
    <label class="fl"><span>Sign in again every</span><input data-k="sso-renew" data-sso="renewDays" type="number" min="0" value="${f.renewDays}" style="width:90px"> <small>days (0 = never) - someone who left the company drops out then</small></label>
    <div class="acts2"><button class="p" id="ssosave">Save</button>${on ? '<button id="ssotest">Test Sign-In</button><button class="d" id="ssooff">Turn Off</button>' : ''}</div>
    ${ui.ssoTest ? `<div class="pad small ${ui.ssoTest.err ? 'bad' : ''}" style="padding-left:0">${esc(ui.ssoTest.text)}</div>` : ''}
  </div></div>
  <div class="card help"><h3>Microsoft Entra ID, step by step</h3><div class="pad"><ol class="steps">
    <li>Entra admin center → <b>App registrations → New registration</b>, e.g. <i>Termwright ${esc(st.team.name)}</i>, single tenant.</li>
    <li><b>Redirect URI</b>: platform <i>Web</i>, this address:<div class="tool" style="border:0;padding:6px 0"><input class="mono" readonly value="${esc(redirect)}" style="flex:1" id="ssoredir"><button id="ssocp">Copy</button></div></li>
    <li><b>Certificates &amp; secrets → New client secret</b>, paste it here (or leave it empty and turn on <i>Allow public client flows</i>).</li>
    <li><b>Token configuration → Add optional claim → ID → email</b>; for allowed groups also <i>Add groups claim</i>.</li>
    <li>Copy the <b>Application (client) ID</b> and the <b>Directory (tenant) ID</b> from the Overview into the fields here, Save and <b>Test Sign-In</b>.</li>
  </ol>
  ${st.ssoInvite ? `<h4>Invite for single sign-on</h4><p>Send this to the team: it has the server's address and certificate, not the key. Termwright then offers <i>Join with ${esc(c.label || 'your company account')}</i>.</p><div class="tool" style="border:0;padding:0"><input class="mono" readonly value="${esc(st.ssoInvite)}" style="flex:1" id="ssoinv"><button id="ssoicp">Copy</button></div>` : ''}
  </div></div></div>`;
}

// ---------- backup & restore (owner) ----------
function backup() {
  return `<p class="lead">The team's data in one file: the team, its members and invite, the inventory, reservations, the usage history and the server's certificate and key. Keep it somewhere safe - with it, someone could run a server that your members' Termwright trusts.</p>
  <div class="g2b"><div class="card"><h3>Download a backup</h3><div class="pad"><p>A <span class="mono">.tar.gz</span> file of the server's data folder, as it is now. Nothing is changed.</p>
    <button class="p" id="bdl">Download Backup</button></div></div>
  <div class="card"><h3>Restore a backup</h3><div class="pad"><p>Puts the team back as it was in the backup: members and invite, inventory, reservations and usage history. Changes since then are lost. Members who joined after the backup need the invite again.</p>
    <p class="muted small">When the backup comes from another server, its certificate is used from now on: members' Termwright keeps working if the backup is from the server they joined; otherwise send them the invite again.</p>
    <button id="brs" class="d">Restore from a File…</button><input type="file" id="bfile" accept=".gz,.tgz,application/gzip" hidden></div></div></div>`;
}

// ---------- help & about ----------
function help() {
  const t = st.team;
  return `<p class="lead">Termwright is an open-source terminal and session manager for network and infrastructure teams. This team server lets a team share its lab.</p>
  <div class="g2b">
  <div class="card"><h3>How it works</h3><div class="pad"><ol class="steps">
    <li><b>One server per team.</b> An owner sets it up from Termwright (Options → Teams… → Set Up a Team Server…): a small container on a lab host. No cloud, no company-wide admin.</li>
    <li><b>Members join with the invite.</b> Termwright talks only to this server - it checks its certificate fingerprint, which is in the invite.</li>
    <li><b>The inventory is shared.</b> Its devices appear in every member's Session Manager as the folder <i>${esc(t.name)}</i> and follow changes within seconds.</li>
    <li><b>Logins stay personal.</b> Usernames, passwords, keys and terminal output never reach the server.</li>
    <li><b>Members push, owners approve.</b> Right-click a session in Termwright → Push to Team…; devices the team has already are recognised by address or MAC whatever their name.</li>
    <li><b>Who uses what.</b> Termwright reports which of the team's network devices it has open (switches, routers, firewalls, access points - not computers, phones, printers or IoT boards), and members reserve devices with a note.</li>
  </ol></div></div>
  <div class="card help"><h3>Reading the reports</h3><div class="pad">
    <p><b>Hours open</b> - time a member's Termwright had a terminal to the device connected. Two people at once count twice.</p>
    <p><b>Utilization</b> - hours open divided by all hours of the period (24 × 7), or by working hours (Monday to Friday, 9:00-18:00) with <i>Working hours</i> at the top. 10% of all hours is about 17 hours a week.</p>
    <p><b>Peak at once</b> - the most people with the device open at the same time. More than one often means the team needs more of that kind.</p>
    <p><b>Model</b> and the device's own name come from members' Termwright when they connect, or from a scan on Discover (SNMP sysName). A device named by its address is shown by its own name with the address under it; select devices on Inventory and choose <i>Name After Devices</i> to rename them for everyone.</p>
    <p><b>Now</b> - whether the device is free to use or reserve right now, who has it open, or who reserved it until when. <i>Only free now</i> lists just the free ones.</p>
    <p><b>Conflicts</b> - connections to a device someone else had reserved.</p>
    <p><b>Not used</b> - neither opened nor reserved in the period (devices added during it are marked <i>new</i>).</p>
    <h4>Roles</h4><p><b>Owner</b> - everything here, and manages co-owners. <b>Co-owner</b> - this admin page. <b>Member</b> - the team folder, pushing devices for approval, reserving.</p>
    <h4>Signing in</h4><p>Only from Termwright (Teams → Open Admin Page): a link that works once, for two minutes, then eight hours in this browser. No passwords on the server. The browser asks once to trust the server's own certificate.</p></div></div>
  </div>
  <div class="card"><h3>About</h3><div class="pad kv">
    <span>Team</span><b>${esc(t.name)}</b><span>Server version</span><span class="mono">${esc(t.version)}</span>
    <span>Address</span><span class="mono">${esc(location.host)}</span><span>Licence</span><span>Apache-2.0, open source</span>
    <span>Guide</span><a class="link" href="https://github.com/nperiannan/termwright/blob/main/docs/TEAM_SERVER.md" target="_blank" rel="noopener">Team server guide</a>
    <span>Project</span><a class="link" href="https://github.com/nperiannan/termwright" target="_blank" rel="noopener">github.com/nperiannan/termwright</a></div></div>`;
}
const PAGES = { overview, reports, inventory, approvals, discover, members, sso, backup, activity, help };

function wire() {
  const on = (sel, ev, fn) => $$(sel).forEach(e => e[ev] = fn);
  on('[data-go]', 'onclick', e => go(e.currentTarget.dataset.go));
  on('[data-theme]', 'onclick', e => setTheme(e.currentTarget.dataset.theme));
  on('[data-basis]', 'onclick', e => { ui.basis = e.currentTarget.dataset.basis; store.set('tw.basis', ui.basis); render(); });
  on('[data-days]', 'onclick', e => { ui.days = Number(e.currentTarget.dataset.days); store.set('tw.days', ui.days); usage = null; load(true); });
  on('#out', 'onclick', async () => { await api('POST', '/api/admin/signout').catch(() => {}); gate('Signed out.'); });
  on('[data-k]', 'oninput', e => { const k = e.target.dataset.k; if (k.startsWith('dt:')) ui.dts[k.slice(3)] = e.target.value; else ui[k] = e.target.value; if (k === 'filter' || k === 'rq') render(); });
  on('[data-rel]', 'onclick', e => { if (confirm('Release this reservation? Its member gets a notice.')) act(() => api('POST', '/api/release', { id: e.target.dataset.rel }), 'Released'); });
  on('[data-unused]', 'onclick', () => { ui.rtab = 'devices'; ui.unusedOnly = true; go('reports'); });
  // hover values for the charts
  on('[data-tip]', 'onmousemove', e => { const t = $('#tip'); t.textContent = e.target.dataset.tip; t.style.display = 'block'; t.style.left = Math.min(innerWidth - 300, e.clientX + 14) + 'px'; t.style.top = (e.clientY + 14) + 'px'; });
  on('[data-tip]', 'onmouseleave', () => { $('#tip').style.display = 'none'; });
  // reports
  on('[data-rtab]', 'onclick', e => { ui.rtab = e.target.dataset.rtab; render(); });
  on('[data-sort]', 'onclick', e => { const [tab, k] = e.currentTarget.dataset.sort.split(':'); const cur = ui.sort[tab]; ui.sort[tab] = [k, cur[0] === k ? -cur[1] : (['name', 'folder', 'type', 'dev', 'n'].includes(k) ? 1 : -1)]; render(); });
  on('#rtype', 'onchange', e => { ui.rtype = e.target.value; render(); });
  on('#unused', 'onchange', e => { ui.unusedOnly = e.target.checked; render(); });
  on('#freeonly', 'onchange', e => { ui.freeOnly = e.target.checked; render(); });
  on('#rcsv', 'onclick', reportCSV);
  // inventory
  on('#add', 'onclick', () => deviceForm({ protocol: 'SSH2' }, 'New device', d => act(() => api('POST', '/api/admin/devices', { devices: [d] }), 'Added ' + d.name)));
  on('#addf', 'onclick', () => ask('New folder', 'Folder', '', f => f && act(() => api('POST', '/api/admin/folders', { folder: f })), true));
  on('#imp', 'onclick', () => $('#csv').click());
  on('#csv', 'onchange', e => e.target.files[0] && importCSV(e.target.files[0]));
  on('#exp', 'onclick', exportCSV);
  on('[data-fold]', 'onclick', e => { if (e.target.closest('a,input')) return; const f = e.currentTarget.dataset.fold; ui.closed.has(f) ? ui.closed.delete(f) : ui.closed.add(f); render(); });
  on('[data-rf]', 'onclick', e => { const f = e.target.dataset.rf; ask('Rename folder', 'New name', f, to => to && to !== f && act(() => api('POST', '/api/admin/folders', { from: f, folder: to }))); });
  on('[data-df]', 'onclick', e => act(() => api('POST', '/api/admin/folders', { from: e.target.dataset.df })));
  on('[data-ist]', 'onclick', e => { const k = e.currentTarget.dataset.ist; ui.invStatus = ui.invStatus === k ? 'all' : k; render(); });
  on('[data-ifo]', 'onclick', e => { ui.invFolder = e.currentTarget.dataset.ifo; render(); });
  on('#itype', 'onchange', e => { ui.invType = e.target.value; render(); });
  on('#sclr', 'onclick', () => { ui.ssel.clear(); render(); });
  on('#all', 'onchange', e => { invRows().forEach(d => e.target.checked ? ui.sel.add(d.id) : ui.sel.delete(d.id)); render(); });
  on('[data-fsel]', 'onchange', e => { const f = e.target.dataset.fsel; visibleDevices().filter(d => d.folder === f).forEach(d => e.target.checked ? ui.sel.add(d.id) : ui.sel.delete(d.id)); render(); });
  on('[data-sel]', 'onchange', e => { e.target.checked ? ui.sel.add(e.target.dataset.sel) : ui.sel.delete(e.target.dataset.sel); render(); });
  on('#clr', 'onclick', () => { ui.sel.clear(); render(); });
  on('[data-edit]', 'onclick', e => { const d = st.inventory.devices.find(x => x.id === e.target.dataset.edit); deviceForm(d, 'Edit ' + d.name, v => act(() => api('POST', '/api/admin/devices', { devices: [v] }), 'Saved ' + v.name)); });
  on('[data-del]', 'onclick', e => { const d = st.inventory.devices.find(x => x.id === e.target.dataset.del); if (confirm(`Delete ${d.name} from the team inventory? It disappears from every member's team folder.`)) act(() => api('POST', '/api/admin/devices/delete', { ids: [d.id] }), 'Deleted ' + d.name); });
  on('#delsel', 'onclick', () => { if (confirm(`Delete ${ui.sel.size} devices from the team inventory? They disappear from every member's team folder.`)) act(() => api('POST', '/api/admin/devices/delete', { ids: [...ui.sel] }).then(r => { ui.sel.clear(); return r; }), r => `Deleted ${r.deleted} devices`); });
  on('#nad', 'onclick', nameAfter);
  on('#mv', 'onclick', () => ask('Move ' + ui.sel.size + ' devices', 'To folder', '', f => act(() => api('POST', '/api/admin/devices', { devices: st.inventory.devices.filter(d => ui.sel.has(d.id)).map(d => ({ ...d, folder: f })) }).then(r => { ui.sel.clear(); return r; }), 'Moved'), true));
  // approvals
  on('[data-psel]', 'onchange', e => { e.target.checked ? ui.psel.add(e.target.dataset.psel) : ui.psel.delete(e.target.dataset.psel); render(); });
  on('#pall', 'onchange', e => { st.pending.forEach(p => e.target.checked ? ui.psel.add(p.id) : ui.psel.delete(p.id)); render(); });
  const decide = ok => { const body = { ids: [...ui.psel] }; if (ui.approveFolder.trim()) body.folder = ui.approveFolder.trim();
    act(() => api('POST', ok ? '/api/admin/pending/approve' : '/api/admin/pending/reject', body).then(r => { ui.psel.clear(); return r; }), r => ok ? `Approved ${r.done}` + (r.alreadyThere ? ` (${r.alreadyThere} were in the inventory already)` : '') : `Rejected ${r.done}`); };
  on('#apr', 'onclick', () => decide(true)); on('#rej', 'onclick', () => decide(false));
  // discover
  on('#scan', 'onclick', async () => { ui.ssel.clear(); ui.dts = {}; try { await api('POST', '/api/admin/scan', { targets: ui.targets || (scan ? scan.targets : ''), community: ui.community }); poll(); } catch (e) { flash(e.message, true); } });
  on('#stop', 'onclick', () => api('POST', '/api/admin/scan/stop').catch(() => {}));
  on('#sadd', 'onclick', () => {
    const devices = scan.results.filter(r => ui.ssel.has(r.ip)).map(r => ({ name: r.name || r.ip, folder: ui.scanFolder.trim(), host: r.ip, port: r.port || 0, protocol: r.protocol || 'SSH2', deviceType: dtOf(r), mac: r.mac,
      description: [r.vendor, r.platform].filter(Boolean).join(' ') }));
    act(() => api('POST', '/api/admin/devices', { devices }).then(async r => { ui.ssel.clear(); scan = await api('GET', '/api/admin/scan'); return r; }), r => `Added ${r.added}` + (r.skipped ? `, ${r.skipped} were in the inventory already` : '')); });
  // members
  on('#cp', 'onclick', () => { navigator.clipboard?.writeText(st.invite).then(() => flash('Copied the invite'), () => { $('#inv').select(); document.execCommand('copy'); }); });
  on('#rot', 'onclick', () => { if (confirm('Make a new invite? The old one stops working; members who joined stay.')) act(() => api('POST', '/api/invite/rotate', {}), 'New invite made'); });
  on('[data-own]', 'onclick', e => { if (confirm(`Make ${e.target.dataset.n} the owner of ${st.team.name}? You stay as co-owner.`)) act(() => api('POST', '/api/members/role', { id: e.target.dataset.own, role: 'owner' }), e.target.dataset.n + ' is the owner now'); });
  const aq = $('#aq'); if (aq) aq.oninput = () => { ui.actQ = aq.value; clearTimeout(ui.aqT); ui.aqT = setTimeout(() => loadAct(true), 300); };
  if ($('#amore')) $('#amore').onclick = () => loadAct(false);
  if ($('#acsv')) $('#acsv').onclick = actCsv;
  document.querySelectorAll('[data-sso]').forEach(el => el.oninput = el.onchange = () => { const k = el.dataset.sso; ui.ssoForm[k] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Number(el.value) : el.value; });
  const ssoBody = off => ({ label: ui.ssoForm.label, issuer: off ? '' : ui.ssoForm.issuer, clientId: off ? '' : ui.ssoForm.clientId, clientSecret: ui.ssoForm.secret,
    domains: ui.ssoForm.domains.split(/[ ,;]+/).filter(Boolean), groups: ui.ssoForm.groups.split(/[ ,;]+/).filter(Boolean), inviteToo: ui.ssoForm.inviteToo, renewDays: ui.ssoForm.renewDays });
  if ($('#ssosave')) $('#ssosave').onclick = () => act(() => api('POST', '/api/admin/sso', ssoBody(false)).then(() => { ui.ssoForm = null; ui.ssoTest = null; }), 'Single sign-on saved');
  if ($('#ssooff')) $('#ssooff').onclick = () => { if (confirm('Turn single sign-on off? Members who joined with it stay; new members need the invite key.')) act(() => api('POST', '/api/admin/sso', ssoBody(true)).then(() => { ui.ssoForm = null; }), 'Single sign-on is off'); };
  if ($('#ssotest')) $('#ssotest').onclick = async () => {
    try {
      const t = await api('POST', '/api/admin/sso/test', {});
      window.open(t.url, '_blank', 'noopener');
      ui.ssoTest = { text: 'Sign in in the new tab…' }; render();
      for (let i = 0; i < 6; i++) {
        const r = await fetch('/api/sso/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ req: t.req, secret: t.secret }) });
        if (r.status === 202) continue;
        const j = await r.json().catch(() => ({}));
        ui.ssoTest = r.ok ? { text: 'It works: signed in as ' + (j.email || j.preferred_username || j.upn || '?') + (j.name ? ' (' + j.name + ')' : '') + (j.groups ? ' · groups: ' + j.groups.length : ' · no groups claim') } : { err: true, text: j.error || r.statusText };
        break;
      }
    } catch (e) { ui.ssoTest = { err: true, text: e.message }; }
    render();
  };
  if ($('#ssocp')) $('#ssocp').onclick = () => { navigator.clipboard.writeText($('#ssoredir').value); flash('Copied'); };
  if ($('#ssoicp')) $('#ssoicp').onclick = () => { navigator.clipboard.writeText($('#ssoinv').value); flash('Copied'); };
  if ($('#bdl')) $('#bdl').onclick = () => { location.href = '/api/admin/backup'; setTimeout(() => load(true), 1500); };
  if ($('#brs')) $('#brs').onclick = () => $('#bfile').click();
  if ($('#bfile')) $('#bfile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    if (!confirm(`Restore ${st.team.name} from ${f.name}? The team goes back to how it was in the backup; changes since then are lost.`)) { e.target.value = ''; return; }
    try {
      const r = await fetch('/api/admin/restore', { method: 'POST', credentials: 'same-origin', headers: { 'X-Termwright': '1' }, body: await f.arrayBuffer() });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || r.status + ' ' + r.statusText);
      if (j.signedOut) { alert('Restored. You are not the owner in that backup - this page signs out.'); location.reload(); return; }
      flash('Restored' + (j.newCertificate ? ' - the server uses the backup\'s certificate now' : ''));
      ui.act = null; await load(true);
    } catch (err) { flash(err.message, true); }
    e.target.value = '';
  };
  on('[data-role]', 'onclick', e => act(() => api('POST', '/api/members/role', { id: e.target.dataset.role, role: e.target.dataset.to })));
  on('[data-rm]', 'onclick', e => { if (confirm(`Remove ${e.target.dataset.n} from the team?`)) act(() => api('POST', '/api/members/remove', { id: e.target.dataset.rm }), 'Removed ' + e.target.dataset.n); });
}
async function poll() {
  try { scan = await api('GET', '/api/admin/scan'); } catch {}
  if (ui.page === 'discover' && !$('#dlg').open) quietRender();
  if (scan && scan.running) setTimeout(poll, 1200);
}
start();
</script>
</body></html>
