<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termwright team</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--text:#1d2330;--muted:#6b7280;--line:#e3e6ec;--accent:#2563eb;--soft:#e8f0fe;--ok:#16a34a;--bad:#dc2626;--warn:#b45309}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--card:#1a1c21;--text:#e7e9ee;--muted:#9097a3;--line:#2b2e35;--accent:#5aa9ff;--soft:#1e2a3b;--ok:#4ade80;--bad:#f87171;--warn:#f0bd5a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 Inter,-apple-system,"Segoe UI",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);flex:none}
header b{font-size:16px}.sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;margin-left:24px;flex-wrap:wrap}nav a{padding:6px 12px;border-radius:7px;color:var(--muted);cursor:pointer;text-decoration:none}
nav a.on{background:var(--soft);color:var(--accent);font-weight:600}.count{background:var(--bad);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.who{margin-left:auto;color:var(--muted);font-size:12px}.who a{color:var(--accent);cursor:pointer}
main{padding:18px 22px;max-width:1400px}
.tool{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
button,.btn{font:inherit;border:1px solid var(--line);border-radius:7px;padding:5px 12px;background:var(--card);color:var(--text);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button.d{color:var(--bad)}button:disabled{opacity:.5;cursor:default}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:7px;padding:5px 9px;background:var(--card);color:var(--text)}
.mono{font-family:Menlo,Consolas,monospace;font-size:12.5px}.muted{color:var(--muted)}.sp{flex:1}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}
tr.f td{background:var(--soft);font-weight:600;cursor:pointer}td a{color:var(--accent);cursor:pointer;margin-right:8px}td a.d{color:var(--bad)}
.pill{font-size:11px;border-radius:5px;padding:1px 7px;background:var(--line);white-space:nowrap}.pill.in{background:var(--soft);color:var(--accent)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px}
.msg{padding:9px 12px;border-radius:8px;margin-bottom:12px;background:var(--soft)}.msg.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:220px}.bar i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:0;width:min(520px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}dialog h3{margin:0;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
dialog form>div.g{display:grid;grid-template-columns:120px 1fr;gap:8px 10px;padding:14px 16px;align-items:center}dialog .ft{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}
.gate{max-width:560px;margin:80px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;line-height:1.6}
</style></head><body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PROTOS = ['SSH2','Telnet','RDP','VNC','Raw'];
const NETKINDS = ['switch','router','firewall','wireless'];
let st = null, tab = 'inventory', filter = '', sel = new Set(), psel = new Set(), ssel = new Set(), closed = new Set(), scan = null, msg = null, timer = 0;

async function api(method, path, body) {
  const r = await fetch(path, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Termwright': '1' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch {}
  if (!r.ok) { const e = new Error((j && j.error) || r.status + ' ' + r.statusText); e.status = r.status; throw e; }
  return j;
}
function flash(text, err) { msg = { text, err }; render(); clearTimeout(timer); timer = setTimeout(() => { msg = null; render(); }, 6000); }
async function act(fn, ok) { try { const r = await fn(); if (ok) flash(typeof ok === 'function' ? ok(r) : ok); await load(); } catch (e) { flash(e.message, true); } }

async function start() {
  const m = /[#&]c=([^&]+)/.exec(location.hash);
  if (m) { history.replaceState(null, '', '/admin'); try { await api('POST', '/api/admin/session', { code: m[1] }); } catch (e) { return gate(e.message); } }
  await load();
  setInterval(() => { if (!document.hidden && !$('#dlg').open) load(true); }, 10000);
}
function gate(text) {
  $('#app').innerHTML = `<div class="gate"><b>Termwright team server</b><p>${esc(text || 'Open this page from Termwright: Options → Teams… → Open Admin Page.')}</p>
  <p class="muted">The admin page is for the team's owner and co-owners. Termwright signs you in with a link that works once, for two minutes; there are no passwords on the server.</p></div>`;
}
async function load(quiet) {
  try { st = await api('GET', '/api/admin/state'); if (tab === 'discover') scan = await api('GET', '/api/admin/scan'); render(); }
  catch (e) { if (e.status === 401 || e.status === 403) return gate(e.status === 403 ? e.message : ''); if (!quiet) flash(e.message, true); }
}

function render() {
  if (!st) return;
  const t = st.team, online = t.members.filter(m => m.online).length, me = t.members.find(m => m.id === st.me) || {};
  const tabs = [['inventory', `Inventory (${st.inventory.devices.length})`], ['approvals', 'Approvals' + (st.pending.length ? `<span class="count">${st.pending.length}</span>` : '')],
    ['discover', 'Discover'], ['members', `Members (${t.members.length})`], ['activity', 'Activity']];
  $('#app').innerHTML = `<header><div class="logo"></div><div><b>${esc(t.name)}</b><div class="sub">Termwright team server ${esc(t.version)} · ${t.members.length} member${t.members.length === 1 ? '' : 's'} · ${online} online</div></div>
    <nav>${tabs.map(([k, l]) => `<a class="${k === tab ? 'on' : ''}" data-tab="${k}">${l}</a>`).join('')}</nav>
    <div class="who">${esc(me.name)} · ${me.role === 'owner' ? 'Owner' : 'Co-owner'} · <a id="out">Sign out</a></div></header>
    <main>${msg ? `<div class="msg ${msg.err ? 'err' : ''}">${esc(msg.text)}</div>` : ''}${({ inventory, approvals, discover, members, activity })[tab]()}</main>`;
  document.querySelectorAll('[data-tab]').forEach(a => a.onclick = async () => { tab = a.dataset.tab; if (tab === 'discover') scan = await api('GET', '/api/admin/scan').catch(() => null); render(); });
  $('#out').onclick = async () => { await api('POST', '/api/admin/signout').catch(() => {}); gate('Signed out.'); };
  wire();
}

// ---- inventory ----
function folders() {
  const s = new Set(st.inventory.folders || []);
  st.inventory.devices.forEach(d => { let f = d.folder; while (f) { s.add(f); f = f.includes('/') ? f.slice(0, f.lastIndexOf('/')) : ''; } });
  return [...s].sort((a, b) => a.localeCompare(b));
}
function types() { return [...new Set(st.inventory.devices.map(d => d.deviceType).filter(Boolean))].sort(); }
function inventory() {
  const q = filter.toLowerCase();
  const list = st.inventory.devices.filter(d => !q || [d.name, d.host, d.folder, d.deviceType, d.mac, d.description].join(' ').toLowerCase().includes(q));
  const groups = new Map(); (st.inventory.folders || []).forEach(f => groups.set(f, [])); groups.set('', []);
  list.forEach(d => { if (!groups.has(d.folder)) groups.set(d.folder, []); groups.get(d.folder).push(d); });
  const keys = [...groups.keys()].sort((a, b) => a === '' ? -1 : b === '' ? 1 : a.localeCompare(b));
  let rows = '';
  for (const f of keys) {
    const ds = groups.get(f).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    if (!ds.length && (q || f === '')) continue;
    if (f) rows += `<tr class="f" data-fold="${esc(f)}"><td colspan="8">${closed.has(f) ? '▸' : '▾'} 📁 ${esc(f)} <span class="muted" style="font-weight:400">· ${ds.length} device${ds.length === 1 ? '' : 's'}</span>
      <span style="float:right;font-weight:400"><a data-rf="${esc(f)}">Rename</a>${ds.length ? '' : `<a class="d" data-df="${esc(f)}">Delete</a>`}</span></td></tr>`;
    if (closed.has(f)) continue;
    for (const d of ds) rows += `<tr><td><input type="checkbox" data-sel="${d.id}" ${sel.has(d.id) ? 'checked' : ''}></td><td>${f ? '&nbsp;&nbsp;&nbsp;' : ''}${esc(d.name)}</td>
      <td class="mono">${esc(d.host)}${d.port && d.port !== defPort(d.protocol) ? ':' + d.port : ''}</td><td>${esc(d.protocol === 'SSH2' ? 'SSH' : d.protocol)}</td><td>${esc(d.deviceType)}</td>
      <td class="mono muted">${esc(d.mac)}</td><td class="muted">${esc(d.addedBy)} · ${ago(d.added)}</td><td style="white-space:nowrap"><a data-edit="${d.id}">Edit</a><a class="d" data-del="${d.id}">Delete</a></td></tr>`;
  }
  return `<div class="tool"><input id="flt" placeholder="Filter devices" value="${esc(filter)}" style="min-width:240px">
    <button id="add">+ Device</button><button id="addf">+ Folder</button><button id="imp">Import CSV…</button><button id="exp">Export CSV</button>
    ${sel.size ? `<span class="muted">${sel.size} selected</span><button id="mv">Move to folder…</button><button class="d" id="delsel">Delete</button>` : ''}
    <span class="sp"></span><span class="muted">Changes reach every member's Termwright within seconds</span><input type="file" id="csv" accept=".csv,text/csv" hidden></div>
    ${st.inventory.devices.length || (st.inventory.folders || []).length ? `<table><tr><th style="width:28px"></th><th>Name</th><th>Address</th><th>Protocol</th><th>Device type</th><th>MAC</th><th>Added</th><th></th></tr>${rows}</table>`
      : `<div class="empty">No devices yet. Add them here, scan a network on the Discover tab, or push sessions from Termwright (right-click → Push to Team…).</div>`}`;
}
function defPort(p) { return ({ SSH2: 22, Telnet: 23, RDP: 3389, VNC: 5900 })[p] || 0; }
function ago(iso) {
  if (!iso) return ''; const s = (Date.now() - Date.parse(iso)) / 1000;
  return s < 90 ? 'now' : s < 5400 ? Math.round(s / 60) + ' min' : s < 129600 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d';
}
function deviceForm(d, title, save) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3><div class="g">
    <label>Name</label><input name="name" value="${esc(d.name)}" required>
    <label>Folder</label><input name="folder" list="fl" value="${esc(d.folder)}" placeholder="(the team folder)"><datalist id="fl">${folders().map(f => `<option value="${esc(f)}">`).join('')}</datalist>
    <label>Address</label><input name="host" class="mono" value="${esc(d.host)}" required placeholder="10.1.1.1 or host.example.com">
    <label>Protocol / port</label><div style="display:flex;gap:8px"><select name="protocol">${PROTOS.map(p => `<option ${p === (d.protocol || 'SSH2') ? 'selected' : ''} value="${p}">${p === 'SSH2' ? 'SSH' : p}</option>`).join('')}</select>
      <input name="port" type="number" min="0" max="65535" style="width:110px" value="${d.port || ''}" placeholder="default"></div>
    <label>Device type</label><input name="deviceType" list="tl" value="${esc(d.deviceType)}" placeholder="e.g. EXOS, VOSS, Cisco IOS"><datalist id="tl">${types().map(t => `<option value="${esc(t)}">`).join('')}</datalist>
    <label>MAC address</label><input name="mac" class="mono" value="${esc(d.mac)}" placeholder="optional">
    <label>Description</label><input name="description" value="${esc(d.description)}">
    </div><div class="ft"><button value="cancel" formnovalidate>Cancel</button><button class="p" value="ok">Save</button></div></form>`;
  dlg.showModal();
  dlg.onclose = () => {
    if (dlg.returnValue !== 'ok') return;
    const f = new FormData(dlg.querySelector('form')), v = Object.fromEntries(f.entries());
    save({ ...d, ...v, port: Number(v.port) || 0 });
  };
}
function ask(title, label, value, ok) {
  const dlg = $('#dlg');
  dlg.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3><div class="g"><label>${esc(label)}</label><input name="v" list="fl" value="${esc(value)}"><datalist id="fl">${folders().map(f => `<option value="${esc(f)}">`).join('')}</datalist></div>
    <div class="ft"><button value="cancel" formnovalidate>Cancel</button><button class="p" value="ok">OK</button></div></form>`;
  dlg.showModal(); dlg.onclose = () => { if (dlg.returnValue === 'ok') ok(dlg.querySelector('[name=v]').value.trim()); };
}
function csvRows(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true; else if (c === ',' || c === ';') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const COLS = ['name', 'folder', 'address', 'port', 'protocol', 'deviceType', 'mac', 'description'];
function exportCSV() {
  const q = v => /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  const lines = [COLS.join(',')].concat(st.inventory.devices.map(d => [d.name, d.folder, d.host, d.port || '', d.protocol, d.deviceType, d.mac, d.description].map(v => q(String(v ?? ''))).join(',')));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], { type: 'text/csv' }));
  a.download = st.team.name.replace(/[^\w.-]+/g, '-') + '-inventory.csv'; a.click();
}
async function importCSV(file) {
  const rows = csvRows(await file.text()); if (!rows.length) return flash('The file is empty.', true);
  const head = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z]/g, ''));
  const col = n => head.indexOf(n.toLowerCase());
  const at = (r, ...names) => { for (const n of names) { const i = col(n); if (i >= 0) return (r[i] || '').trim(); } return ''; };
  if (col('address') < 0 && col('host') < 0 && col('hostname') < 0 && col('ip') < 0) return flash('The first line needs the column names: ' + COLS.join(', ') + ' (address, host or ip for the address).', true);
  const devices = rows.slice(1).map(r => ({ name: at(r, 'name'), folder: at(r, 'folder'), host: at(r, 'address', 'host', 'hostname', 'ip'), port: Number(at(r, 'port')) || 0,
    protocol: ({ ssh: 'SSH2', ssh2: 'SSH2', telnet: 'Telnet', rdp: 'RDP', vnc: 'VNC', raw: 'Raw' })[at(r, 'protocol').toLowerCase()] || 'SSH2',
    deviceType: at(r, 'devicetype', 'type'), mac: at(r, 'mac', 'macaddress'), description: at(r, 'description') })).filter(d => d.host);
  act(() => api('POST', '/api/admin/devices', { devices }), r => `Imported: ${r.added} added, ${r.changed} changed, ${r.skipped} already in the inventory.`);
}

// ---- approvals ----
function approvals() {
  if (!st.pending.length) return `<div class="empty">Nothing waits for approval. Devices members push from Termwright (right-click → Push to Team…) appear here.</div>`;
  return `<div class="tool">${psel.size ? `<span class="muted">${psel.size} selected</span>` : '<span class="muted">Tick devices to approve or reject them</span>'}
    <span class="sp"></span>into folder <input id="pf" list="fl" placeholder="as pushed" style="width:200px"><datalist id="fl">${folders().map(f => `<option value="${esc(f)}">`).join('')}</datalist>
    <button class="p" id="apr" ${psel.size ? '' : 'disabled'}>Approve</button><button class="d" id="rej" ${psel.size ? '' : 'disabled'}>Reject</button></div>
    <table><tr><th style="width:28px"><input type="checkbox" id="pall"></th><th>Name</th><th>Address</th><th>Protocol</th><th>Device type</th><th>Folder</th><th>Pushed by</th></tr>
    ${st.pending.map(p => `<tr><td><input type="checkbox" data-psel="${p.id}" ${psel.has(p.id) ? 'checked' : ''}></td><td>${esc(p.device.name)}</td><td class="mono">${esc(p.device.host)}</td>
      <td>${esc(p.device.protocol === 'SSH2' ? 'SSH' : p.device.protocol)}</td><td>${esc(p.device.deviceType)}</td><td>${esc(p.device.folder)}</td><td class="muted">${esc(p.name)} · ${ago(p.at)}</td></tr>`).join('')}</table>`;
}

// ---- discover (from the server) ----
let onlyNet = true;
function isNet(r) { return NETKINDS.includes(r.kind) || (r.kind === 'unknown' && !!r.protocol); }
function discover() {
  const s = scan, res = s ? (s.results || []).filter(r => !r.self && (!onlyNet || isNet(r))) : [];
  const pct = s && s.total ? Math.round(100 * s.done / s.total) : 0;
  return `<div class="tool"><input id="tg" class="mono" style="min-width:280px" placeholder="10.127.36.0/24 · 10.127.36.10-80 · addresses" value="${esc(s ? s.targets : '')}">
    <input id="cm" placeholder="SNMP community (optional)" style="width:200px">
    <button class="p" id="scan" ${s && s.running ? 'disabled' : ''}>Scan from the server</button>${s && s.running ? '<button id="stop">Stop</button>' : ''}
    ${s ? `<span class="bar"><i style="width:${pct}%"></i></span><span class="muted">${s.done} / ${s.total} · ${(s.results || []).length} found${s.running ? '' : ' · done'}</span>` : ''}</div>
    <p class="muted" style="margin-top:-4px">The scan runs on the team server's host, inside the lab: it sees the lab networks even when you are away. Nothing logs in. Up to 1,024 addresses (a /22).</p>
    ${s ? `<div class="tool"><label><input type="checkbox" id="onlynet" ${onlyNet ? 'checked' : ''}> Network devices only (switches, routers, firewalls, access points, unknown devices with SSH or Telnet)</label>
      <span class="sp"></span>${ssel.size ? `Add <b>${ssel.size}</b> to folder <input id="sf" list="fl" placeholder="(the team folder)" style="width:200px"><datalist id="fl">${folders().map(f => `<option value="${esc(f)}">`).join('')}</datalist>
      <button class="p" id="sadd">Add to Inventory</button>` : '<span class="muted">Tick devices to add them</span>'}</div>
    <table><tr><th style="width:28px"></th><th>Device</th><th>Address</th><th>Kind</th><th>Vendor / system</th><th>Services</th><th>Device type</th></tr>
    ${res.map(r => { const inTeam = s.inTeam && s.inTeam[r.ip]; return `<tr><td>${inTeam ? '' : `<input type="checkbox" data-ssel="${esc(r.ip)}" ${ssel.has(r.ip) ? 'checked' : ''}>`}</td>
      <td>${esc(r.name)}${inTeam ? ` <span class="pill in">in inventory as ${esc(inTeam)}</span>` : ''}</td><td class="mono">${esc(r.ip)}<div class="muted">${esc(r.mac)}</div></td><td>${esc(r.kind)}</td>
      <td>${esc([r.vendor, r.sysDescr || r.os].filter(Boolean).join(' · ').slice(0, 140))}</td><td>${esc((r.services || []).join(' '))}</td>
      <td><input data-dt="${esc(r.ip)}" value="${esc(dtOf(r))}" style="width:120px"></td></tr>`; }).join('')}</table>` : ''}`;
}
const dts = {};
function dtOf(r) { return dts[r.ip] ?? (r.platform || ''); }

// ---- members ----
function members() {
  const t = st.team, mine = t.role;
  return `<div class="tool"><span>Invite</span><input class="mono" readonly value="${esc(st.invite)}" style="flex:1;min-width:300px" id="inv"><button id="cp">Copy</button><button id="rot">New Invite</button></div>
    <p class="muted" style="margin-top:-4px">Send the invite by chat or e-mail; people join in Termwright with Options → Teams… → Join a Team…. A new invite stops the old one - members who joined stay.</p>
    <table><tr><th>Name</th><th>Computer</th><th>Role</th><th>Last seen</th><th></th></tr>
    ${t.members.map(m => { const can = m.id !== st.me && m.role !== 'owner' && (mine === 'owner' || m.role === 'member');
      return `<tr><td>${esc(m.name)}${m.id === st.me ? ' <span class="muted">(you)</span>' : ''}</td><td class="mono muted">${esc(m.user)}@${esc(m.machine)}</td>
      <td><span class="pill">${({ owner: 'Owner', 'co-owner': 'Co-owner', member: 'Member' })[m.role]}</span></td><td>${m.online ? '<span class="ok">online</span>' : `<span class="muted">${ago(m.lastSeen)}${m.lastSeen ? ' ago' : ''}</span>`}</td>
      <td>${can ? `<a data-role="${m.id}" data-to="${m.role === 'member' ? 'co-owner' : 'member'}">${m.role === 'member' ? 'Make co-owner' : 'Make member'}</a><a class="d" data-rm="${m.id}" data-n="${esc(m.name)}">Remove</a>` : ''}</td></tr>`; }).join('')}</table>`;
}
function activity() {
  if (!st.activity.length) return `<div class="empty">Nothing yet.</div>`;
  return `<table><tr><th style="width:170px">When</th><th style="width:200px">Who</th><th>What</th></tr>${st.activity.map(a => `<tr><td class="muted">${esc(new Date(a.at).toLocaleString())}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td></tr>`).join('')}</table>`;
}

function wire() {
  const on = (sel, ev, fn) => document.querySelectorAll(sel).forEach(e => e[ev] = fn);
  on('#flt', 'oninput', e => { filter = e.target.value; const p = e.target.selectionStart; render(); const f = $('#flt'); f.focus(); f.setSelectionRange(p, p); });
  on('#add', 'onclick', () => deviceForm({ protocol: 'SSH2' }, 'New device', d => act(() => api('POST', '/api/admin/devices', { devices: [d] }), 'Added ' + d.name)));
  on('#addf', 'onclick', () => ask('New folder', 'Folder', '', f => f && act(() => api('POST', '/api/admin/folders', { folder: f }))));
  on('#imp', 'onclick', () => $('#csv').click());
  on('#csv', 'onchange', e => e.target.files[0] && importCSV(e.target.files[0]));
  on('#exp', 'onclick', exportCSV);
  on('[data-fold]', 'onclick', e => { if (e.target.closest('a')) return; const f = e.currentTarget.dataset.fold; closed.has(f) ? closed.delete(f) : closed.add(f); render(); });
  on('[data-rf]', 'onclick', e => { const f = e.target.dataset.rf; ask('Rename folder', 'New name', f, to => to && to !== f && act(() => api('POST', '/api/admin/folders', { from: f, folder: to }))); });
  on('[data-df]', 'onclick', e => act(() => api('POST', '/api/admin/folders', { from: e.target.dataset.df })));
  on('[data-sel]', 'onchange', e => { e.target.checked ? sel.add(e.target.dataset.sel) : sel.delete(e.target.dataset.sel); render(); });
  on('[data-edit]', 'onclick', e => { const d = st.inventory.devices.find(x => x.id === e.target.dataset.edit); deviceForm(d, 'Edit ' + d.name, v => act(() => api('POST', '/api/admin/devices', { devices: [v] }), 'Saved ' + v.name)); });
  on('[data-del]', 'onclick', e => { const d = st.inventory.devices.find(x => x.id === e.target.dataset.del); if (confirm(`Delete ${d.name} from the team inventory? It disappears from every member's team folder.`)) act(() => api('POST', '/api/admin/devices/delete', { ids: [d.id] }), 'Deleted ' + d.name); });
  on('#delsel', 'onclick', () => { if (confirm(`Delete ${sel.size} devices from the team inventory? They disappear from every member's team folder.`)) act(() => api('POST', '/api/admin/devices/delete', { ids: [...sel] }).then(r => { sel.clear(); return r; }), r => `Deleted ${r.deleted} devices`); });
  on('#mv', 'onclick', () => ask('Move ' + sel.size + ' devices', 'To folder', '', f => act(() => api('POST', '/api/admin/devices', { devices: st.inventory.devices.filter(d => sel.has(d.id)).map(d => ({ ...d, folder: f })) }).then(r => { sel.clear(); return r; }), 'Moved')));
  on('[data-psel]', 'onchange', e => { e.target.checked ? psel.add(e.target.dataset.psel) : psel.delete(e.target.dataset.psel); render(); });
  on('#pall', 'onchange', e => { st.pending.forEach(p => e.target.checked ? psel.add(p.id) : psel.delete(p.id)); render(); });
  const decide = ok => { const f = $('#pf').value.trim(); const body = { ids: [...psel] }; if (f) body.folder = f;
    act(() => api('POST', ok ? '/api/admin/pending/approve' : '/api/admin/pending/reject', body).then(r => { psel.clear(); return r; }), r => ok ? `Approved ${r.done}` + (r.alreadyThere ? ` (${r.alreadyThere} were in the inventory already)` : '') : `Rejected ${r.done}`); };
  on('#apr', 'onclick', () => decide(true)); on('#rej', 'onclick', () => decide(false));
  on('#scan', 'onclick', async () => { ssel.clear(); try { await api('POST', '/api/admin/scan', { targets: $('#tg').value, community: $('#cm').value }); poll(); } catch (e) { flash(e.message, true); } });
  on('#stop', 'onclick', () => api('POST', '/api/admin/scan/stop').catch(() => {}));
  on('#onlynet', 'onchange', e => { onlyNet = e.target.checked; render(); });
  on('[data-ssel]', 'onchange', e => { e.target.checked ? ssel.add(e.target.dataset.ssel) : ssel.delete(e.target.dataset.ssel); render(); });
  on('[data-dt]', 'oninput', e => { dts[e.target.dataset.dt] = e.target.value; });
  on('#sadd', 'onclick', () => { const f = $('#sf').value.trim();
    const devices = scan.results.filter(r => ssel.has(r.ip)).map(r => ({ name: r.name || r.ip, folder: f, host: r.ip, port: r.port || 0, protocol: r.protocol || 'SSH2', deviceType: dtOf(r), mac: r.mac,
      description: [r.vendor, r.platform].filter(Boolean).join(' ') }));
    act(() => api('POST', '/api/admin/devices', { devices }).then(async r => { ssel.clear(); scan = await api('GET', '/api/admin/scan'); return r; }), r => `Added ${r.added}` + (r.skipped ? `, ${r.skipped} were in the inventory already` : '')); });
  on('#cp', 'onclick', () => { navigator.clipboard?.writeText(st.invite).then(() => flash('Copied the invite'), () => { $('#inv').select(); document.execCommand('copy'); }); });
  on('#rot', 'onclick', () => { if (confirm('Make a new invite? The old one stops working; members who joined stay.')) act(() => api('POST', '/api/invite/rotate', {}), 'New invite made'); });
  on('[data-role]', 'onclick', e => act(() => api('POST', '/api/members/role', { id: e.target.dataset.role, role: e.target.dataset.to })));
  on('[data-rm]', 'onclick', e => { if (confirm(`Remove ${e.target.dataset.n} from the team?`)) act(() => api('POST', '/api/members/remove', { id: e.target.dataset.rm }), 'Removed ' + e.target.dataset.n); });
}
async function poll() {
  try { scan = await api('GET', '/api/admin/scan'); } catch {}
  if (tab === 'discover' && !$('#dlg').open) { const a = document.activeElement, id = a && a.id, ds = a && a.dataset && a.dataset.dt; render(); if (id) $('#' + id)?.focus(); else if (ds) document.querySelector(`[data-dt="${CSS.escape(ds)}"]`)?.focus(); }
  if (scan && scan.running) setTimeout(poll, 1000);
}
start();
</script>
</body></html>
