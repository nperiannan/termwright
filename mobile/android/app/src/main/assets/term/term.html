<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  /* a font of our own: the phone's "monospace" differs from maker to maker, and its letters were taller than the rows
     xterm measured, so their lower part was cut off */
  @font-face { font-family: TwMono; src: url(DejaVuSansMono.woff2) format('woff2'); font-weight: normal; }
  @font-face { font-family: TwMono; src: url(DejaVuSansMono-Bold.woff2) format('woff2'); font-weight: bold; }
  html, body { margin: 0; height: 100%; background: #0c0d10; overflow: hidden; overscroll-behavior: none; }
  /* placed on the visible part of the page (above the keyboard); a little room at the bottom so the last row is never cut */
  #t { position: fixed; left: 0; right: 0; top: 0; height: 100%; }
  /* the margins on an inner box: the fit addon reads its parent's height, which must not include them */
  #x { position: absolute; left: 6px; right: 6px; top: 4px; bottom: 10px; }
</style>
</head>
<body>
<div id="t"><div id="x"></div></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
(async () => {
  // xterm.js (the desktop's terminal) in the Android app; "tw" is the app (TermSession.Bridge).
  // xterm measures the letters when it opens: the font must be loaded by then.
  try { await Promise.all([document.fonts.load('13px TwMono'), document.fonts.load('bold 13px TwMono')]); } catch (e) {}
  const el = document.getElementById('t');
  const term = new Terminal({
    fontFamily: 'TwMono, monospace', fontSize: tw.fontSize(), lineHeight: 1.1, cursorBlink: true, scrollback: 5000,
    theme: { background: '#0c0d10', foreground: '#d6d8dc', cursor: '#d6d8dc' },
  });
  window.term = term;
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('x'));
  // the phone keyboard: no auto-correction or capitals in a terminal
  if (term.textarea) for (const [k, v] of [['autocapitalize', 'off'], ['autocorrect', 'off'], ['autocomplete', 'off'], ['spellcheck', 'false']]) term.textarea.setAttribute(k, v);
  let cols = 0, rows = 0;
  function refit() {
    try { fit.fit(); } catch (e) {}
    if (term.cols !== cols || term.rows !== rows) { cols = term.cols; rows = term.rows; tw.resize(cols, rows); }
  }
  // The terminal fills what is visible of the page: when the keyboard opens the app makes the page smaller, and
  // Android may only shrink the "visual viewport", so the bottom rows - the prompt and what is typed - would be
  // hidden under the keyboard. Follow the visual viewport, refit, and keep the cursor line in view.
  const vv = window.visualViewport;
  function place() {
    const h = vv ? vv.height : window.innerHeight;
    el.style.top = (vv ? vv.offsetTop : 0) + 'px';
    el.style.height = h + 'px';
    window.scrollTo(0, 0);
    refit();
    term.scrollToBottom();
  }
  if (vv) { vv.addEventListener('resize', place); vv.addEventListener('scroll', place); }
  window.addEventListener('resize', place);
  new ResizeObserver(refit).observe(document.getElementById('x'));
  window.twRefit = place;
  term.onData(d => tw.input(d));
  term.onBinary(d => tw.input(d));
  window.twWrite = b64 => {
    const s = atob(b64), u = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i);
    term.write(u);
  };
  window.twFont = n => { term.options.fontSize = n; refit(); };
  window.twFocus = () => term.focus();
  window.twSelection = () => term.getSelection();
  window.twSelectAll = () => term.selectAll();
  window.twPaste = t => term.paste(t);
  // keys from the bar: the cursor keys follow the device's mode (vi, menus use "application" keys)
  window.twKey = name => {
    const app = term.modes && term.modes.applicationCursorKeysMode;
    const cur = c => (app ? '\x1bO' : '\x1b[') + c;
    const k = { up: cur('A'), down: cur('B'), right: cur('C'), left: cur('D'), home: cur('H'), end: cur('F'),
      pgup: '\x1b[5~', pgdn: '\x1b[6~', esc: '\x1b', tab: '\t' }[name];
    if (k) tw.key(k);
  };
  place();
  tw.ready();
})();
</script>
</body>
</html>
