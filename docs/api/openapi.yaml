                gre:
                    description: the IP packet inside GRE (RFC 2784, 2890) to a tunnel end
                    anyOf:
                        - $ref: '#/components/schemas/EmuGRE'
                        - type: "null"
                vxlan:
                    description: the whole Ethernet frame inside VXLAN (RFC 7348) to a VTEP
                    anyOf:
                        - $ref: '#/components/schemas/EmuVXLAN'
                        - type: "null"
                v6ext:
                    description: IPv6 extension headers (IPv6 streams), put in RFC 8200's order
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuV6Ext'
        EmuFact:
