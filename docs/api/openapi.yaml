            summary: Hubs, L2 switches and clouds of the emulated lab
            description: 'Hubs, L2 switches and clouds of the emulated lab: nodes without a VM. A hub (8 ports, no management) repeats every frame to its other ports; an L2 switch (8-24 ports) learns MAC addresses per VLAN, has access and trunk ports, an in-band management address (ARP, ping) and a command line on its console session. Ports go on at once, also on running switches; a hub''s switches must run on one host. Actions: list, add (kind hub or switch, name), connect (hub, switch, port), disconnect (hub, switch, port), remove (hub), show (hub: its ports, VLANs and learned MACs), ports (hub, count: an L2 switch''s 8-24), port (hub, number, mode access|trunk, vlan, vlans), management (hub, ip with prefix or "", vlan), cloud_ports (host, count: 1-8 ports of a host''s cloud). Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - list
                                        - add
                                        - connect
                                        - disconnect
                                        - remove
                                        - show
                                        - ports
                                        - port
                                        - management
                                        - cloud_ports
                                    type: string
                                count:
                                    description: 'ports: 8-24; cloud_ports: 1-8'
                                    type: integer
                                host:
                                    description: 'cloud_ports: the KVM host (name)'
                                    type: string
                                hub:
                                    description: the hub (name or id)
                                    type: string
                                ip:
                                    description: 'management: address with prefix (10.20.0.5/24), "" = none'
                                    type: string
                                kind:
                                    enum:
                                        - hub
                                        - switch
                                    type: string
                                mode:
                                    enum:
                                        - access
                                        - trunk
                                    type: string
                                name:
                                    description: 'add: its name (default hub-1, l2sw-1 …)'
                                    type: string
                                number:
                                    description: 'port: the L2 switch''s port'
                                    type: integer
                                port:
                                    description: the switch's port (as the switch names it)
                                    type: string
                                switch:
                                    type: string
                                vlan:
                                    description: 'port: access VLAN or the trunk''s native VLAN (0 = none); management: its VLAN'
                                    type: integer
                                vlans:
                                    description: 'port trunk: tagged VLANs'
                                    items:
                                        type: integer
                                    type: array
            responses:
                200:
                    description: What it did or found, as text.
