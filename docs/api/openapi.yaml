                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                globalSet:
                    description: 'GlobalSet: values the scripts set with pm.globals.set (kept in the globals).'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
            required:
                - status
                - statusText
                - headers
                - body
                - size
                - ms
                - timing
                - method
                - url
                - reqHeaders
        HTTPRunRequest:
            type: object
            description: 'What to run of a collection: requests, folder, iterations, data rows.'
