        ImageView:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                file:
                    description: the image on this computer
                    type: string
                fileName:
                    description: its name on the hosts
                    type: string
                size:
                    description: bytes
                    type: integer
                sha256:
                    description: of the file, to know it is on a host already
                    type: string
                deviceType:
                    description: the sessions' device type (Linux, Cisco IOS…)
                    type: string
                cpus:
                    type: integer
                ram:
                    description: MB
                    type: integer
                nics:
                    description: network ports, the first one is management
                    type: integer
                nic:
                    description: e1000, virtio-net-pci, vmxnet3…
                    type: string
                disk:
                    description: virtio, ide, sata, scsi
                    type: string
                portName:
                    description: 'data port n as the OS calls it: "{n}" or "1/{n}"'
                    type: string
                ready:
                    description: console text when it can be logged in to ("login:")
                    type: string
                login:
                    type: string
                password:
                    description: in the keychain, never in the lab file
                    type: string
                defaultPassword:
                    description: the factory password from the vendor's guide, used while none is set
                    type: string
                prompt:
                    description: regexp of the CLI prompt (default [>#$]\s*$)
                    type: string
                day0:
                    description: first-boot commands, with {hostname} {mgmtIp} …
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                addrSet:
                    description: commands that give the management port a fixed address ({mgmtAddr} {mgmtBits} {mgmtMask} {gateway}), typed at each start when the lab's management has fixed addresses
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                answers:
                    description: questions on the console and what to answer
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuAnswer'
                extra:
                    description: more qemu options
                    type: string
                source:
                    description: where the profile came from (a GNS3 appliance…)
                    type: string
                addrCmd:
                    description: a CLI command that prints the management address (host's network mode)
                    type: string
                dhcpOn:
                    description: commands that make the management port ask DHCP for its address, typed when it has none on the host's network (a first-boot wizard may have turned DHCP off)
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                portAddr:
                    description: commands that give a data port a fixed address ({mac} its MAC, {addr} address/bits), typed at each start for the ports given one (Linux computers)
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                portShow:
                    description: a command that prints "PA <mac> <address/bits>" for each address of each port (Linux computers)
                    type: string
                portAddr6:
                    description: commands that give a data port a fixed IPv6 address ({mac} {addr})
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                portAuto6:
                    description: commands that make a data port take its IPv6 address from router advertisements ({mac})
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                routeSet:
                    description: commands that set the default gateways and DNS server ({gw} {gw6} {dns})
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                elevate:
                    description: 'typed after each login to become root when the console logs in as a plain user (Tiny Core: tc)'
                    type: string
                portDhcp:
                    description: commands that make a data port ask DHCP for its address ({mac}), for the ports set to dhcp
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                lagCmd:
                    description: a CLI command that lists the LAGs ("show sharing" on EXOS, "show mlt" on VOSS)
                    type: string
                lagSet:
                    description: 'CLI commands that make a LAG, per mode ("lacp", "static"): {id} {name} {ports} {master} {first} {last}'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type:
                            - array
                            - "null"
                        items:
                            type: string
                lagDel:
                    description: CLI commands that remove a LAG (the same names)
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                tcgCpu:
                    type: string
                facts:
                    description: CLI commands that read the switch's software version and serial number after it booted
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuFact'
                mgmtMacAlign:
                    description: the OS takes its management MAC from its first NIC's address rounded down to this block (a power of two; 0 = it uses the NIC's address)
                    type: integer
                packNic:
                    description: the device pack's network card the image last took (a newer pack's default replaces it once; the user's own choice stays)
                    type: string
                portMacs:
                    description: 'data ports'' MAC addresses: "" = the switch''s base MAC + port number, "own" = a range of their own (as GNS3 gives)'
                    type: string
                mgmtMacOffset:
                    description: '… plus this (Fabric Engine: block 1024, OOB at +0x81 = 129) // the CPU model it gets on a host without KVM (for example Nehalem, for an image that wants an Intel CPU); "" = QEMU''s default'
                    type: integer
                bootAnswers:
                    description: menus the image may stop at while it boots (the end of its console log), and what to type
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuAnswer'
                bootFail:
                    description: 'console lines (regular expressions) that say its boot failed: they go to Events'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                notReady:
                    description: 'console text that means its login is not ready yet ("(pending-AAA)"): nothing is typed until it is gone'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                neighborCmd:
                    description: a CLI command that lists the LLDP neighbours ("show lldp neighbors")
                    type: string
                persona:
                    description: a file that makes the image act as a given device
                    anyOf:
                        - $ref: '#/components/schemas/EmuPersonaDef'
                        - type: "null"
                version:
                    description: the software version of the image (for the lists)
                    type: string
                match:
                    description: 'profiles: a regexp on the file name that picks this profile; a "version" group gives the version'
                    type: string
                serial:
                    description: serial number format for new switches ({N:5} {A:2} {YY} {WW} …; "" = none)
                    type: string
                url:
                    description: where the image file can be downloaded (from a GNS3 appliance)
                    type: string
                md5:
                    description: its MD5 sum, to check a download
                    type: string
                page:
                    description: a web page where it can be had (an account may be needed)
                    type: string
                disks:
                    description: 'more files the VM needs: a second disk, a CD-ROM, a BIOS'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuDisk'
                hasPassword:
                    type: boolean
                onHost:
                    type: boolean
                upload:
                    type: string
                download:
                    description: 'download to this computer: "41 %"…'
                    type: string
                missing:
                    description: the file is not on this computer (any more)
                    type: boolean
            required:
                - id
                - name
                - file
                - fileName
                - size
                - sha256
                - deviceType
                - cpus
                - ram
                - nics
                - nic
                - disk
                - portName
                - ready
                - login
                - prompt
                - day0
                - answers
                - extra
                - source
                - addrCmd
                - version
                - serial
                - hasPassword
                - onHost
                - upload
                - download
                - missing
        Install:
            type: object
            properties:
                id:
                    type: string
                name:
                    description: the image's name
                    type: string
                host:
                    description: the KVM host (a session path)
                    type: string
                mode:
                    description: '"alpine" (typed by Termwright) or "manual" (the user installs on the console)'
                    type: string
                iso:
                    description: the ISO on this computer
                    type: string
                isoName:
                    type: string
                sha256:
                    type: string
                size:
                    type: integer
                gb:
                    description: the disk, rounded up to whole GB
                    type: integer
                mb:
                    description: the disk in MB (exact)
                    type: integer
                ram:
                    type: integer
                cpus:
                    type: integer
                dir:
                    description: the lab's folder on the host
                    type: string
                port:
                    description: the installer's console on the host (127.0.0.1)
                    type: integer
                stage:
                    type: string
                msg:
                    type: string
                err:
                    type: string
                image:
                    description: the image it made
                    type: string
                console:
                    description: the console session (manual installs)
                    type: string
                started:
                    type: string
                step:
                    description: Step is the one the install is on (see emuInstallStage); Marks tell when each began, so the window can show how long each took.
                    type: string
                marks:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/InstallMark'
                file:
                    description: the image file being made on the host
                    type: string
                tail:
                    description: the last lines of the installer's console
                    type: string
                disk:
                    description: 'the installer''s disk on the host: bytes written so far (the file grows as the system is installed)'
                    type: integer
                part:
                    description: 'the image being made: bytes so far'
                    type: integer
                pct:
                    description: 'the conversion to the image: percent'
                    type: number
                idle:
                    description: seconds since the installer's console showed anything
                    type: integer
                noVerify:
                    description: 'The verification boot: the image made is booted once (on a throwaway layer) to see it comes up.'
                    type: boolean
                verifyPort:
                    description: its console on the host (its monitor is the next port)
                    type: integer
                verified:
                    description: what the verification boot found ("login prompt in 42 s")
                    type: string
                verifyErr:
                    description: why it is not verified (the image is kept all the same)
                    type: string
            required:
                - id
                - name
                - host
                - mode
                - iso
                - isoName
                - sha256
                - size
                - gb
                - mb
                - ram
                - cpus
                - dir
                - port
                - stage
                - msg
                - started
                - step
        InstallMark:
            type: object
            properties:
                step:
                    type: string
                at:
                    type: string
            required:
                - step
                - at
        Lab:
            type: object
            description: 'The emulated lab as Termwright shows it: its switches, cables, KVM hosts, images and Events. The open topology only; topologies in the background are not in it.'
            properties:
                kind:
                    description: '"emu"'
                    type: string
                events:
                    type:
                        - array
                        - "null"
                    items:
