        SNMPRequest:
            type: object
            description: One SNMP operation against a saved session or a target.
            properties:
                session:
                    description: 'Session: the path of a saved session whose SNMP settings are used.'
                    type: string
                target:
                    description: 'Target: an address and credentials instead of a session. With a session as well, the secrets not given come from that session.'
                    anyOf:
                        - $ref: '#/components/schemas/SNMPTarget'
                        - type: "null"
                op:
                    description: 'Op: get, getnext, bulk, walk or set.'
                    type: string
                oids:
                    description: 'OIDs: numeric OIDs or names (sysDescr.0, IF-MIB::ifTable, ifOperStatus).'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                values:
                    description: Values to write (op set).
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/SNMPValue'
                maxRep:
                    description: 'MaxRep: GetBulk''s max-repetitions (default 25).'
                    type: integer
                max:
                    description: 'Max: at most this many values in a walk (default 10000).'
                    type: integer
                timeout:
                    description: Timeout per try in seconds (default 3).
                    type: integer
                confirmed:
                    description: 'Confirmed: the user confirmed a Set on a production session.'
                    type: boolean
            required:
                - op
        SNMPResult:
            type: object
            description: The values an SNMP operation returned, with the MIB's names.
            properties:
                rows:
                    description: 'Rows: the values, in OID order for a walk.'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/SNMPRow'
                address:
                    description: Address the request went to.
                    type: string
                version:
                    description: 'Version used: 1, 2c or 3.'
                    type: string
                engineId:
                    description: 'EngineID: the agent''s v3 engine ID (hex).'
                    type: string
                ms:
                    description: 'Ms: how long it took.'
                    type: integer
                requests:
                    description: 'Requests: SNMP messages sent.'
                    type: integer
                truncated:
                    description: 'Truncated: the walk stopped at max values.'
                    type: boolean
                unknown:
                    description: 'Unknown: how many values no loaded MIB describes.'
                    type: integer
                suggest:
                    description: 'Suggest: MIB modules to load for them (most likely first).'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - rows
                - address
                - version
                - ms
                - requests
        SNMPRow:
            type: object
            properties:
                oid:
                    description: 'OID: the numeric OID.'
                    type: string
                name:
                    description: 'Name: MODULE::object.instance, or the OID when no loaded MIB knows it.'
                    type: string
                object:
                    description: 'Object: the MIB object''s name (ifDescr).'
                    type: string
                module:
                    description: 'Module: the MIB module (IF-MIB).'
                    type: string
                instance:
                    description: 'Instance: what follows the object''s OID (the table index; 0 for a scalar).'
                    type: string
                type:
                    description: 'Type: the SNMP type of the value (Integer, OctetString, Counter64…).'
                    type: string
                value:
                    description: 'Value: the raw value as text.'
                    type: string
                display:
                    description: 'Display: the value as a person reads it (enum names, time, MAC addresses, units).'
                    type: string
                unknown:
                    description: 'Unknown: no loaded MIB describes this object (Object is then the nearest known branch and the path below it).'
                    type: boolean
                suggest:
                    description: 'Suggest: the MIB module that most likely describes it (load it to see names and meanings).'
                    type: string
            required:
                - oid
                - name
                - type
                - value
                - display
        SNMPTarget:
            type: object
            properties:
                address:
                    description: 'Address: host or host:port (UDP 161).'
                    type: string
                version:
                    description: 'Version: 1, 2c or 3.'
                    type: string
                community:
                    description: Community for v1/v2c (default public).
                    type: string
                user:
                    description: 'User: the v3 user.'
                    type: string
                auth:
                    description: 'Auth: v3 authentication: MD5, SHA, SHA-224, SHA-256, SHA-384, SHA-512 or empty.'
                    type: string
                authPass:
                    description: 'AuthPass: the v3 authentication password.'
                    type: string
                priv:
                    description: 'Priv: v3 privacy: DES, AES, AES-192, AES-256 or empty.'
                    type: string
                privPass:
                    description: 'PrivPass: the v3 privacy password.'
                    type: string
                context:
                    description: 'Context: the v3 context name.'
                    type: string
            required:
                - address
        SNMPTrapSendIn:
            type: object
            properties:
                address:
                    description: 'Address: the receiver, host or host:port (162).'
                    type: string
                version:
                    description: 'Version: 1, 2c (default) or 3.'
                    type: string
                community:
                    description: Community for v1/v2c (default public).
                    type: string
                user:
                    description: 'User, Auth, AuthPass, Priv, PrivPass: v3.'
                    type: string
                auth:
                    type: string
                authPass:
                    type: string
                priv:
                    type: string
                privPass:
                    type: string
                trapOid:
                    description: 'TrapOID: the notification (IF-MIB::linkDown, or an OID).'
                    type: string
                values:
                    description: Values sent with it (types from the MIB when left out).
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/SNMPValue'
            required:
                - address
                - trapOid
        SNMPTrapState:
            type: object
            properties:
                on:
                    description: 'On: the receiver listens.'
                    type: boolean
                port:
                    description: 'Port: its UDP port.'
                    type: integer
                error:
                    description: 'Error: why it could not start (a port in use, or below 1024 without permission).'
                    type: string
                count:
                    description: 'Count: notifications received since it started.'
                    type: integer
            required:
                - "on"
                - port
                - count
        SNMPTrapView:
            type: object
            properties:
                at:
                    type: string
                    format: date-time
                from:
                    type: string
                version:
                    type: string
                community:
                    type: string
                user:
                    type: string
                kind:
                    type: string
                trapOid:
                    type: string
                uptime:
                    type: integer
                varbinds:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/Varbind'
                note:
                    type: string
                name:
                    description: 'Name: the notification''s name (IF-MIB::linkDown).'
                    type: string
                rows:
                    description: 'Rows: its values with names.'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/SNMPRow'
                session:
                    description: 'Session: the saved session at that address, if any.'
                    type: string
            required:
                - at
                - from
                - version
                - kind
                - trapOid
                - uptime
                - varbinds
                - name
                - rows
        SNMPTrapsView:
            type: object
            description: The trap receiver and the notifications it got.
            properties:
                state:
                    $ref: '#/components/schemas/SNMPTrapState'
                    description: 'State: whether it listens, on which port.'
                traps:
                    description: 'Traps: the notifications, newest first.'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/SNMPTrapView'
            required:
                - state
                - traps
        SNMPValue:
            type: object
            properties:
                oid:
                    description: 'OID: a numeric OID or a name with its instance (ifAdminStatus.5, SNMPv2-MIB::sysContact.0).'
                    type: string
                type:
                    description: 'Type: Integer, OctetString, Hex, ObjectIdentifier, IpAddress, Counter32, Gauge32, TimeTicks, Counter64 - or empty: from the MIB.'
                    type: string
                value:
                    description: Value as text; an enumerated Integer takes its name too (down).
                    type: string
            required:
                - oid
                - value
        SessionResult:
            type: object
            description: 'A session stream''s TCP sessions: tried, connected, refused, timed out, their setup time and rate.'
            properties:
                tried:
                    description: opened (SYN sent)
                    type: integer
                ok:
                    description: connected (the SYN-ACK came back)
                    type: integer
                refused:
                    description: answered with a reset
                    type: integer
                timeout:
                    description: no answer, or not finished in time
                    type: integer
                reset:
                    description: reset after they connected
                    type: integer
                done:
                    description: 'finished: data both ways, then closed'
                    type: integer
                open:
                    description: open now
                    type: integer
                peak:
                    description: open at once, at most
                    type: integer
                setupAvg:
                    description: setup time (SYN to SYN-ACK), ms
                    type: number
                setupP95:
                    description: ms, 95th percentile
                    type: number
                setupMax:
                    description: ms
                    type: number
                cps:
                    description: connected a second, over the run
                    type: number
                bytes:
                    description: data bytes, both ways
                    type: integer
                secs:
                    description: how long it has run, s
                    type: number
            required:
                - tried
                - ok
                - refused
                - timeout
                - done
        Stream:
            type: object
            description: Frames from one test port to another, to every other one (broadcast), to an address or to a multicast group.
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (unique; the API and command line find it by it)
                    type: string
                from:
                    description: the test port it is sent from (id; the API takes a name too)
                    type: string
                to:
                    description: a test port; "" = every other one (broadcast)
                    type: string
                kind:
                    description: udp, icmp, tcp (SYN), arp, raw, custom, pcap (a capture's frames, replayed), session (real TCP sessions)
                    type: string
                vlan:
                    description: 802.1Q tag; 0 = untagged
                    type: integer
                prio:
                    description: 802.1p priority (0-7) in its VLAN tag
                    type: integer
                dstMac:
                    description: '"" = the destination test port''s (or the gateway''s, or broadcast)'
                    type: string
                srcIp:
                    description: '"" = the test ports'''
                    type: string
                dstIp:
                    description: '"" = the destination test port''s; an address that is not a test port (icmp: its replies are counted); a multicast group; IPv6 makes it an IPv6 stream'
                    type: string
                dport:
                    description: UDP or TCP destination port (default 5001 for UDP, 80 for TCP)
                    type: integer
                size:
                    description: frame bytes (60-9000; the smallest with sizeMode inc or random)
                    type: integer
                pps:
                    description: frames per second (1-100000; 2000000 with the fast engine, 100000000 between TRex ports)
                    type: integer
                seconds:
                    description: 'how long it sends (with pps: seconds × pps frames)'
                    type: integer
                count:
                    description: how many frames (instead of seconds)
                    type: integer
                maxLoss:
                    description: '% for a pass'
                    type: number
                maxLatency:
                    description: ms; 0 = not checked
                    type: number
                off:
                    description: left out of Start All
                    type: boolean
                dscp:
                    description: IP DSCP (0-63)
                    type: integer
                sizeMode:
                    description: '"" fixed, inc (Size..SizeMax, one more each frame), random, imix (64/594/1518 7:4:1)'
                    type: string
                sizeMax:
                    description: the largest frame with sizeMode inc or random
                    type: integer
                burst:
                    description: frames sent back to back (the rate is kept on average)
                    type: integer
                mods:
                    description: fields that change from frame to frame
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FieldChange'
                maxJitter:
                    description: ms for a pass (0 = not checked)
                    type: number
                test:
                    description: made by a test run for one of its trials (not one of the user's streams)
                    type: string
                rateUnit:
                    description: 'how the rate was given: "" frames per second (pps), mbps (Mbit/s on the wire), pct (% of the sending test port''s line rate)'
                    type: string
                rate:
                    description: the rate in that unit (pps is worked out from it)
                    type: number
                rtt:
                    description: 'round trip: the test port it goes to sends each frame back, and the latency is the round trip (measured on one clock, so also between test ports on two hosts)'
                    type: boolean
                pcap:
                    description: 'pcap: the capture file on this computer (classic pcap; Wireshark: Save As pcap)'
                    type: string
                pcapId:
                    description: 'pcap: the capture as Termwright keeps it (its contents'' hash; set when saved)'
                    type: string
                pcapFrames:
                    description: 'pcap: frames in the capture (set when saved)'
                    type: integer
                pcapSecs:
                    description: 'pcap: how long the capture lasts, s (set when saved)'
                    type: number
                pcapTiming:
                    description: 'pcap: send with the capture''s own gaps between frames (else at the rate)'
                    type: boolean
                loops:
                    description: 'pcap: times through the capture (default 1; count or seconds instead)'
                    type: integer
                rewriteMacs:
                    description: 'pcap, custom: frames go from this test port''s MAC to the destination test port''s (else as captured)'
                    type: boolean
                hex:
                    description: 'custom: the frame in hex, from the destination MAC on (no FCS)'
                    type: string
                udfs:
                    description: bytes at an offset that change from frame to frame (user-defined fields)
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuUDF'
                noFix:
                    description: 'custom: lengths and checksums as written (else worked out for each frame)'
                    type: boolean
                noSig:
                    description: 'custom: no counting signature (its frames are sent, not counted)'
                    type: boolean
                bad:
                    description: a fault put in every frame (BadFrames)
                    type: string
                fuzz:
                    description: random bytes in a range of every frame
                    anyOf:
                        - $ref: '#/components/schemas/EmuFuzz'
                        - type: "null"
                encap:
                    description: 'headers added around its frames: an outer tag, MPLS, a GRE or VXLAN tunnel, IPv6 extension headers'
                    anyOf:
                        - $ref: '#/components/schemas/EmuEncap'
                        - type: "null"
                expect:
                    description: '"" its frames should arrive; "drop": the switch should drop them; "any": only counted'
                    type: string
                session:
                    description: 'session: the TCP sessions it opens (to a test port, which answers them)'
                    anyOf:
                        - $ref: '#/components/schemas/EmuSession'
                        - type: "null"
            required:
                - id
                - name
                - from
                - kind
                - size
                - pps
                - maxLoss
        StreamResult:
            type: object
            description: A stream's counters, added up over every KVM host, and its verdict.
            properties:
                id:
                    description: the stream
                    type: string
                tx:
                    description: frames sent
                    type: integer
                rx:
                    description: frames received at the test ports it is for (a duplicate counts once)
                    type: integer
                expected:
                    description: frames that should arrive (to every other test port for a broadcast)
                    type: integer
                other:
                    description: arrived at a test port it was not for (flooded)
                    type: integer
                loss:
                    description: '%'
                    type: number
                latAvg:
                    description: 'ms (-1 = not measured: the ends on different hosts)'
                    type: number
                latMax:
                    description: ms
                    type: number
                latMin:
                    description: ms
                    type: number
                jitter:
                    description: ms, the mean change of latency between frames
                    type: number
                ooo:
                    description: frames that arrived after a later one
                    type: integer
                dup:
                    description: frames that arrived twice (counted once)
                    type: integer
                txRate:
                    description: frames per second, now
                    type: number
                rxRate:
                    description: frames per second, now
                    type: number
                running:
                    description: it is still sending
                    type: boolean
                result:
                    description: '"", pass, fail'
                    type: string
                why:
                    description: why it failed
                    type: string
                p50:
                    description: 'latency percentiles, ms (from a histogram of quarter octaves: within 10 %)'
                    type: number
                p95:
                    description: 'ms: 95 % of the frames were faster'
                    type: number
                p99:
                    description: 'ms: 99 % of the frames were faster'
                    type: number
                hist:
                    description: the latency histogram, an octave a bar
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/LatBin'
                flows:
                    description: 'a stream with changing fields: its flows, the most lossy first (at most 32)'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FlowResult'
                flowsN:
                    description: how many flows it has sent
                    type: integer
                flowsLossy:
                    description: how many of them lost frames
                    type: integer
                marks:
                    description: the VLAN, priority and DSCP its frames arrived with
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/Mark'
                txMbps:
                    description: Mbit/s on the wire, now
                    type: number
                rxMbps:
                    description: Mbit/s on the wire received, now
                    type: number
                sentFrame:
                    description: 'its first frame sent: its length, then up to 160 bytes in hex ("508:0004…"; no FCS)'
                    type: string
                gotFrame:
                    description: the first of its frames that arrived where it goes, the same way
                    type: string
                sessions:
                    description: 'a session stream: its TCP sessions (sent: tried, received: connected, latency: setup time)'
                    anyOf:
                        - $ref: '#/components/schemas/SessionResult'
                        - type: "null"
            required:
                - id
                - tx
                - rx
                - expected
                - other
                - loss
                - latAvg
                - latMax
                - txRate
                - rxRate
                - running
                - result
        SyslogRule:
            type: object
            description: A rule that highlights, alerts on or hides syslog messages (the first that matches wins).
            properties:
                name:
                    description: Name shown with the messages it matches.
                    type: string
                match:
                    description: 'Match: words that must all be in the message, or /regex/ ("" = any).'
                    type: string
                maxSeverity:
                    description: 'MaxSeverity: this severity or worse (0 emerg … 7 debug; -1 any).'
                    type: integer
                host:
                    description: 'Host: only from this sender ("" any).'
                    type: string
                color:
                    description: Color of the matching lines (red, amber, green, blue, purple; "" none).
                    type: string
                notify:
                    description: 'Notify: a notification in Termwright for each one.'
                    type: boolean
                hide:
                    description: 'Hide: not shown (noise).'
                    type: boolean
                off:
                    description: 'Off: kept but not used.'
                    type: boolean
            required:
                - name
                - maxSeverity
        SyslogSendIn:
            type: object
            description: A test message to send to a syslog server.
            properties:
                target:
                    description: 'Target: host or host:port (514; 6514 for TLS).'
                    type: string
                proto:
                    description: 'Proto: udp (default), tcp or tls.'
                    type: string
                format:
                    description: 'Format: 5424 (default) or 3164.'
                    type: string
                facility:
                    description: 'Facility: a name (local7) or number (default user).'
                    type: string
                severity:
                    description: 'Severity: a name (err, warning) or number (default notice).'
                    type: string
                host:
                    description: 'Host: the host name in the message (default this computer''s).'
                    type: string
                app:
                    description: 'App: the program name (default termwright).'
                    type: string
                text:
                    description: Text of the message.
                    type: string
                count:
                    description: 'Count: send it this many times (1-1000).'
                    type: integer
                insecure:
                    description: 'Insecure: TLS without checking the server''s certificate.'
                    type: boolean
            required:
                - target
                - text
        SyslogSettings:
            type: object
            description: The syslog server's ports, files and start-up.
            properties:
                udp:
                    description: UDP port (514; 0 = off). Ports below 1024 need administrator rights on macOS and Linux.
                    type: integer
                tcp:
                    description: TCP port (0 = off; 514 or 601 usually).
                    type: integer
                tls:
                    description: TLS port (0 = off; 6514 usually). A self-signed certificate is made unless Cert and Key are given.
                    type: integer
                cert:
                    description: 'Cert: TLS certificate (PEM file).'
                    type: string
                key:
                    description: 'Key: its private key (PEM file).'
                    type: string
                bind:
                    description: 'Bind: the address to listen on ("" all).'
                    type: string
                saveFiles:
                    description: 'SaveFiles: write every message to a file per day.'
                    type: boolean
                perHost:
                    description: 'PerHost: one folder per sender.'
                    type: boolean
                folder:
                    description: Folder for the files ("" = the syslog folder in Termwright's data folder).
                    type: string
                autoStart:
                    description: 'AutoStart: start receiving when Termwright starts.'
                    type: boolean
                keep:
                    description: 'Keep: messages kept in memory (default 50000).'
                    type: integer
            required:
                - udp
                - tcp
                - tls
        SyslogState:
            type: object
            description: Whether the syslog server listens, on what, and what it received.
            properties:
                on:
                    description: 'On: it listens.'
                    type: boolean
                addrs:
                    description: Addrs it listens on ("udp 0.0.0.0:514").
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                error:
                    description: 'Error: why it could not start.'
                    type: string
                counts:
                    description: Counts of messages per severity since it started (emerg … debug).
                    type: array
                    items:
                        type: integer
                    minItems: 8
                    maxItems: 8
                total:
                    description: Total messages kept.
                    type: integer
                hosts:
                    description: 'Hosts: senders and their message counts.'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: integer
                settings:
                    $ref: '#/components/schemas/SyslogSettings'
                    description: Settings in use.
                folder:
                    description: Folder the files are written to (when SaveFiles).
                    type: string
                since:
                    description: 'Since: when it started.'
                    type: string
            required:
                - "on"
                - addrs
                - counts
                - total
                - hosts
                - settings
        SyslogView:
            type: object
            description: A syslog message received, with the saved session of its sender and the rule it matched.
            properties:
                id:
                    description: 'ID: increases with every message (to ask for the newer ones).'
                    type: integer
                at:
                    description: 'At: when it was received.'
                    type: string
                    format: date-time
                from:
                    description: 'From: the sender''s address.'
                    type: string
                proto:
                    description: 'Proto: udp, tcp or tls.'
                    type: string
                facility:
                    description: 'Facility: 0-23 (16-23 are local0-local7).'
                    type: integer
                facilityName:
                    description: 'FacilityName: kern, user, … local7.'
                    type: string
                severity:
                    description: 'Severity: 0 emerg, 1 alert, 2 crit, 3 err, 4 warning, 5 notice, 6 info, 7 debug.'
                    type: integer
                severityName:
                    description: 'SeverityName: emerg … debug.'
                    type: string
                time:
                    description: Time the device put in it ("" when none or unreadable).
                    type: string
                host:
                    description: Host the device names itself.
                    type: string
                app:
                    description: 'App: the program (TAG / APP-NAME).'
                    type: string
                procId:
                    description: 'ProcID: the process id.'
                    type: string
                msgId:
                    description: 'MsgID: the message type (RFC 5424).'
                    type: string
                sd:
                    description: 'SD: structured data (RFC 5424) as written.'
                    type: string
                text:
                    description: 'Text: the message itself.'
                    type: string
                format:
                    description: 'Format: 3164, 5424 or raw.'
                    type: string
                raw:
                    description: 'Raw: the message as received.'
                    type: string
                session:
                    description: 'Session: the saved session at the sender''s address.'
                    type: string
                rule:
                    description: 'Rule: the first rule that matched.'
                    type: string
                color:
                    description: Color of that rule.
                    type: string
            required:
                - id
                - at
                - from
                - proto
                - facility
                - facilityName
                - severity
                - severityName
                - text
                - format
                - raw
        TestPort:
            type: object
            description: 'A test port: a sender and counter on a free switch port (no VM). It answers ARP, neighbour solicitations and ping at its addresses.'
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (Test port 1, …)
                    type: string
                vm:
                    description: the switch (its id) it is on
                    type: string
                port:
                    description: the switch port number it is on
                    type: integer
                mac:
                    description: its MAC address
                    type: string
                ip:
                    description: 'with its prefix (10.10.0.1/24): it answers ARP and ping there'
                    type: string
                ip6:
                    description: 'an IPv6 address with its prefix: it answers neighbour solicitations and ping there'
                    type: string
                groups:
                    description: multicast groups it joins (IGMP / MLD reports), to receive multicast streams
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                dhcp:
                    description: it takes its IPv4 address (and gateway) from a DHCP server
                    type: boolean
                slaac:
                    description: it takes its IPv6 address from router advertisements
                    type: boolean
                lldp:
                    description: it announces itself by LLDP every 30 s (the switch sees "Termwright <name>")
                    type: boolean
                lease:
                    description: the address it got by DHCP, and its gateway (filled in for the screens)
                    type: string
                lease6:
                    description: the IPv6 address it got by SLAAC (filled in for the screens)
                    type: string
                gw:
                    description: for streams to another network
                    type: string
                vlan:
                    description: it tags its own frames (ARP and ping answers) with this VLAN
                    type: integer
                speed:
                    description: its line rate, Mbit/s, for rates given as % of it (default 1000)
                    type: integer
                lag:
                    description: test ports with the same LAG name speak LACP (active) and form one link aggregation with the switch
                    type: string
                lacpFast:
                    description: LACP every second (else every 30 s)
                    type: boolean
                lacpUp:
                    description: 'the LAG as LACP has it: "up" or why not (filled in for the screens)'
                    type: string
                neighbor:
                    description: 'what the switch says on LLDP: its name and port (filled in for the screens)'
                    type: string
                clients:
                    description: many hosts behind it (DHCP, multicast, 802.1X), each with its own MAC
                    anyOf:
                        - $ref: '#/components/schemas/EmuClients'
                        - type: "null"
                stp:
                    description: it speaks spanning tree (STP or RSTP)
                    anyOf:
                        - $ref: '#/components/schemas/EmuSTP'
                        - type: "null"
                clientState:
                    description: ClientState is how its clients are doing (filled in for the screens).
                    anyOf:
                        - $ref: '#/components/schemas/EmuClientState'
                        - type: "null"
                stpState:
                    description: STPState is what it hears from the switch by spanning tree (filled in for the screens).
                    anyOf:
                        - $ref: '#/components/schemas/EmuSTPState'
                        - type: "null"
                portName:
                    description: as the switch names it (filled in for the screens)
                    type: string
                x:
                    description: on the canvas
                    type: number
                y:
                    description: on the canvas
                    type: number
                vrrp:
                    description: it is a VRRP router beside the switch
                    anyOf:
                        - $ref: '#/components/schemas/EmuVRRP'
                        - type: "null"
                bfd:
                    description: it keeps a BFD session with the switch
                    anyOf:
                        - $ref: '#/components/schemas/EmuBFD'
                        - type: "null"
                vrrpState:
                    description: what it hears by VRRP (filled in for the screens)
                    anyOf:
                        - $ref: '#/components/schemas/EmuVRRPState'
                        - type: "null"
                bfdState:
                    description: its BFD session (filled in for the screens)
                    anyOf:
                        - $ref: '#/components/schemas/EmuBFDState'
                        - type: "null"
                host:
                    description: 'a host network port: the KVM host (its session) whose spare network card it is'
                    type: string
                nic:
                    description: 'a host network port: the card''s name on that host (enp3s0, …), cabled to a real device'
                    type: string
                cabled:
                    description: 'a host network port or TRex port: what it is cabled to (for the screens and reports)'
                    type: string
                trex:
                    description: 'a TRex port: its server''s id and the port''s number there (x1a2b3/0)'
                    type: string
            required:
                - id
                - name
                - vm
                - port
                - mac
        TestRow:
            type: object
            description: 'A line of a test run''s results: per frame size and direction (and load, for frame-loss).'
            properties:
                dir:
                    description: the direction (From → To), when the test runs both ways
                    type: string
                size:
                    description: frame bytes
                    type: integer
                pps:
                    description: 'throughput: the highest rate without loss; frame-loss: the rate tried'
                    type: number
                mbps:
                    description: the rate in Mbit/s of frames (pps × size × 8)
                    type: number
                load:
                    description: 'frame-loss: % of the top rate'
                    type: number
                loss:
                    description: '% lost'
                    type: number
                latMin:
                    description: ms
                    type: number
                latAvg:
                    description: ms
                    type: number
                latMax:
                    description: ms
                    type: number
                jitter:
                    description: ms
                    type: number
                burst:
                    description: 'back-to-back: the longest burst without loss (frames)'
                    type: integer
                addresses:
                    description: 'learning: the most source MACs learned without flooding'
                    type: integer
                lost:
                    description: 'convergence: frames lost'
                    type: integer
                outageMs:
                    description: 'convergence: lost frames ÷ rate, in ms'
                    type: number
                retrans:
                    description: 'iperf TCP: retransmitted segments'
                    type: integer
                trials:
                    description: trials it took
                    type: integer
                note:
                    description: 'what happened (convergence: the action), or why there is no number'
                    type: string
            required:
                - loss
        TestRun:
            type: object
            description: 'A run of a test: its progress while it runs, then its results.'
            properties:
                id:
                    description: the run
                    type: string
                test:
                    description: the test's id
                    type: string
                name:
                    description: the test's name
                    type: string
                kind:
                    description: the test's kind
                    type: string
                status:
                    description: running, done, failed, stopped
                    type: string
                step:
                    description: what it does now
                    type: string
                started:
                    description: RFC 3339
                    type: string
                ended:
                    description: RFC 3339
                    type: string
                rows:
                    description: the results so far
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/TestRow'
                log:
                    description: every trial and its outcome
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                error:
                    description: why it failed
                    type: string
            required:
                - id
                - test
                - name
                - kind
                - status
                - started
                - rows
        Tool:
            type: object
            description: 'A lab tool: the same tools the Claude connector and the in-app AI agent use.'
            properties:
                name:
                    type: string
                description:
                    type: string
                args:
                    type:
                        - object
                        - "null"
                    additionalProperties: {}
                required:
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - name
                - description
                - args
        TrafficTest:
            type: object
            description: 'A saved traffic test, run by Termwright as a series of trials on the traffic generator: RFC 2544 throughput, latency, frame-loss and back-to-back, RFC 2889 address learning, or convergence (traffic while a cable is pulled or a switch stops or restarts); or iperf3 between two host VMs of the lab.'
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (unique)
                    type: string
                kind:
                    description: throughput, latency, frame-loss, back-to-back (RFC 2544), learning (RFC 2889 address caching), convergence, iperf (iperf3 between two host VMs)
                    type: string
                from:
                    description: the test port the frames go from (id; the API takes a name too)
                    type: string
                to:
                    description: the test port they go to
                    type: string
                both:
                    description: also the other way, at the same time (throughput, latency, frame-loss, convergence)
                    type: boolean
                monitor:
                    description: 'learning: a third test port that sees frames flooded to it'
                    type: string
                vlan:
                    description: 802.1Q tag on the test frames
                    type: integer
                sizes:
                    description: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)
                    type:
                        - array
                        - "null"
                    items:
                        type: integer
                trial:
                    description: seconds per trial (default 5)
                    type: integer
                maxPps:
                    description: the highest rate tried, frames per second (default 10000)
                    type: integer
                rate:
                    description: 'latency, frame-loss, convergence: the rate (default: latency the throughput found at that size, else 1000)'
                    type: integer
                loss:
                    description: loss % that still counts as none (default 0)
                    type: number
                resolution:
                    description: 'throughput, back-to-back, learning: the search stops when the step is below this % (default 2)'
                    type: number
                max:
                    description: 'back-to-back: the longest burst tried (frames, default 10000); learning: the most addresses tried (default 4096)'
                    type: integer
                action:
                    description: 'convergence: pull (a cable or LAG member), stop (a switch), restart (a switch)'
                    type: string
                switch:
                    description: 'convergence: the switch (name or id)'
                    type: string
                port:
                    description: 'convergence, pull: the port whose cable is pulled'
                    type: string
                at:
                    description: 'convergence: seconds after the start (default 5)'
                    type: integer
                hold:
                    description: 'convergence: seconds until the cable is plugged in or the switch started again (0 = not)'
                    type: integer
                seconds:
                    description: 'convergence, iperf: how long the traffic runs (default 30, iperf 10)'
                    type: integer
                server:
                    description: 'iperf: the host VM (name or id) that runs iperf3 -s'
                    type: string
                client:
                    description: 'iperf: the host VM that runs iperf3 -c'
                    type: string
                serverIp:
                    description: 'iperf: the server''s address the client connects to (default: its first data port with a fixed address, else its management address)'
                    type: string
                proto:
                    description: 'iperf: tcp (default) or udp'
                    type: string
                bandwidth:
                    description: 'iperf: target rate (iperf3 -b: 100M, 1G; udp default 1M)'
                    type: string
                parallel:
                    description: 'iperf: parallel streams (iperf3 -P)'
                    type: integer
                reverse:
                    description: 'iperf: the server sends (iperf3 -R)'
                    type: boolean
            required:
                - id
                - name
                - kind
        TrafficView:
            type: object
            description: 'The traffic generator: its test ports, streams and their results now (live while a run goes on).'
            properties:
                testers:
                    description: the test ports
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/TestPort'
                streams:
                    description: the streams
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/Stream'
                results:
                    description: 'per stream: its counters and verdict (the last run''s, or the running one''s)'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/StreamResult'
                running:
                    description: a run is going on
                    type: boolean
                started:
                    description: when the run started (RFC 3339)
                    type: string
                note:
                    description: something to do (restart a switch for its test port)
                    type: string
                history:
                    description: 'History: per stream, the run so far ([seconds since the start, tx/s, rx/s, loss % so far, average latency ms (-1: not measured)]), for the graphs.'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type:
                            - array
                            - "null"
                        items:
                            type: array
                            items:
                                type: number
                            minItems: 5
                            maxItems: 5
                ports:
                    description: 'per test port: its statistics over the run'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/PortResult'
                portHistory:
                    description: 'per test port: its rates over the last minute ([seconds since the start, tx/s, rx/s])'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type:
                            - array
                            - "null"
                        items:
                            type: array
                            items:
                                type: number
                            minItems: 3
                            maxItems: 3
            required:
                - testers
                - streams
                - results
                - running
        Trex:
            type: object
            description: 'A TRex server (stateless mode) and what Termwright last found there: its version and ports.'
            properties:
                id:
                    description: its id
                    type: string
                name:
                    description: its name
                    type: string
                addr:
                    description: its address
                    type: string
                port:
                    description: its RPC port (default 4501)
                    type: integer
                state:
                    description: connected, unreachable, or not checked
                    type: string
                version:
                    description: TRex's version
                    type: string
                err:
                    description: why it could not be reached
                    type: string
                ports:
                    description: its ports
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/TrexPort'
            required:
                - id
                - name
                - addr
        TrexPort:
            type: object
            description: A TRex port; one that is used is a test port.
            properties:
                id:
                    description: its number
                    type: integer
                speed:
                    description: Mbit/s
                    type: integer
                link:
                    description: up
                    anyOf:
                        - type: boolean
                        - type: "null"
                mac:
                    description: its MAC address
                    type: string
                driver:
                    description: its DPDK driver
                    type: string
                cabled:
                    description: what it is cabled to
                    type: string
                use:
                    description: it is a test port
                    type: boolean
                tester:
                    description: that test port's name
                    type: string
            required:
                - id
        Usage:
            type: object
            properties:
                hostCpus:
                    type: integer
                hostMemTotal:
                    description: MB
                    type: integer
                hostMemFree:
                    description: MB, available now
                    type: integer
                load:
                    type: number
                running:
                    type: integer
                vcpus:
                    description: of the running switches
                    type: integer
                ram:
                    description: MB, of the running switches
                    type: integer
                cores:
                    description: host cores they use now
                    type: number
                diskGb:
                    type: integer
                saved:
                    description: MB, about what the saved running states take on the hosts' disks
                    type: integer
            required:
                - hostCpus
                - hostMemTotal
                - hostMemFree
                - load
                - running
                - vcpus
                - ram
                - cores
                - diskGb
                - saved
        Varbind:
            type: object
            properties:
                oid:
                    type: string
                type:
                    type: string
                int:
                    type: integer
                uint:
                    type: integer
                bytes:
                    type: string
                    contentEncoding: base64
                value:
                    type: string
            required:
                - oid
                - type
                - value
        StreamInput:
            type: object
            description: A stream to add or to replace one with. Only from is needed; the rest has defaults (udp, 128 bytes, 100 pps, 10 s, no loss allowed). from and to can be test port names or ids. Unknown fields are refused.
            properties:
                name:
                    description: its name (unique; the API and command line find it by it)
                    type: string
                from:
                    description: the test port it is sent from (id; the API takes a name too)
                    type: string
                to:
                    description: a test port; "" = every other one (broadcast)
                    type: string
                kind:
                    description: udp, icmp, tcp (SYN), arp, raw, custom, pcap (a capture's frames, replayed), session (real TCP sessions)
                    type: string
                vlan:
                    description: 802.1Q tag; 0 = untagged
                    type: integer
                prio:
                    description: 802.1p priority (0-7) in its VLAN tag
                    type: integer
                dstMac:
                    description: '"" = the destination test port''s (or the gateway''s, or broadcast)'
                    type: string
                srcIp:
                    description: '"" = the test ports'''
                    type: string
                dstIp:
                    description: '"" = the destination test port''s; an address that is not a test port (icmp: its replies are counted); a multicast group; IPv6 makes it an IPv6 stream'
                    type: string
                dport:
                    description: UDP or TCP destination port (default 5001 for UDP, 80 for TCP)
                    type: integer
                size:
                    description: frame bytes (60-9000; the smallest with sizeMode inc or random)
                    type: integer
                pps:
                    description: frames per second (1-100000; 2000000 with the fast engine, 100000000 between TRex ports)
                    type: integer
                seconds:
                    description: 'how long it sends (with pps: seconds × pps frames)'
                    type: integer
                count:
                    description: how many frames (instead of seconds)
                    type: integer
                maxLoss:
                    description: '% for a pass'
                    type: number
                maxLatency:
                    description: ms; 0 = not checked
                    type: number
                off:
                    description: left out of Start All
                    type: boolean
                dscp:
                    description: IP DSCP (0-63)
                    type: integer
                sizeMode:
                    description: '"" fixed, inc (Size..SizeMax, one more each frame), random, imix (64/594/1518 7:4:1)'
                    type: string
                sizeMax:
                    description: the largest frame with sizeMode inc or random
                    type: integer
                burst:
                    description: frames sent back to back (the rate is kept on average)
                    type: integer
                mods:
                    description: fields that change from frame to frame
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FieldChange'
                maxJitter:
                    description: ms for a pass (0 = not checked)
                    type: number
                test:
                    description: made by a test run for one of its trials (not one of the user's streams)
                    type: string
                rateUnit:
                    description: 'how the rate was given: "" frames per second (pps), mbps (Mbit/s on the wire), pct (% of the sending test port''s line rate)'
                    type: string
                rate:
                    description: the rate in that unit (pps is worked out from it)
                    type: number
                rtt:
                    description: 'round trip: the test port it goes to sends each frame back, and the latency is the round trip (measured on one clock, so also between test ports on two hosts)'
                    type: boolean
                pcap:
                    description: 'pcap: the capture file on this computer (classic pcap; Wireshark: Save As pcap)'
                    type: string
                pcapId:
                    description: 'pcap: the capture as Termwright keeps it (its contents'' hash; set when saved)'
                    type: string
                pcapFrames:
                    description: 'pcap: frames in the capture (set when saved)'
                    type: integer
                pcapSecs:
                    description: 'pcap: how long the capture lasts, s (set when saved)'
                    type: number
                pcapTiming:
                    description: 'pcap: send with the capture''s own gaps between frames (else at the rate)'
                    type: boolean
                loops:
                    description: 'pcap: times through the capture (default 1; count or seconds instead)'
                    type: integer
                rewriteMacs:
                    description: 'pcap, custom: frames go from this test port''s MAC to the destination test port''s (else as captured)'
                    type: boolean
                hex:
                    description: 'custom: the frame in hex, from the destination MAC on (no FCS)'
                    type: string
                udfs:
                    description: bytes at an offset that change from frame to frame (user-defined fields)
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuUDF'
                noFix:
                    description: 'custom: lengths and checksums as written (else worked out for each frame)'
                    type: boolean
                noSig:
                    description: 'custom: no counting signature (its frames are sent, not counted)'
                    type: boolean
                bad:
                    description: a fault put in every frame (BadFrames)
                    type: string
                fuzz:
                    description: random bytes in a range of every frame
                    anyOf:
                        - $ref: '#/components/schemas/EmuFuzz'
                        - type: "null"
                encap:
                    description: 'headers added around its frames: an outer tag, MPLS, a GRE or VXLAN tunnel, IPv6 extension headers'
                    anyOf:
                        - $ref: '#/components/schemas/EmuEncap'
                        - type: "null"
                expect:
                    description: '"" its frames should arrive; "drop": the switch should drop them; "any": only counted'
                    type: string
                session:
                    description: 'session: the TCP sessions it opens (to a test port, which answers them)'
                    anyOf:
                        - $ref: '#/components/schemas/EmuSession'
                        - type: "null"
            required:
                - from
            additionalProperties: false
        TestInput:
            type: object
            description: A test to add or to replace one with. kind is needed, and from and to (test port names or ids) for every kind but iperf; monitor for learning; action, switch and port for convergence; server and client (host VM names) for iperf. Unknown fields are refused.
            properties:
                name:
                    description: its name (unique)
                    type: string
                kind:
                    description: throughput, latency, frame-loss, back-to-back (RFC 2544), learning (RFC 2889 address caching), convergence, iperf (iperf3 between two host VMs)
                    type: string
                from:
                    description: the test port the frames go from (id; the API takes a name too)
                    type: string
                to:
                    description: the test port they go to
                    type: string
                both:
                    description: also the other way, at the same time (throughput, latency, frame-loss, convergence)
                    type: boolean
                monitor:
                    description: 'learning: a third test port that sees frames flooded to it'
                    type: string
                vlan:
                    description: 802.1Q tag on the test frames
                    type: integer
                sizes:
                    description: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)
                    type:
                        - array
                        - "null"
                    items:
                        type: integer
                trial:
                    description: seconds per trial (default 5)
                    type: integer
                maxPps:
                    description: the highest rate tried, frames per second (default 10000)
                    type: integer
                rate:
                    description: 'latency, frame-loss, convergence: the rate (default: latency the throughput found at that size, else 1000)'
                    type: integer
                loss:
                    description: loss % that still counts as none (default 0)
                    type: number
                resolution:
                    description: 'throughput, back-to-back, learning: the search stops when the step is below this % (default 2)'
                    type: number
                max:
                    description: 'back-to-back: the longest burst tried (frames, default 10000); learning: the most addresses tried (default 4096)'
                    type: integer
                action:
                    description: 'convergence: pull (a cable or LAG member), stop (a switch), restart (a switch)'
                    type: string
                switch:
                    description: 'convergence: the switch (name or id)'
                    type: string
                port:
                    description: 'convergence, pull: the port whose cable is pulled'
                    type: string
                at:
                    description: 'convergence: seconds after the start (default 5)'
                    type: integer
                hold:
                    description: 'convergence: seconds until the cable is plugged in or the switch started again (0 = not)'
                    type: integer
                seconds:
                    description: 'convergence, iperf: how long the traffic runs (default 30, iperf 10)'
                    type: integer
                server:
                    description: 'iperf: the host VM (name or id) that runs iperf3 -s'
                    type: string
                client:
                    description: 'iperf: the host VM that runs iperf3 -c'
                    type: string
                serverIp:
                    description: 'iperf: the server''s address the client connects to (default: its first data port with a fixed address, else its management address)'
                    type: string
                proto:
                    description: 'iperf: tcp (default) or udp'
                    type: string
                bandwidth:
                    description: 'iperf: target rate (iperf3 -b: 100M, 1G; udp default 1M)'
                    type: string
                parallel:
                    description: 'iperf: parallel streams (iperf3 -P)'
                    type: integer
                reverse:
                    description: 'iperf: the server sends (iperf3 -R)'
                    type: boolean
            required:
                - kind
            additionalProperties: false
    responses:
        BadRequest:
            description: 'The request is not right: not JSON, an unknown field or format.'
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Unauthorized:
            description: No key, or a wrong one.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Forbidden:
            description: The local API is off, or the request came from a web page.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        NotFound:
            description: No such path, test port, stream or tool.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        MethodNotAllowed:
            description: Not this method here (the Allow header lists the ones that are).
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Unprocessable:
            description: 'The lab could not do it: the reason is in detail (no such switch, a port in use, no stream to start…).'
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: The key from Settings → AI Assistant → Local API → Copy Key (or token in mcp.json). A new one each time Termwright starts.
