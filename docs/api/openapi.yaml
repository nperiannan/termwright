                    description: 1-255, as on the switch
                    type: integer
                prio:
                    description: 1-254 (the switch's default is 100)
                    type: integer
                vip:
                    description: the virtual address (IPv6 with VRRPv3 only)
                    type: string
                interval:
                    description: advertisement interval, ms (default 1000; VRRPv2 rounds to seconds)
                    type: integer
                preempt:
