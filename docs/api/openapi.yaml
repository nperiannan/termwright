                noCookies:
                    description: 'NoCookies: neither send nor keep cookies.'
                    type: boolean
                maxRedirects:
                    description: 'MaxRedirects followed (0: 10).'
                    type: integer
                timeoutMs:
                    description: 'TimeoutMs of the request (0: the session''s, 30 s).'
                    type: integer
        HTTPTestResult:
            type: object
            properties:
