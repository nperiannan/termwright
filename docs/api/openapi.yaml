                - pass
        HTTPSendRequest:
            type: object
            description: A request to send with an API session (its base URL, authentication and variables).
            properties:
                session:
                    description: 'Session: an API session''s path (base URL, authentication, variables); "" sends the request as it is.'
                    type: string
