                    type: integer
                model:
                    description: persona model ("" = none)
                    type: string
                module:
                    type: string
                values:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                serialStart:
                    description: the first serial number; the next switches count up from it
                    type: string
                macStart:
                    description: the first switch's base MAC; the next ones follow
                    type: string
            required:
                - id
                - name
                - image
                - cpus
                - ram
                - diskGb
                - model
                - module
                - values
                - serialStart
                - macStart
        Event:
            type: object
            description: A line of the lab's Events log.
            properties:
                at:
                    type: string
                    format: date-time
                vm:
                    type: string
                name:
                    type: string
                level:
                    description: '"info", "ok", "warn", "error"'
                    type: string
                text:
                    type: string
                host:
                    description: 'the host it happened on (when it happened: a switch may move later)'
                    type: string
                by:
                    description: 'who caused it: user, ai, system'
                    type: string
            required:
                - at
                - vm
                - name
                - level
                - text
        FieldChange:
            type: object
            description: 'A field of a stream''s frames that changes from frame to frame: its value plus 0, step, 2·step… (count values, then again), or one of them at random.'
            properties:
                field:
                    description: srcMac, dstMac, srcIp, dstIp, vlan, sport, dport
                    type: string
                mode:
                    description: inc, random
                    type: string
                count:
                    description: how many values (then again from the first)
                    type: integer
                step:
                    description: how far apart they are (default 1)
                    type: integer
            required:
                - field
                - mode
                - count
        FlowResult:
            type: object
            properties:
                flow:
                    description: its number (0 = every field at its first value)
                    type: integer
                name:
                    description: its field values (dport 5002, srcIp 10.0.0.3)
                    type: string
                tx:
                    description: frames sent
                    type: integer
                rx:
                    description: frames received
                    type: integer
                loss:
                    description: '%'
                    type: number
                latAvg:
                    description: ms (-1 = not measured)
                    type: number
                latMax:
                    description: ms
                    type: number
            required:
                - flow
                - name
                - tx
                - rx
                - loss
                - latAvg
                - latMax
        Host:
