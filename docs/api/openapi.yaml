                bridge:
                    description: the switch's own bridge (priority/MAC)
                    type: string
                cost:
                    description: the switch's path cost to the root
                    type: integer
                role:
                    description: 'RSTP: the role of the switch port that sent it'
                    type: string
                rootIsUs:
                    description: the switch takes this test port as the root
                    type: boolean
                tc:
                    description: the last BPDU carried a topology change
                    type: boolean
            required:
                - sent
                - got
        EmuServer:
            type: object
            properties:
                http:
                    type: boolean
                httpPort:
                    description: 0 = 80
                    type: integer
                ftp:
                    type: boolean
                ftpPort:
                    description: 0 = 21
                    type: integer
                tftp:
                    type: boolean
                tftpWrite:
                    description: uploads by TFTP (a switch saving its configuration)
                    type: boolean
                dhcp:
                    description: on DHCPPort
                    type: boolean
                dhcpPort:
                    description: the data port it serves (0 = 1)
                    type: integer
                from:
                    description: the first address it gives
                    type: string
                to:
                    description: the last
                    type: string
                gateway:
                    description: option router ("" = none)
                    type: string
                dns:
                    description: option dns ("" = none)
                    type: string
                lease:
                    description: seconds (0 = 3600)
                    type: integer
                bootFile:
                    description: option 67 (a file in the shared folder)
                    type: string
                bootFrom:
                    description: the TFTP server it names (siaddr, option 66; "" = itself)
                    type: string
                user:
                    description: the FTP and SSH user ("" = lab); its password is kept in the keychain
                    type: string
                installed:
                    description: its packages are in its disk
                    type: boolean
            required:
                - http
                - ftp
                - tftp
                - tftpWrite
                - dhcp
        EmuSession:
            type: object
            description: 'A session stream''s TCP sessions: how many, how fast, what they send and what should happen to them.'
            properties:
                dport:
                    description: the server port (default 80)
                    type: integer
                count:
                    description: sessions in all (default 1000)
                    type: integer
                concurrent:
                    description: open at once at most (default 100)
                    type: integer
                rate:
                    description: opened a second (default 100)
                    type: number
                req:
                    description: bytes the client sends
                    type: integer
                resp:
                    description: bytes the server sends back
                    type: integer
                hold:
                    description: seconds each stays open after its data
                    type: number
                http:
