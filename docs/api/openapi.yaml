    /lab/tools/routes:
        post:
            operationId: tool_routes
            tags:
                - Tools
            summary: A Linux computer of the lab as a route generator
            description: 'A Linux computer of the lab as a route generator: FRR speaks OSPF or BGP with the switch on one of its data ports and advertises many prefixes (up to 10000); the computer answers ping on every address in them, so an ICMP stream from a test port to the prefixes shows whether the switch forwards to the routes it learned. The computer''s port needs a fixed address (lab_computer) and internet to install FRR; the switch needs OSPF on that network (or a BGP neighbour) and a route back to the test port. Actions: set (computer, proto ospf|bgp, port, routes, prefix 100.64.0.0/24, area, as, peer, peer_as), show (computer: neighbour state, prefixes), off (computer), stream (computer, from: the test port, pps: an ICMP stream to every prefix). Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - set
                                        - show
                                        - "off"
                                        - stream
                                    type: string
                                area:
                                    description: OSPF area (default 0.0.0.0)
                                    type: string
                                as:
                                    description: 'BGP: its AS (default 65001)'
                                    type: integer
                                computer:
                                    type: string
                                from:
                                    description: 'stream: the test port it is sent from'
                                    type: string
                                peer:
                                    description: 'BGP: the switch''s address'
                                    type: string
                                peer_as:
                                    description: 'BGP: the switch''s AS (default 65000)'
                                    type: integer
                                port:
                                    description: its data port (1 = the first)
                                    type: integer
                                pps:
                                    type: integer
                                prefix:
                                    description: the first prefix with its length (default 100.64.0.0/24)
                                    type: string
                                proto:
                                    enum:
                                        - ospf
                                        - bgp
                                    type: string
                                routes:
                                    description: prefixes to advertise (1-10000)
                                    type: integer
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools/test:
        post:
            operationId: tool_test
            tags:
                - Tools
            summary: Traffic tests on the emulated lab's test ports, run by Termwright as a series of trials
            description: 'Traffic tests on the emulated lab''s test ports, run by Termwright as a series of trials: RFC 2544 throughput (the highest rate without loss per frame size), latency (at that rate), frame-loss (loss from 100 % down to 10 % of the top rate) and back-to-back (the longest burst without loss), RFC 2889 learning (how many source MACs a switch learns before it floods; needs a third test port as monitor), convergence (traffic while a cable is pulled or a switch stops or restarts: the frames lost and the outage in ms), and iperf (iperf3 between two host VMs of the lab, on their consoles: TCP or UDP rate, retransmits, jitter, loss). Actions: list (saved tests and the latest runs), add, remove, run (in the background), stop, results (of a run; the latest when no run is given). Adding, running and stopping are asked in Termwright first. Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - list
                                        - add
                                        - remove
                                        - run
                                        - stop
                                        - results
                                    type: string
                                at:
                                    description: 'add, convergence: seconds after the start (default 5)'
                                    type: integer
                                bandwidth:
                                    description: 'add, iperf: target rate (100M, 1G; udp default 1M)'
                                    type: string
                                both:
                                    description: 'add: both ways at the same time'
                                    type: boolean
                                client:
                                    description: 'add, iperf: the host VM that runs iperf3 -c'
                                    type: string
                                from:
                                    description: 'add: the test port the frames go from (name)'
                                    type: string
                                hold:
                                    description: 'add, convergence: seconds until the cable is plugged in / the switch started again (0 = not)'
                                    type: integer
                                kind:
                                    enum:
                                        - throughput
                                        - latency
                                        - frame-loss
                                        - back-to-back
                                        - learning
                                        - convergence
                                        - iperf
                                    type: string
                                loss:
                                    description: 'add: loss % that still counts as none (default 0)'
                                    type: number
                                max:
                                    description: 'add: back-to-back the longest burst, learning the most addresses tried'
                                    type: integer
                                max_pps:
                                    description: 'add: the highest rate tried (default 10000)'
                                    type: integer
                                monitor:
                                    description: 'add, learning: a third test port that sees flooded frames'
                                    type: string
                                name:
                                    description: 'add: its name; remove, run: the test'
                                    type: string
                                parallel:
                                    description: 'add, iperf: parallel streams'
                                    type: integer
                                port:
                                    description: 'add, convergence pull: the port whose cable is pulled'
                                    type: string
                                proto:
                                    description: add, iperf
                                    enum:
                                        - tcp
                                        - udp
                                    type: string
                                rate:
                                    description: 'add: latency, frame-loss, convergence: the rate (pps)'
                                    type: integer
                                resolution:
                                    description: 'add: search resolution, % (default 2)'
                                    type: number
                                reverse:
                                    description: 'add, iperf: the server sends'
                                    type: boolean
                                run:
                                    description: 'results: the run id (default the latest)'
                                    type: string
                                seconds:
                                    description: 'add, convergence: how long the traffic runs (default 30)'
                                    type: integer
                                server:
                                    description: 'add, iperf: the host VM that runs iperf3 -s'
                                    type: string
                                server_ip:
                                    description: 'add, iperf: the server''s address (on its data port; default its management address)'
                                    type: string
                                sizes:
                                    description: 'add: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)'
                                    items:
                                        type: integer
                                    type: array
                                switch:
                                    description: 'add, convergence: the switch'
                                    type: string
                                test_action:
                                    description: 'add, convergence: what happens during the traffic'
                                    enum:
                                        - pull
                                        - stop
                                        - restart
                                    type: string
                                to:
                                    description: 'add: the test port they go to'
                                    type: string
                                trial:
                                    description: 'add: seconds per trial (default 5)'
                                    type: integer
                                vlan:
                                    type: integer
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools/traffic:
        post:
            operationId: tool_traffic
            tags:
                - Tools
            summary: The emulated lab's traffic generator
            description: 'The emulated lab''s traffic generator: test ports on free switch ports (a sender and counter, no VM; it answers ARP and ping at its address) and streams of frames between them (udp, icmp, tcp SYN, arp, raw; VLAN tag, size, packets per second, seconds or count, pass when loss and latency are within limits). Actions: list, add_port, remove_port, add_stream, remove_stream, start, stop, report (pass/fail per stream with sent, received, loss, latency min/avg/p50/p95/p99/max, and per flow for streams with changing fields), stats (every test port''s counters at once: frames and rates each way, Mbit/s, loss of the frames that were for it, latency, errors). Rates in pps, Mbit/s or % of line rate; round_trip streams measure latency across hosts. Kind pcap replays a capture file''s frames (counted at the receiver by their contents). templates lists a library of ready tests (unicast, IMIX, QoS classes, MAC table fill, round trip, broadcast, RFC 2544/2889); apply_template puts one on the test ports given for its roles; save_template keeps the lab''s streams and tests as a template of yours. Changes and starts are not asked; they are kept in the lab''s change history (lab_history). Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - list
                                        - add_port
                                        - set_port
                                        - remove_port
                                        - add_stream
                                        - remove_stream
                                        - start
                                        - stop
                                        - report
                                        - stats
                                        - templates
                                        - apply_template
                                        - save_template
                                        - remove_template
                                    type: string
                                burst:
                                    description: 'add_stream: frames sent back to back (the rate stays the average)'
                                    type: integer
                                clients:
                                    description: 'add_port, set_port: many hosts behind the test port, each with its own MAC: {n: 1-4000, dhcp: true, groups: [239.1.1.1], dot1x: {user: "user{n}", password: "…"}, rate: started a second (50), mac: the first MAC}; {n: 0} = none. 802.1X is EAP-MD5; {n} is the client''s number, {mac} its MAC'
                                    type: object
                                count:
                                    type: integer
                                description:
                                    description: 'save_template: what it checks'
                                    type: string
                                dport:
                                    type: integer
                                dscp:
                                    description: 'add_stream: IP DSCP 0-63'
                                    type: integer
                                dst_ip:
                                    description: 'add_stream: an address that is not a test port (icmp: its replies are counted), or a multicast group (received by the test ports that joined it)'
                                    type: string
                                dst_mac:
                                    type: string
                                from:
                                    description: 'add_stream: test port name'
                                    type: string
                                gateway:
                                    description: 'add_port: for streams to another network'
                                    type: string
                                groups:
                                    description: 'add_port, set_port: multicast groups it joins (239.1.1.1, ff0e::1)'
                                    items:
                                        type: string
                                    type: array
                                ip:
                                    description: 'add_port, set_port: the test port''s address with prefix (10.10.0.1/24), or dhcp (from a DHCP server)'
                                    type: string
                                ip6:
                                    description: 'add_port, set_port: an IPv6 address with prefix (fd00::1/64), or slaac (from router advertisements)'
                                    type: string
                                kind:
                                    enum:
                                        - udp
                                        - icmp
                                        - tcp
                                        - arp
                                        - raw
                                        - pcap
                                    type: string
                                lacp_fast:
                                    description: 'add_port, set_port: LACP every second (else 30 s)'
                                    type: boolean
                                lag:
                                    description: 'add_port, set_port: test ports with the same LAG name speak LACP (active) and form one LAG with the switch ("" = none); a stream to one member is received on any'
                                    type: string
                                lldp:
                                    description: 'add_port, set_port: announce it by LLDP (default on)'
                                    type: boolean
                                loops:
                                    description: 'add_stream kind pcap: times through the capture (default 1)'
                                    type: integer
                                max_jitter:
                                    description: ms for a pass (0 = not checked)
                                    type: number
                                max_latency:
                                    description: ms for a pass (0 = not checked)
                                    type: number
                                max_loss:
                                    description: '% for a pass (default 0)'
                                    type: number
                                mods:
                                    description: 'add_stream: fields that change per frame: {field: srcMac|dstMac|srcIp|dstIp|vlan|sport|dport, mode: inc|random, count, step}'
                                    items:
                                        type: object
                                    type: array
                                name:
                                    description: 'add_stream: its name; remove_stream: the stream'
                                    type: string
                                pcap:
                                    description: 'add_stream kind pcap: the capture file on this computer (classic pcap)'
                                    type: string
                                pcap_timing:
                                    description: 'add_stream kind pcap: keep the capture''s own gaps between frames (else the pps rate)'
                                    type: boolean
                                pcp:
                                    description: 'add_stream: 802.1p priority 0-7 (with vlan)'
                                    type: integer
                                port:
                                    description: 'add_port: its free port; remove_port: the test port''s name'
                                    type: string
                                ports:
                                    description: 'apply_template: the test ports (names) for its roles A, B, C… in order'
                                    items:
                                        type: string
                                    type: array
                                pps:
                                    description: packets per second (default 100, at most 100000)
                                    type: integer
                                rate:
                                    description: 'add_stream: the rate in rate_unit (instead of pps)'
                                    type: number
                                rate_unit:
                                    description: 'add_stream: pps, mbps (Mbit/s on the wire, with preamble and gap) or pct (% of the sending test port''s line rate)'
                                    enum:
                                        - pps
                                        - mbps
                                        - pct
                                    type: string
                                rewrite_macs:
                                    description: 'add_stream kind pcap: send from this test port''s MAC to the destination test port''s'
                                    type: boolean
                                round_trip:
                                    description: 'add_stream: the test port it goes to sends each frame back; latency is the round trip (works between test ports on two hosts)'
                                    type: boolean
                                seconds:
                                    type: integer
                                size:
                                    description: frame bytes (60-9000, default 128)
                                    type: integer
                                size_max:
                                    type: integer
                                size_mode:
                                    description: 'add_stream: frame sizes (inc/random: size to size_max)'
                                    enum:
                                        - fixed
                                        - inc
                                        - random
                                        - imix
                                    type: string
                                speed:
                                    description: 'add_port, set_port: the test port''s line rate in Mbit/s, for rates in % of it (default 1000)'
                                    type: integer
                                src_ip:
                                    type: string
                                stp:
                                    description: 'add_port, set_port: the test port speaks spanning tree: {mode: stp|rstp, prio: 0-61440 (default 32768; lower than the switch''s makes it the root)}; {mode: ""} = off'
                                    type: object
                                streams:
                                    description: 'start: the streams (none = all)'
                                    items:
                                        type: string
                                    type: array
                                switch:
                                    description: 'add_port: the switch'
                                    type: string
                                template:
                                    description: 'apply_template, remove_template: the template (name or id); save_template: its name'
                                    type: string
                                to:
                                    description: 'add_stream: test port name; empty = every other test port (broadcast) or dst_ip'
                                    type: string
                                topology_change:
                                    description: 'set_port: its next BPDUs carry a topology change'
                                    type: boolean
                                vlan:
                                    type: integer
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools/wait:
        post:
            operationId: tool_wait
            tags:
                - Tools
            summary: Wait until switches of the emulated lab are booted and configured (running, no step left), or the time is up; returns each one's state and problem
            description: Wait until switches of the emulated lab are booted and configured (running, no step left), or the time is up; returns each one's state and problem. Through the API it runs without asking.
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                switches:
                                    description: switch names; empty = all
                                    items:
                                        type: string
                                    type: array
                                timeout:
                                    description: seconds (default 600, at most 1800)
                                    type: integer
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
components:
    schemas:
        Problem:
            type: object
            description: An error, as RFC 9457 problem details.
            required:
                - type
                - title
                - status
                - detail
            properties:
                type:
                    type: string
                    format: uri
                    description: What kind of problem (a link into docs/API.md).
                title:
                    type: string
                    description: The HTTP status text.
                status:
                    type: integer
                    description: The HTTP status code.
                detail:
                    type: string
                    description: What went wrong, for a person.
        ToolResult:
            type: object
            required:
                - result
            properties:
                result:
                    type: string
                    description: What the tool did or found, as text.
        CPUStats:
            type: object
            properties:
                mins:
                    description: the minutes the numbers cover (at most 60)
                    type: integer
                avg:
                    description: average use
                    type: number
                p95:
                    description: 95 % of the time it used at most this
                    type: number
                peak:
                    description: the most it used
                    type: number
                over:
                    description: '% of the time it used more than its request'
                    type: integer
                overN:
                    description: how many times it went above its request
                    type: integer
                thr:
                    description: times its limit held it back (cgroup periods throttled)
                    type: integer
                thrS:
                    description: seconds it was held back
                    type: number
            required:
                - mins
                - avg
                - p95
                - peak
                - over
                - overN
                - thr
                - thrS
        Cable:
            type: object
            description: A cable between two switch ports, with the LAGs on its ends.
            properties:
                a:
                    type: string
                aPort:
                    type: string
                b:
                    type: string
                bPort:
                    type: string
                up:
                    type: boolean
                down:
                    type: boolean
                lagA:
                    description: the LAG its port on A is in
                    anyOf:
                        - $ref: '#/components/schemas/LagView'
                        - type: "null"
                lagB:
                    anyOf:
                        - $ref: '#/components/schemas/LagView'
                        - type: "null"
                lldp:
                    description: 'the last cabling check: "ok …", "wrong: …" or "none: …"'
                    type: string
            required:
                - a
                - aPort
                - b
                - bPort
                - up
                - down
        Device:
            type: object
            description: A switch (VM) of the lab and its state.
            properties:
                host:
                    description: the KVM host it runs on (session path)
                    type: string
                id:
                    type: string
                os:
                    description: device type
                    type: string
                model:
                    type: string
                image:
                    type: string
                version:
                    description: 'the software it runs: as it reports it, else the image''s'
                    type: string
                hwSerial:
                    description: the serial number it reports
                    type: string
                serial:
                    type: string
                mac:
                    type: string
                hostname:
                    type: string
                mgmtIp:
                    type: string
                port:
                    type: integer
                ports:
                    type: integer
                running:
                    type: boolean
                logins:
                    type: integer
                unsaved:
                    type: boolean
                x:
                    type: integer
                y:
                    type: integer
                state:
                    description: stopped, uploading, booting, day0, running, failed
                    type: string
                stateText:
                    type: string
                cpu:
                    description: '% of its vCPUs, now'
                    type: number
                memUsed:
                    description: MB its VM uses now (resident)
                    type: integer
                saved:
                    description: 'stopped with its running state saved: it starts in seconds'
                    type: boolean
                role:
                    description: drawn as (set by the user, for its kind of device)
                    type: string
                iconStyle:
                    description: its kind's icon style in this topology ("" = the default)
                    type: string
                uplinks:
                    description: its data ports on the host's network
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                movingTo:
                    description: the host it is moving to (session path), while it moves
                    type: string
                cores:
                    description: host cores it uses now
                    type: number
                cpus:
                    type: integer
                ram:
                    type: integer
                console:
                    type: integer
                ssh:
                    description: how its management is reached, as text
                    type: string
                error:
                    type: string
                diskGb:
                    type: integer
                checkpoints:
                    description: its running state kept in its disk (restore brings it back)
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuCheckpoint'
                restart:
                    description: 'running with other vCPUs, memory or disk than it is set to: what a restart changes ("vCPU 2 → 4")'
                    type: string
                template:
                    type: string
                persona:
                    anyOf:
                        - $ref: '#/components/schemas/EmuPersona'
                        - type: "null"
                personaOk:
                    description: the persona file in its disk is the current one
                    type: boolean
                personaError:
                    type: string
                personaInfo:
                    description: where the file was written, what the CLI showed after boot
                    type: string
                computer:
                    description: 'a Linux computer: Termwright gives its data ports addresses'
                    type: boolean
                desktop:
                    description: a computer with a desktop and Firefox on its screen
                    type: boolean
                routing:
                    description: a computer as a route generator
                    anyOf:
                        - $ref: '#/components/schemas/EmuRouting'
                        - type: "null"
                addrs:
                    description: its data ports' addresses (port → address/bits, or "dhcp")
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                addrsSeen:
                    description: the addresses its data ports have, as read on its console after they were set (DHCP leases too)
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                addrs6:
                    description: its data ports' IPv6 ("auto" or address/bits)
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                dataGw:
                    description: its default gateway on a data port
                    type: string
                dataGw6:
                    description: its IPv6 default gateway
                    type: string
                dns:
                    description: its DNS server
                    type: string
                net:
                    description: its network as last read on its console
                    anyOf:
                        - $ref: '#/components/schemas/EmuCompNet'
                        - type: "null"
                cpuMax:
                    description: at most this many host cores (0 = no limit)
                    type: number
                cpuWeight:
                    description: its CPU share when VMs compete (100 = as the others; 0 = 100)
                    type: integer
                cpuReq:
                    description: its CPU request, millicores (its share when the host is busy; nothing is reserved)
                    type: integer
                cpuLim:
                    description: its CPU limit, millicores (0 = none)
                    type: integer
                cpuStats:
                    description: its CPU over the last hour (while it runs)
                    anyOf:
                        - $ref: '#/components/schemas/CPUStats'
                        - type: "null"
            required:
                - host
                - id
                - os
                - model
                - image
                - version
                - hwSerial
                - serial
                - mac
                - hostname
                - mgmtIp
                - port
                - ports
                - running
                - logins
                - unsaved
                - x
                - "y"
                - state
                - stateText
                - cpu
                - memUsed
                - cores
                - cpus
                - ram
                - console
                - ssh
                - error
                - diskGb
                - template
                - persona
                - personaOk
                - personaError
                - personaInfo
        DeviceType:
            type: object
            properties:
                key:
                    description: '"<kind>|<model>"'
                    type: string
                model:
                    description: '"" = the image as it is'
                    type: string
                kind:
                    description: the image kind (its profile name, e.g. what the pack calls it)
                    type: string
                osName:
                    description: shown after the model
                    type: string
                modules:
                    description: modules it can take
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                modName:
                    description: what a module is called
                    type: string
                images:
                    description: image ids, newest version first
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                cpus:
                    type: integer
                ram:
                    type: integer
                values:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
            required:
                - key
                - model
                - kind
                - osName
                - modules
                - modName
                - images
                - cpus
                - ram
                - values
        EmuAnswer:
            type: object
            properties:
                match:
                    type: string
                send:
                    type: string
                key:
                    description: 'a boot menu that takes one key: typed without Enter (Enter follows only when the menu waits for it)'
                    type: boolean
            required:
                - match
                - send
        EmuCheckpoint:
            type: object
            properties:
                tag:
                    description: the snapshot's name in its disk (tw-ck-…)
                    type: string
                at:
                    description: when (RFC 3339)
                    type: string
                note:
                    description: why it was taken
                    type: string
                change:
                    description: the change of the lab's history it was taken before
                    type: string
            required:
                - tag
                - at
        EmuClientState:
            type: object
            properties:
                n:
                    description: clients
                    type: integer
                bound:
                    description: with a DHCP address
                    type: integer
                auth:
                    description: logged in by 802.1X
                    type: integer
                failed:
                    description: refused, or the switch did not answer
                    type: integer
                list:
                    description: 'the first 256: MAC, address, 802.1X state, why it failed'
                    type:
                        - array
                        - "null"
                    items:
                        type:
                            - array
                            - "null"
                        items:
                            type: string
            required:
                - "n"
                - bound
                - auth
                - failed
        EmuClients:
            type: object
            properties:
                n:
                    description: how many (1-4000)
                    type: integer
                mac:
                    description: the first one's MAC; the others count up from it ("" = made from the test port's)
                    type: string
                rate:
                    description: how many start a second (default 50)
                    type: integer
                dhcp:
                    description: each takes an IPv4 address by DHCP
                    type: boolean
                groups:
                    description: multicast groups each joins (IGMPv2 / MLDv1), again on every query
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                dot1x:
                    description: each logs in by 802.1X first (it sends nothing else before it is in)
                    anyOf:
                        - $ref: '#/components/schemas/EmuDot1x'
                        - type: "null"
            required:
                - "n"
        EmuCompNet:
            type: object
            properties:
                addrs:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                linkLocal:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                gw:
                    type: string
                gw6:
                    type: string
                dns:
                    type: string
        EmuDisk:
            type: object
            properties:
                slot:
                    type: string
                fileName:
                    description: its name on the hosts
                    type: string
                file:
                    description: on this computer
                    type: string
                sha256:
                    type: string
                size:
                    type: integer
                url:
                    type: string
                md5:
                    type: string
                page:
                    type: string
                bus:
                    description: 'hdb…: ide, sata, scsi, virtio ("" = the image''s)'
                    type: string
            required:
                - slot
                - fileName
                - file
                - sha256
                - size
        EmuDot1x:
            type: object
            properties:
                user:
                    description: default user{n}
                    type: string
                password:
                    description: default "password"
                    type: string
        EmuFact:
            type: object
            properties:
                cmd:
                    type: string
                version:
                    type: string
                serial:
                    type: string
            required:
                - cmd
        EmuHostInfo:
            type: object
            properties:
                user:
                    type: string
                os:
                    type: string
                kernel:
                    type: string
                arch:
                    type: string
                kvm:
                    description: yes, noaccess, none
                    type: string
                vt:
                    description: the CPU has virtualization on
                    type: boolean
                qemu:
                    type: string
                qemuImg:
                    type: boolean
                cpus:
                    type: integer
                load:
                    type: number
                memTotal:
                    description: MB
                    type: integer
                memFree:
                    description: MB
                    type: integer
                diskFree:
                    description: MB, in the lab folder
                    type: integer
                sudo:
                    description: password-less sudo for the network commands (bridge mode)
                    type: boolean
                sudoAll:
                    description: password-less sudo for anything (Set Up runs without asking for the password)
                    type: boolean
                dir:
                    type: string
                osId:
                    description: ID and ID_LIKE of /etc/os-release
                    type: string
                pkg:
                    description: the package manager Set Up uses (apt, dnf, dnf-fedora, zypper, pacman)
                    type: string
                plan:
                    description: what Set Up would do
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                canSetup:
                    description: Set Up can fix the problems
                    type: boolean
                uplink:
                    description: the port of the default route
                    type: string
                lanAddr:
                    description: the host's address on it (10.234.179.20/24)
                    type: string
                gateway:
                    description: the default route's gateway
                    type: string
                bridges:
                    description: the host's bridges with a network port in them
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                wifi:
                    description: the uplink is Wi-Fi
                    type: boolean
                lanIf:
                    description: 'where switches join the host''s network: a bridge, or the uplink (macvtap)'
                    type: string
                lanKind:
                    description: '"bridge" or "macvtap" ("" = not possible)'
                    type: string
                guestfs:
                    description: libguestfs is there (persona files)
                    type: boolean
                virt:
                    description: 'the host is itself a VM: vmware, kvm, microsoft… ("none" = hardware)'
                    type: string
                nat:
                    description: the host's address on libvirt's NAT network virbr0 (192.168.122.1/24), "" = none
                    type: string
                libvirt:
                    description: virsh is there
                    type: boolean
                problems:
                    description: what stops VMs from running
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                notes:
                    description: what works, but differently
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - user
                - os
                - kernel
                - arch
                - kvm
                - vt
                - qemu
                - qemuImg
                - cpus
                - load
                - memTotal
                - memFree
                - diskFree
                - sudo
                - sudoAll
                - dir
                - osId
                - pkg
                - plan
                - canSetup
                - uplink
                - lanAddr
                - gateway
                - bridges
                - wifi
                - lanIf
                - lanKind
                - guestfs
                - virt
                - nat
                - libvirt
                - problems
                - notes
        EmuHubCfg:
