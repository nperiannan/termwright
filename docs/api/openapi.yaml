            summary: The emulated lab's change history
            description: 'The emulated lab''s change history: every change Claude or the API made (lab changes are not asked, so each is kept with the lab as it was before). Actions: list (newest first, with ids), plan (what revert would do for a change id), revert (bring the lab back to how it was before that change: devices added since are removed, cables, CPU, computers'' addresses, test ports and streams set back, devices started or stopped as they were; commands typed on a switch are undone by restoring the checkpoint it got before them - Termwright takes one before typing, at most every 2 minutes per switch, none while traffic runs). Use revert when a test went wrong. lab_checkpoint takes, lists and restores checkpoints by hand. Through the API it runs without asking.'
