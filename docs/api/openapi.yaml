    /lab/tools/routes:
        post:
            operationId: tool_routes
            tags:
                - Tools
            summary: A Linux computer of the lab as a route generator
            description: 'A Linux computer of the lab as a route generator: FRR speaks OSPF or BGP with the switch on one of its data ports and advertises many prefixes (up to 10000); the computer answers ping on every address in them, so an ICMP stream from a test port to the prefixes shows whether the switch forwards to the routes it learned. The computer''s port needs a fixed address (lab_computer) and internet to install FRR; the switch needs OSPF on that network (or a BGP neighbour) and a route back to the test port. Actions: set (computer, proto ospf|bgp, port, routes, prefix 100.64.0.0/24, area, as, peer, peer_as), show (computer: neighbour state, prefixes), off (computer), stream (computer, from: the test port, pps: an ICMP stream to every prefix). Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - set
                                        - show
                                        - "off"
                                        - stream
                                    type: string
                                area:
                                    description: OSPF area (default 0.0.0.0)
                                    type: string
                                as:
                                    description: 'BGP: its AS (default 65001)'
                                    type: integer
                                computer:
                                    type: string
                                from:
                                    description: 'stream: the test port it is sent from'
                                    type: string
                                peer:
                                    description: 'BGP: the switch''s address'
                                    type: string
                                peer_as:
                                    description: 'BGP: the switch''s AS (default 65000)'
                                    type: integer
                                port:
                                    description: its data port (1 = the first)
                                    type: integer
                                pps:
                                    type: integer
                                prefix:
                                    description: the first prefix with its length (default 100.64.0.0/24)
                                    type: string
                                proto:
                                    enum:
                                        - ospf
                                        - bgp
                                    type: string
                                routes:
                                    description: prefixes to advertise (1-10000)
                                    type: integer
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools/server:
        post:
            operationId: tool_server
            tags:
                - Tools
            summary: Servers in the emulated lab
            description: 'Servers in the emulated lab: an Alpine Linux computer with HTTP, FTP and TFTP from one shared folder (/srv), DHCP on its data port 1 and SSH/SFTP for files (BusyBox and Dropbear). Its services answer on its management address too, so a switch can fetch a file over its management VR (EXOS: download url http://<server>/<file> vr VR-Mgmt). Actions: add (a new server, on a KVM host), show (its settings, services, files, DHCP leases and how to reach it), set (change settings: http, ftp, tftp, tftp_write, dhcp, from, to, gateway, dns, lease_min, boot_file, boot_from), upload (files from this computer into its shared folder), delete (files or folders of the shared folder). Changes are asked in Termwright first. Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - add
                                        - show
                                        - set
                                        - upload
                                        - delete
                                    type: string
                                boot_file:
                                    description: 'DHCP option 67: a file of the shared folder'
                                    type: string
                                boot_from:
                                    description: 'DHCP: the TFTP server it names (default itself)'
                                    type: string
                                dhcp:
                                    type: boolean
                                dir:
                                    description: 'upload: a folder in the shared folder (default its top)'
                                    type: string
                                dns:
                                    type: string
                                files:
                                    description: 'upload: paths on this computer; delete: paths in the shared folder'
                                    items:
                                        type: string
                                    type: array
                                from:
                                    description: 'DHCP: the first address it gives'
                                    type: string
                                ftp:
                                    type: boolean
                                gateway:
                                    type: string
                                host:
                                    description: 'add: the KVM host (default the lab''s)'
                                    type: string
                                http:
                                    type: boolean
                                lease_min:
                                    type: integer
                                server:
                                    description: the server (show, set, upload, delete)
                                    type: string
                                start:
                                    description: 'add: start it at once'
                                    type: boolean
                                tftp:
                                    type: boolean
                                tftp_write:
                                    description: uploads by TFTP (a switch saving its configuration)
                                    type: boolean
                                to:
