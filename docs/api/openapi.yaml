        HTTPResponse:
            type: object
            description: The answer, with the request as it was sent (secrets masked), timings, cookies and test results.
            properties:
                status:
                    description: Status code (200), 0 when nothing came back.
                    type: integer
                statusText:
                    description: 'StatusText: "200 OK".'
                    type: string
                proto:
                    description: 'Proto: HTTP/1.1, HTTP/2.0.'
                    type: string
                headers:
                    description: Headers of the answer.
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPKeyValue'
                body:
                    description: 'Body: text, or base64 when Base64.'
                    type: string
                base64:
                    description: 'Base64: the body is binary.'
                    type: boolean
                contentType:
                    description: ContentType of the body.
                    type: string
                size:
                    description: Size of the body in bytes.
                    type: integer
                truncated:
                    description: 'Truncated: the body was longer than kept (5 MB).'
                    type: boolean
                ms:
                    description: 'Ms: the whole request in milliseconds.'
                    type: integer
                timing:
                    $ref: '#/components/schemas/HTTPTiming'
                    description: Timing per phase.
                method:
                    description: Method sent.
                    type: string
                url:
                    description: URL sent (secret variables masked).
                    type: string
                reqHeaders:
                    description: ReqHeaders as sent (authorization and secret variables masked).
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPKeyValue'
                reqBody:
                    description: ReqBody as sent (secret variables masked; first 64 KB).
                    type: string
                cookies:
                    description: Cookies the server set.
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPCookie'
                tests:
                    description: 'Tests: the results of the request''s tests.'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPTestResult'
                logs:
                    description: 'Logs: console.log of its scripts.'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                vars:
                    description: Vars set by its scripts (kept for the next requests of a run or the tab).
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                error:
                    description: 'Error: why it could not be sent or what failed (the answer is still shown when there is one).'
                    type: string
                next:
                    description: 'Next: the request a script chose to run next in a collection run (postman.setNextRequest).'
                    type: string
                nextSet:
                    description: 'NextSet: a script chose the next request; Next "" ends the run.'
                    type: boolean
                skipped:
                    description: 'Skipped: the pre-request script skipped it (pm.execution.skipRequest).'
                    type: boolean
                envSet:
