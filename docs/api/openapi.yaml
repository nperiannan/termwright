            tags:
                - Tools
            summary: The lab's built-in RADIUS server, for 802
            description: 'The lab''s built-in RADIUS server, for 802.1X and MAC logins on the switches: it runs on every host of the lab and answers the switches there (EAP-MD5, PAP, MAC authentication; accepted users get their VLAN as Tunnel-Private-Group-Id). Actions: show (settings, where the switches reach it, counts), log (the last logins), set (on, port, secret, mab, mab_vlan), add_user (user - a name or a pattern like user* - password, vlan), remove_user (user). Secrets and passwords are left out unless reveal is true (for typing them into a switch''s configuration, not for the chat). Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - show
                                        - log
                                        - set
                                        - add_user
                                        - remove_user
                                    type: string
                                mab:
                                    description: 'MAC addresses let in by MAC authentication (patterns: 02:63:*; * = any)'
                                    items:
                                        type: string
                                    type: array
                                mab_vlan:
                                    type: string
                                on:
                                    type: boolean
                                password:
                                    type: string
                                port:
                                    description: authentication port (default 1812; accounting on the next)
                                    type: integer
                                reveal:
                                    description: 'show: include the secret and the passwords'
                                    type: boolean
                                secret:
                                    description: shared with the switches (made up when empty)
                                    type: string
                                user:
                                    type: string
                                vlan:
                                    description: the VLAN (name or number) the switch puts the user in
                                    type: string
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
