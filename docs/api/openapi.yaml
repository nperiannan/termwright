    /http/send:
        post:
            operationId: httpSend
            tags:
                - API client
            summary: Send a request
            description: 'Sends a request with a saved API session (Protocol API: base URL, authentication - API key, bearer token, login request, basic, OAuth 2.0 - and {{variables}}; the secrets come from the credential store and are masked in the answer) or as it is. A path goes after the session''s base URL; a login or OAuth token is fetched, kept in memory and renewed by itself. The request''s pre-request script and tests (a pm.* subset) run. Through the API a change on a production session is not asked (the scripts are the user''s own).'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/HTTPSendRequest'
                        examples:
                            path:
                                summary: GET a path of a saved API session (it logs in by itself)
                                value:
                                    session: APIs/Lab switches REST
                                    request:
                                        method: GET
                                        url: /rest/restconf/data/openconfig-interfaces:interfaces
                            patch:
                                summary: PATCH with a JSON body and a test
                                value:
                                    session: APIs/Lab switches REST
                                    request:
                                        method: PATCH
                                        url: /rest/restconf/data/openconfig-interfaces:interfaces/interface={{port}}/config
                                        body:
                                            mode: json
                                            raw: '{"openconfig-interfaces:config": {"description": "uplink"}}'
                                        tests: pm.test('ok', () => pm.response.to.be.ok)
                                    vars:
                                        port: "1:1"
                            url:
                                summary: Any URL, no session
                                value:
                                    request:
                                        method: GET
                                        url: https://example.com/api/health
                                        headers:
                                            - key: Accept
                                              value: application/json
            responses:
                200:
                    description: The answer (also when the server answered an error status; error says why nothing came back).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HTTPResponse'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
