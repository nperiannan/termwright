    /lab/tools/test:
        post:
            operationId: tool_test
            tags:
                - Tools
            summary: Traffic tests on the emulated lab's test ports, run by Termwright as a series of trials
            description: 'Traffic tests on the emulated lab''s test ports, run by Termwright as a series of trials: RFC 2544 throughput (the highest rate without loss per frame size), latency (at that rate), frame-loss (loss from 100 % down to 10 % of the top rate) and back-to-back (the longest burst without loss), RFC 2889 learning (how many source MACs a switch learns before it floods; needs a third test port as monitor), convergence (traffic while a cable is pulled or a switch stops or restarts: the frames lost and the outage in ms), and iperf (iperf3 between two host VMs of the lab, on their consoles: TCP or UDP rate, retransmits, jitter, loss). Actions: list (saved tests and the latest runs), add, remove, run (in the background), stop, results (of a run; the latest when no run is given). Adding, running and stopping are asked in Termwright first. Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - list
                                        - add
                                        - remove
                                        - run
                                        - stop
                                        - results
                                    type: string
                                at:
                                    description: 'add, convergence: seconds after the start (default 5)'
                                    type: integer
                                bandwidth:
                                    description: 'add, iperf: target rate (100M, 1G; udp default 1M)'
                                    type: string
                                both:
                                    description: 'add: both ways at the same time'
                                    type: boolean
                                client:
                                    description: 'add, iperf: the host VM that runs iperf3 -c'
                                    type: string
                                from:
                                    description: 'add: the test port the frames go from (name)'
                                    type: string
                                hold:
                                    description: 'add, convergence: seconds until the cable is plugged in / the switch started again (0 = not)'
                                    type: integer
                                kind:
                                    enum:
                                        - throughput
                                        - latency
                                        - frame-loss
                                        - back-to-back
                                        - learning
                                        - convergence
                                        - iperf
                                    type: string
                                loss:
                                    description: 'add: loss % that still counts as none (default 0)'
                                    type: number
                                max:
                                    description: 'add: back-to-back the longest burst, learning the most addresses tried'
                                    type: integer
                                max_pps:
                                    description: 'add: the highest rate tried (default 10000)'
                                    type: integer
                                monitor:
                                    description: 'add, learning: a third test port that sees flooded frames'
                                    type: string
                                name:
                                    description: 'add: its name; remove, run: the test'
                                    type: string
                                parallel:
                                    description: 'add, iperf: parallel streams'
                                    type: integer
                                port:
                                    description: 'add, convergence pull: the port whose cable is pulled'
                                    type: string
                                proto:
                                    description: add, iperf
                                    enum:
                                        - tcp
                                        - udp
                                    type: string
                                rate:
                                    description: 'add: latency, frame-loss, convergence: the rate (pps)'
                                    type: integer
                                resolution:
                                    description: 'add: search resolution, % (default 2)'
                                    type: number
                                reverse:
                                    description: 'add, iperf: the server sends'
                                    type: boolean
                                run:
                                    description: 'results: the run id (default the latest)'
                                    type: string
                                seconds:
                                    description: 'add, convergence: how long the traffic runs (default 30)'
                                    type: integer
                                server:
                                    description: 'add, iperf: the host VM that runs iperf3 -s'
                                    type: string
                                server_ip:
                                    description: 'add, iperf: the server''s address (on its data port; default its management address)'
                                    type: string
                                sizes:
                                    description: 'add: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)'
                                    items:
                                        type: integer
                                    type: array
                                switch:
                                    description: 'add, convergence: the switch'
                                    type: string
                                test_action:
                                    description: 'add, convergence: what happens during the traffic'
                                    enum:
                                        - pull
                                        - stop
                                        - restart
                                    type: string
                                to:
                                    description: 'add: the test port they go to'
                                    type: string
                                trial:
                                    description: 'add: seconds per trial (default 5)'
                                    type: integer
                                vlan:
                                    type: integer
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools/traffic:
        post:
            operationId: tool_traffic
            tags:
                - Tools
            summary: The emulated lab's traffic generator
            description: 'The emulated lab''s traffic generator: test ports on free switch ports (a sender and counter, no VM; it answers ARP and ping at its address) and streams of frames between them (udp, icmp, tcp SYN, arp, raw; VLAN tag, size, packets per second, seconds or count, pass when loss and latency are within limits). Actions: list, add_port, remove_port, add_stream, remove_stream, start, stop, report (pass/fail per stream with sent, received, loss and latency). Changes and starts are asked in Termwright first. Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    enum:
                                        - list
                                        - add_port
                                        - set_port
                                        - remove_port
                                        - add_stream
                                        - remove_stream
                                        - start
                                        - stop
                                        - report
                                    type: string
                                burst:
                                    description: 'add_stream: frames sent back to back (the rate stays the average)'
                                    type: integer
                                count:
                                    type: integer
                                dport:
                                    type: integer
                                dscp:
                                    description: 'add_stream: IP DSCP 0-63'
                                    type: integer
                                dst_ip:
                                    description: 'add_stream: an address that is not a test port (icmp: its replies are counted), or a multicast group (received by the test ports that joined it)'
                                    type: string
                                dst_mac:
                                    type: string
                                from:
                                    description: 'add_stream: test port name'
                                    type: string
                                gateway:
                                    description: 'add_port: for streams to another network'
                                    type: string
                                groups:
                                    description: 'add_port, set_port: multicast groups it joins (239.1.1.1, ff0e::1)'
                                    items:
                                        type: string
                                    type: array
                                ip:
                                    description: 'add_port, set_port: the test port''s address with prefix (10.10.0.1/24), or dhcp (from a DHCP server)'
                                    type: string
                                ip6:
                                    description: 'add_port, set_port: an IPv6 address with prefix (fd00::1/64), or slaac (from router advertisements)'
                                    type: string
                                kind:
                                    enum:
                                        - udp
                                        - icmp
                                        - tcp
                                        - arp
                                        - raw
                                    type: string
                                lldp:
                                    description: 'add_port, set_port: announce it by LLDP (default on)'
                                    type: boolean
                                max_jitter:
                                    description: ms for a pass (0 = not checked)
                                    type: number
                                max_latency:
                                    description: ms for a pass (0 = not checked)
                                    type: number
                                max_loss:
                                    description: '% for a pass (default 0)'
                                    type: number
                                mods:
                                    description: 'add_stream: fields that change per frame: {field: srcMac|dstMac|srcIp|dstIp|vlan|sport|dport, mode: inc|random, count, step}'
                                    items:
                                        type: object
                                    type: array
                                name:
                                    description: 'add_stream: its name; remove_stream: the stream'
                                    type: string
                                pcp:
                                    description: 'add_stream: 802.1p priority 0-7 (with vlan)'
                                    type: integer
                                port:
                                    description: 'add_port: its free port; remove_port: the test port''s name'
                                    type: string
                                pps:
                                    description: packets per second (default 100, at most 100000)
                                    type: integer
                                seconds:
                                    type: integer
                                size:
                                    description: frame bytes (60-9000, default 128)
                                    type: integer
                                size_max:
                                    type: integer
                                size_mode:
                                    description: 'add_stream: frame sizes (inc/random: size to size_max)'
                                    enum:
                                        - fixed
                                        - inc
                                        - random
                                        - imix
                                    type: string
                                src_ip:
                                    type: string
                                streams:
                                    description: 'start: the streams (none = all)'
                                    items:
                                        type: string
                                    type: array
                                switch:
                                    description: 'add_port: the switch'
                                    type: string
                                to:
                                    description: 'add_stream: test port name; empty = every other test port (broadcast) or dst_ip'
                                    type: string
                                vlan:
                                    type: integer
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools/wait:
        post:
            operationId: tool_wait
            tags:
                - Tools
            summary: Wait until switches of the emulated lab are booted and configured (running, no step left), or the time is up; returns each one's state and problem
            description: Wait until switches of the emulated lab are booted and configured (running, no step left), or the time is up; returns each one's state and problem. Through the API it runs without asking.
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                switches:
                                    description: switch names; empty = all
                                    items:
                                        type: string
                                    type: array
                                timeout:
                                    description: seconds (default 600, at most 1800)
                                    type: integer
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
components:
    schemas:
        Problem:
            type: object
            description: An error, as RFC 9457 problem details.
            required:
                - type
                - title
                - status
                - detail
            properties:
                type:
                    type: string
                    format: uri
                    description: What kind of problem (a link into docs/API.md).
                title:
                    type: string
                    description: The HTTP status text.
                status:
                    type: integer
                    description: The HTTP status code.
                detail:
                    type: string
                    description: What went wrong, for a person.
        ToolResult:
            type: object
            required:
                - result
            properties:
                result:
                    type: string
                    description: What the tool did or found, as text.
        Cable:
            type: object
            description: A cable between two switch ports, with the LAGs on its ends.
            properties:
                a:
                    type: string
                aPort:
                    type: string
                b:
                    type: string
                bPort:
                    type: string
                up:
                    type: boolean
                down:
                    type: boolean
                lagA:
                    description: the LAG its port on A is in
                    anyOf:
                        - $ref: '#/components/schemas/LagView'
                        - type: "null"
                lagB:
                    anyOf:
                        - $ref: '#/components/schemas/LagView'
                        - type: "null"
                lldp:
                    description: 'the last cabling check: "ok …", "wrong: …" or "none: …"'
                    type: string
            required:
                - a
                - aPort
                - b
                - bPort
                - up
                - down
        Device:
            type: object
            description: A switch (VM) of the lab and its state.
            properties:
                host:
                    description: the KVM host it runs on (session path)
                    type: string
                id:
                    type: string
                os:
                    description: device type
                    type: string
                model:
                    type: string
                image:
                    type: string
                version:
                    description: 'the software it runs: as it reports it, else the image''s'
                    type: string
                hwSerial:
                    description: the serial number it reports
                    type: string
                serial:
                    type: string
                mac:
                    type: string
                hostname:
                    type: string
                mgmtIp:
                    type: string
                port:
                    type: integer
                ports:
                    type: integer
                running:
                    type: boolean
                logins:
                    type: integer
                unsaved:
                    type: boolean
                x:
                    type: integer
                y:
                    type: integer
                state:
                    description: stopped, uploading, booting, day0, running, failed
                    type: string
                stateText:
                    type: string
                cpu:
                    description: '% of its vCPUs, now'
                    type: number
                memUsed:
                    description: MB its VM uses now (resident)
                    type: integer
                saved:
                    description: 'stopped with its running state saved: it starts in seconds'
                    type: boolean
                role:
                    description: drawn as (set by the user, for its kind of device)
                    type: string
                iconStyle:
                    description: its kind's icon style in this topology ("" = the default)
                    type: string
                uplinks:
                    description: its data ports on the host's network
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                movingTo:
                    description: the host it is moving to (session path), while it moves
                    type: string
                cores:
                    description: host cores it uses now
                    type: number
                cpus:
                    type: integer
                ram:
                    type: integer
                console:
                    type: integer
                ssh:
                    description: how its management is reached, as text
                    type: string
                error:
                    type: string
                diskGb:
                    type: integer
                template:
                    type: string
                persona:
                    anyOf:
                        - $ref: '#/components/schemas/EmuPersona'
                        - type: "null"
                personaOk:
                    description: the persona file in its disk is the current one
                    type: boolean
                personaError:
                    type: string
                personaInfo:
                    description: where the file was written, what the CLI showed after boot
                    type: string
            required:
                - host
                - id
                - os
                - model
                - image
                - version
                - hwSerial
                - serial
                - mac
                - hostname
                - mgmtIp
                - port
                - ports
                - running
                - logins
                - unsaved
                - x
                - "y"
                - state
                - stateText
                - cpu
                - memUsed
                - cores
                - cpus
                - ram
                - console
                - ssh
                - error
                - diskGb
                - template
                - persona
                - personaOk
                - personaError
                - personaInfo
        DeviceType:
            type: object
            properties:
                key:
                    description: '"<kind>|<model>"'
                    type: string
                model:
                    description: '"" = the image as it is'
                    type: string
                kind:
                    description: the image kind (its profile name, e.g. what the pack calls it)
                    type: string
                osName:
                    description: shown after the model
                    type: string
                modules:
                    description: modules it can take
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                modName:
                    description: what a module is called
                    type: string
                images:
                    description: image ids, newest version first
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                cpus:
                    type: integer
                ram:
                    type: integer
                values:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
            required:
                - key
                - model
                - kind
                - osName
                - modules
                - modName
                - images
                - cpus
                - ram
                - values
        EmuAnswer:
            type: object
            properties:
                match:
                    type: string
                send:
                    type: string
                key:
                    description: 'a boot menu that takes one key: typed without Enter (Enter follows only when the menu waits for it)'
                    type: boolean
            required:
                - match
                - send
        EmuDisk:
            type: object
            properties:
                slot:
                    type: string
                fileName:
                    description: its name on the hosts
                    type: string
                file:
                    description: on this computer
                    type: string
                sha256:
                    type: string
                size:
                    type: integer
                url:
                    type: string
                md5:
                    type: string
                page:
                    type: string
                bus:
                    description: 'hdb…: ide, sata, scsi, virtio ("" = the image''s)'
                    type: string
            required:
                - slot
                - fileName
                - file
                - sha256
                - size
        EmuFact:
            type: object
            properties:
                cmd:
                    type: string
                version:
                    type: string
                serial:
                    type: string
            required:
                - cmd
        EmuHostInfo:
            type: object
            properties:
                user:
                    type: string
                os:
                    type: string
                kernel:
                    type: string
                arch:
                    type: string
                kvm:
                    description: yes, noaccess, none
                    type: string
                vt:
                    description: the CPU has virtualization on
                    type: boolean
                qemu:
                    type: string
                qemuImg:
                    type: boolean
                cpus:
                    type: integer
                load:
                    type: number
                memTotal:
                    description: MB
                    type: integer
                memFree:
                    description: MB
                    type: integer
                diskFree:
                    description: MB, in the lab folder
                    type: integer
                sudo:
                    description: password-less sudo for the network commands (bridge mode)
                    type: boolean
                sudoAll:
                    description: password-less sudo for anything (Set Up runs without asking for the password)
                    type: boolean
                dir:
                    type: string
                osId:
                    description: ID and ID_LIKE of /etc/os-release
                    type: string
                pkg:
                    description: the package manager Set Up uses (apt, dnf, dnf-fedora, zypper, pacman)
                    type: string
                plan:
                    description: what Set Up would do
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                canSetup:
                    description: Set Up can fix the problems
                    type: boolean
                uplink:
                    description: the port of the default route
                    type: string
                lanAddr:
                    description: the host's address on it (10.234.179.20/24)
                    type: string
                gateway:
                    description: the default route's gateway
                    type: string
                bridges:
                    description: the host's bridges with a network port in them
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                wifi:
                    description: the uplink is Wi-Fi
                    type: boolean
                lanIf:
                    description: 'where switches join the host''s network: a bridge, or the uplink (macvtap)'
                    type: string
                lanKind:
                    description: '"bridge" or "macvtap" ("" = not possible)'
                    type: string
                guestfs:
                    description: libguestfs is there (persona files)
                    type: boolean
                virt:
                    description: 'the host is itself a VM: vmware, kvm, microsoft… ("none" = hardware)'
                    type: string
                nat:
                    description: the host's address on libvirt's NAT network virbr0 (192.168.122.1/24), "" = none
                    type: string
                libvirt:
                    description: virsh is there
                    type: boolean
                problems:
                    description: what stops VMs from running
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                notes:
                    description: what works, but differently
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - user
                - os
                - kernel
                - arch
                - kvm
                - vt
                - qemu
                - qemuImg
                - cpus
                - load
                - memTotal
                - memFree
                - diskFree
                - sudo
                - sudoAll
                - dir
                - osId
                - pkg
                - plan
                - canSetup
                - uplink
                - lanAddr
                - gateway
                - bridges
                - wifi
                - lanIf
                - lanKind
                - guestfs
                - virt
                - nat
                - libvirt
                - problems
                - notes
        EmuPersona:
            type: object
            properties:
                slots:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuSlot'
                values:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                applied:
                    description: hash of the file last written into its disk
                    type: string
                took:
                    description: Applied when the switch showed the model on its CLI
                    type: string
                fail:
                    description: why the check after boot found another model (for Applied)
                    type: string
            required:
                - slots
                - values
        EmuPersonaDef:
            type: object
            properties:
                name:
                    description: what it is called ("Lab identity")
                    type: string
                file:
                    description: its path in the VM (/scratch/config.yaml)
                    type: string
                template:
                    description: Go text/template over PersonaData
                    type: string
                models:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuPersonaModel'
                values:
                    description: more fields, the same for all slots
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuPersonaValue'
                stack:
                    description: the persona can be a stack of several slots
                    type: boolean
                modules:
                    description: what a module is called ("VIM")
                    type: string
                osName:
                    description: what the image is called as such a device (shown after the model)
                    type: string
                fsHas:
                    description: names at the top of the filesystem the file goes on, when the image mounts it from its own scripts
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                check:
                    description: a CLI command whose output names the model once the persona took ("show version")
                    type: string
                serialMax:
                    description: 'the longest serial number the image takes: a longer one keeps its last characters'
                    type: integer
                serialSim:
                    description: 'the image takes only SIMxxxx-xxxx: any serial becomes that, from its last 8 letters and digits'
                    type: boolean
            required:
                - name
                - file
                - template
                - models
                - values
                - stack
                - modules
                - osName
                - check
        EmuPersonaModel:
            type: object
            properties:
                name:
                    type: string
                modules:
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - name
                - modules
        EmuPersonaValue:
            type: object
            properties:
                key:
                    type: string
                label:
                    type: string
                default:
                    type: string
            required:
                - key
                - label
                - default
        EmuPortMap:
            type: object
            properties:
                port:
                    type: integer
                vif:
                    type: integer
            required:
                - port
                - vif
        EmuSlot:
            type: object
            properties:
                num:
                    type: integer
                model:
                    type: string
                serial:
                    type: string
                module:
                    type: string
                master:
                    type: boolean
                ports:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuPortMap'
            required:
                - num
                - model
                - serial
                - module
                - master
                - ports
        EmuTemplate:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                image:
                    type: string
                cpus:
                    type: integer
                ram:
                    description: MB
                    type: integer
                diskGb:
                    description: 0 = the image's size
                    type: integer
                model:
                    description: persona model ("" = none)
                    type: string
                module:
                    type: string
                values:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                serialStart:
                    description: the first serial number; the next switches count up from it
                    type: string
                macStart:
                    description: the first switch's base MAC; the next ones follow
                    type: string
            required:
                - id
                - name
                - image
                - cpus
                - ram
                - diskGb
                - model
                - module
                - values
                - serialStart
                - macStart
        Event:
            type: object
            description: A line of the lab's Events log.
            properties:
                at:
                    type: string
                    format: date-time
                vm:
                    type: string
                name:
                    type: string
                level:
                    description: '"info", "ok", "warn", "error"'
                    type: string
                text:
                    type: string
                host:
                    description: 'the host it happened on (when it happened: a switch may move later)'
                    type: string
                by:
                    description: 'who caused it: user, ai, system'
                    type: string
            required:
                - at
                - vm
                - name
                - level
                - text
        FieldChange:
            type: object
            description: 'A field of a stream''s frames that changes from frame to frame: its value plus 0, step, 2·step… (count values, then again), or one of them at random.'
            properties:
                field:
                    description: srcMac, dstMac, srcIp, dstIp, vlan, sport, dport
                    type: string
                mode:
                    description: inc, random
                    type: string
                count:
                    description: how many values (then again from the first)
                    type: integer
                step:
                    description: how far apart they are (default 1)
                    type: integer
            required:
                - field
                - mode
                - count
        Host:
            type: object
            properties:
                session:
                    type: string
                name:
                    type: string
                info:
                    $ref: '#/components/schemas/EmuHostInfo'
                checked:
                    type: string
            required:
                - session
                - name
                - info
                - checked
        HostUse:
            type: object
            properties:
                host:
                    description: session path
                    type: string
                name:
                    type: string
                addr:
                    type: string
                mgmt:
                    type: string
                mgmtNet:
                    type: string
                cloudGw:
                    type: string
                lanFixed:
                    type: boolean
                cpus:
                    description: the host's cores
                    type: integer
                memTotal:
                    type: integer
                memFree:
                    type: integer
                load:
                    type: number
                cores:
                    description: what its switches use now
                    type: number
                vcpus:
                    description: given to its switches
                    type: integer
                ram:
                    type: integer
                switches:
                    type: integer
                running:
                    type: integer
                main:
                    type: boolean
            required:
                - host
                - name
                - addr
                - mgmt
                - mgmtNet
                - cloudGw
                - lanFixed
                - cpus
                - memTotal
                - memFree
                - load
                - cores
                - vcpus
                - ram
                - switches
                - running
                - main
        ImageView:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                file:
                    description: the image on this computer
                    type: string
                fileName:
                    description: its name on the hosts
                    type: string
                size:
                    description: bytes
                    type: integer
                sha256:
                    description: of the file, to know it is on a host already
                    type: string
                deviceType:
                    description: the sessions' device type (Linux, Cisco IOS…)
                    type: string
                cpus:
                    type: integer
                ram:
                    description: MB
                    type: integer
                nics:
                    description: network ports, the first one is management
                    type: integer
                nic:
                    description: e1000, virtio-net-pci, vmxnet3…
                    type: string
                disk:
                    description: virtio, ide, sata, scsi
                    type: string
                portName:
                    description: 'data port n as the OS calls it: "{n}" or "1/{n}"'
                    type: string
                ready:
                    description: console text when it can be logged in to ("login:")
                    type: string
                login:
                    type: string
                password:
                    description: in the keychain, never in the lab file
                    type: string
                defaultPassword:
                    description: the factory password from the vendor's guide, used while none is set
                    type: string
                prompt:
                    description: regexp of the CLI prompt (default [>#$]\s*$)
                    type: string
                day0:
                    description: first-boot commands, with {hostname} {mgmtIp} …
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                addrSet:
                    description: commands that give the management port a fixed address ({mgmtAddr} {mgmtBits} {mgmtMask} {gateway}), typed at each start when the lab's management has fixed addresses
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                answers:
                    description: questions on the console and what to answer
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuAnswer'
                extra:
                    description: more qemu options
                    type: string
                source:
                    description: where the profile came from (a GNS3 appliance…)
                    type: string
                addrCmd:
                    description: a CLI command that prints the management address (host's network mode)
                    type: string
                lagCmd:
                    description: a CLI command that lists the LAGs ("show sharing" on EXOS, "show mlt" on VOSS)
                    type: string
                lagSet:
                    description: 'CLI commands that make a LAG, per mode ("lacp", "static"): {id} {name} {ports} {master} {first} {last}'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type:
                            - array
                            - "null"
                        items:
                            type: string
                lagDel:
                    description: CLI commands that remove a LAG (the same names)
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                tcgCpu:
                    type: string
                facts:
                    description: CLI commands that read the switch's software version and serial number after it booted
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuFact'
                mgmtMacAlign:
                    description: the OS takes its management MAC from its first NIC's address rounded down to this block (a power of two; 0 = it uses the NIC's address)
                    type: integer
                packNic:
                    description: the device pack's network card the image last took (a newer pack's default replaces it once; the user's own choice stays)
                    type: string
                portMacs:
                    description: 'data ports'' MAC addresses: "" = the switch''s base MAC + port number, "own" = a range of their own (as GNS3 gives)'
                    type: string
                mgmtMacOffset:
                    description: '… plus this (Fabric Engine: block 1024, OOB at +0x81 = 129) // the CPU model it gets on a host without KVM (for example Nehalem, for an image that wants an Intel CPU); "" = QEMU''s default'
                    type: integer
                bootAnswers:
                    description: menus the image may stop at while it boots (the end of its console log), and what to type
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuAnswer'
                bootFail:
                    description: 'console lines (regular expressions) that say its boot failed: they go to Events'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                notReady:
                    description: 'console text that means its login is not ready yet ("(pending-AAA)"): nothing is typed until it is gone'
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                neighborCmd:
                    description: a CLI command that lists the LLDP neighbours ("show lldp neighbors")
                    type: string
                persona:
                    description: a file that makes the image act as a given device
                    anyOf:
                        - $ref: '#/components/schemas/EmuPersonaDef'
                        - type: "null"
                version:
                    description: the software version of the image (for the lists)
                    type: string
                match:
                    description: 'profiles: a regexp on the file name that picks this profile; a "version" group gives the version'
                    type: string
                serial:
                    description: serial number format for new switches ({N:5} {A:2} {YY} {WW} …; "" = none)
                    type: string
                url:
                    description: where the image file can be downloaded (from a GNS3 appliance)
                    type: string
