        Stream:
            type: object
            description: Frames from one test port to another, to every other one (broadcast), to an address or to a multicast group.
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (unique; the API and command line find it by it)
                    type: string
                from:
                    description: the test port it is sent from (id; the API takes a name too)
                    type: string
                to:
                    description: a test port; "" = every other one (broadcast)
                    type: string
                kind:
                    description: udp, icmp, tcp (SYN), arp, raw
                    type: string
                vlan:
                    description: 802.1Q tag; 0 = untagged
                    type: integer
                prio:
                    description: 802.1p priority (0-7) in its VLAN tag
                    type: integer
                dstMac:
                    description: '"" = the destination test port''s (or the gateway''s, or broadcast)'
                    type: string
                srcIp:
                    description: '"" = the test ports'''
                    type: string
                dstIp:
                    description: '"" = the destination test port''s; an address that is not a test port (icmp: its replies are counted); a multicast group; IPv6 makes it an IPv6 stream'
                    type: string
                dport:
                    description: UDP or TCP destination port (default 5001 for UDP, 80 for TCP)
                    type: integer
                size:
                    description: frame bytes (60-9000; the smallest with sizeMode inc or random)
                    type: integer
                pps:
                    description: frames per second (1-100000)
                    type: integer
                seconds:
                    description: 'how long it sends (with pps: seconds × pps frames)'
                    type: integer
                count:
                    description: how many frames (instead of seconds)
                    type: integer
                maxLoss:
                    description: '% for a pass'
                    type: number
                maxLatency:
                    description: ms; 0 = not checked
                    type: number
                off:
                    description: left out of Start All
                    type: boolean
                dscp:
                    description: IP DSCP (0-63)
                    type: integer
                sizeMode:
                    description: '"" fixed, inc (Size..SizeMax, one more each frame), random, imix (64/594/1518 7:4:1)'
                    type: string
                sizeMax:
                    description: the largest frame with sizeMode inc or random
                    type: integer
                burst:
                    description: frames sent back to back (the rate is kept on average)
                    type: integer
                mods:
                    description: fields that change from frame to frame
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FieldChange'
                maxJitter:
                    description: ms for a pass (0 = not checked)
                    type: number
                test:
                    description: made by a test run for one of its trials (not one of the user's streams)
                    type: string
            required:
                - id
                - name
                - from
                - kind
                - size
                - pps
                - maxLoss
        StreamResult:
            type: object
            description: A stream's counters, added up over every KVM host, and its verdict.
            properties:
                id:
                    description: the stream
                    type: string
                tx:
                    description: frames sent
                    type: integer
                rx:
                    description: frames received at the test ports it is for (a duplicate counts once)
                    type: integer
                expected:
                    description: frames that should arrive (to every other test port for a broadcast)
                    type: integer
                other:
                    description: arrived at a test port it was not for (flooded)
                    type: integer
                loss:
                    description: '%'
                    type: number
                latAvg:
                    description: 'ms (-1 = not measured: the ends on different hosts)'
                    type: number
                latMax:
                    description: ms
                    type: number
                latMin:
                    description: ms
                    type: number
                jitter:
                    description: ms, the mean change of latency between frames
                    type: number
                ooo:
                    description: frames that arrived after a later one
                    type: integer
                dup:
                    description: frames that arrived twice (counted once)
                    type: integer
                txRate:
                    description: frames per second, now
                    type: number
                rxRate:
                    description: frames per second, now
                    type: number
                running:
                    description: it is still sending
                    type: boolean
                result:
                    description: '"", pass, fail'
                    type: string
                why:
                    description: why it failed
                    type: string
            required:
                - id
                - tx
                - rx
                - expected
                - other
                - loss
                - latAvg
                - latMax
                - txRate
                - rxRate
                - running
                - result
        TestPort:
            type: object
            description: 'A test port: a sender and counter on a free switch port (no VM). It answers ARP, neighbour solicitations and ping at its addresses.'
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (Test port 1, …)
                    type: string
                vm:
                    description: the switch (its id) it is on
                    type: string
                port:
                    description: the switch port number it is on
                    type: integer
                mac:
                    description: its MAC address
                    type: string
                ip:
                    description: 'with its prefix (10.10.0.1/24): it answers ARP and ping there'
                    type: string
                ip6:
                    description: 'an IPv6 address with its prefix: it answers neighbour solicitations and ping there'
                    type: string
                groups:
                    description: multicast groups it joins (IGMP / MLD reports), to receive multicast streams
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                dhcp:
                    description: it takes its IPv4 address (and gateway) from a DHCP server
                    type: boolean
                slaac:
                    description: it takes its IPv6 address from router advertisements
                    type: boolean
                lldp:
                    description: it announces itself by LLDP every 30 s (the switch sees "Termwright <name>")
                    type: boolean
                lease:
                    description: the address it got by DHCP, and its gateway (filled in for the screens)
                    type: string
                lease6:
                    description: the IPv6 address it got by SLAAC (filled in for the screens)
                    type: string
                gw:
                    description: for streams to another network
                    type: string
                vlan:
                    description: it tags its own frames (ARP and ping answers) with this VLAN
                    type: integer
                portName:
                    description: as the switch names it (filled in for the screens)
                    type: string
                x:
                    description: on the canvas
                    type: number
                y:
                    description: on the canvas
                    type: number
            required:
                - id
                - name
                - vm
                - port
                - mac
        TestRow:
            type: object
            description: 'A line of a test run''s results: per frame size and direction (and load, for frame-loss).'
            properties:
                dir:
                    description: the direction (From → To), when the test runs both ways
                    type: string
                size:
                    description: frame bytes
                    type: integer
                pps:
                    description: 'throughput: the highest rate without loss; frame-loss: the rate tried'
                    type: number
                mbps:
                    description: the rate in Mbit/s of frames (pps × size × 8)
                    type: number
                load:
                    description: 'frame-loss: % of the top rate'
                    type: number
                loss:
                    description: '% lost'
                    type: number
                latMin:
                    description: ms
                    type: number
                latAvg:
                    description: ms
                    type: number
                latMax:
                    description: ms
                    type: number
                jitter:
                    description: ms
                    type: number
                burst:
                    description: 'back-to-back: the longest burst without loss (frames)'
                    type: integer
                addresses:
                    description: 'learning: the most source MACs learned without flooding'
                    type: integer
                lost:
                    description: 'convergence: frames lost'
                    type: integer
                outageMs:
                    description: 'convergence: lost frames ÷ rate, in ms'
                    type: number
                retrans:
                    description: 'iperf TCP: retransmitted segments'
                    type: integer
                trials:
                    description: trials it took
                    type: integer
                note:
                    description: 'what happened (convergence: the action), or why there is no number'
                    type: string
            required:
                - loss
        TestRun:
            type: object
            description: 'A run of a test: its progress while it runs, then its results.'
            properties:
                id:
                    description: the run
                    type: string
                test:
                    description: the test's id
                    type: string
                name:
                    description: the test's name
                    type: string
                kind:
                    description: the test's kind
                    type: string
                status:
                    description: running, done, failed, stopped
                    type: string
                step:
                    description: what it does now
                    type: string
                started:
                    description: RFC 3339
                    type: string
                ended:
                    description: RFC 3339
                    type: string
                rows:
                    description: the results so far
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/TestRow'
                log:
                    description: every trial and its outcome
                    type:
                        - array
