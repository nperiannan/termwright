            description: 'A Linux computer of the emulated lab, like a PC on a desk: set one data port''s IP configuration (IPv4 address/bits or dhcp, IPv6 address/bits or auto, default gateways, DNS server; typed on its console now and at each start), or run one of its apps and read what it printed: ping, ping6, traceroute, web (a page''s text), dns (nslookup), iperf-server, iperf (5 s to a server). desktop: give it a desktop with a web browser on its screen (on true/false, home: the page Firefox opens; needs internet and 1 GB; restart it for the mouse), then use it through lab_keys (keys and click) and its screen picture. Through the API it runs without asking.'
