        HTTPTiming:
            type: object
            properties:
                dns:
                    description: name lookup
                    type: number
                connect:
                    description: TCP connection
                    type: number
                tls:
                    description: TLS handshake
                    type: number
                firstByte:
                    description: from sending until the first byte of the answer
