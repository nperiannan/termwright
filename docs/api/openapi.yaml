        post:
            operationId: addTest
            tags:
                - Traffic tests
            summary: Add a test
            description: Saves a test with the topology. from, to and monitor can be test port names. Run it with POST /lab/traffic/tests/{test}/run.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestInput'
                        examples:
                            throughput:
                                summary: RFC 2544 throughput, both ways, three frame sizes
                                value:
                                    name: uplink-throughput
                                    kind: throughput
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    sizes:
                                        - 64
                                        - 512
                                        - 1518
                                    maxPps: 20000
                                    trial: 5
                            convergence:
                                summary: Pull a LAG member at 5 s, plug it in at 15 s
                                value:
                                    name: lag-failover
                                    kind: convergence
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    rate: 1000
                                    seconds: 30
                                    action: pull
                                    switch: leaf-1
                                    port: "1"
                                    at: 5
                                    hold: 10
                            iperf:
                                summary: iperf3 TCP between two Alpine hosts, 4 streams
                                value:
                                    name: host-tcp
                                    kind: iperf
                                    server: host-2
                                    client: host-1
                                    serverIp: 10.10.0.12
                                    proto: tcp
                                    parallel: 4
                                    seconds: 20
                            learning:
                                summary: RFC 2889 address caching, up to 8192 MACs
                                value:
                                    name: mac-table
                                    kind: learning
                                    from: Test port 1
                                    to: Test port 2
                                    monitor: Test port 3
                                    max: 8192
            responses:
                201:
                    description: Added; the saved tests.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TrafficTest'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
