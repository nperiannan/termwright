                        $ref: '#/components/schemas/EmuSlot'
                values:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                applied:
                    description: hash of the file last written into its disk
                    type: string
                took:
                    description: Applied when the switch showed the model on its CLI
                    type: string
                fail:
                    description: why the check after boot found another model (for Applied)
                    type: string
