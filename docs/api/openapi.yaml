                - qemuImg
                - cpus
                - load
                - memTotal
                - memFree
                - diskFree
                - sudo
                - sudoAll
                - dir
                - osId
                - pkg
                - plan
                - canSetup
                - uplink
                - lanAddr
                - gateway
                - bridges
                - wifi
                - lanIf
                - lanKind
                - guestfs
                - virt
                - nat
                - libvirt
                - problems
                - notes
