        TrafficTest:
            type: object
            description: 'A saved traffic test, run by Termwright as a series of trials on the traffic generator: RFC 2544 throughput, latency, frame-loss and back-to-back, RFC 2889 address learning, or convergence (traffic while a cable is pulled or a switch stops or restarts); or iperf3 between two host VMs of the lab.'
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (unique)
                    type: string
                kind:
                    description: throughput, latency, frame-loss, back-to-back (RFC 2544), learning (RFC 2889 address caching), convergence, iperf (iperf3 between two host VMs)
                    type: string
                from:
                    description: the test port the frames go from (id; the API takes a name too)
                    type: string
                to:
                    description: the test port they go to
                    type: string
                both:
                    description: also the other way, at the same time (throughput, latency, frame-loss, convergence)
                    type: boolean
                monitor:
                    description: 'learning: a third test port that sees frames flooded to it'
                    type: string
                vlan:
                    description: 802.1Q tag on the test frames
                    type: integer
                sizes:
                    description: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)
                    type:
                        - array
                        - "null"
                    items:
                        type: integer
                trial:
                    description: seconds per trial (default 5)
                    type: integer
                maxPps:
                    description: the highest rate tried, frames per second (default 10000)
                    type: integer
                rate:
                    description: 'latency, frame-loss, convergence: the rate (default: latency the throughput found at that size, else 1000)'
                    type: integer
                loss:
                    description: loss % that still counts as none (default 0)
                    type: number
                resolution:
                    description: 'throughput, back-to-back, learning: the search stops when the step is below this % (default 2)'
                    type: number
                max:
                    description: 'back-to-back: the longest burst tried (frames, default 10000); learning: the most addresses tried (default 4096)'
                    type: integer
                action:
                    description: 'convergence: pull (a cable or LAG member), stop (a switch), restart (a switch)'
                    type: string
                switch:
                    description: 'convergence: the switch (name or id)'
                    type: string
                port:
                    description: 'convergence, pull: the port whose cable is pulled'
                    type: string
                at:
                    description: 'convergence: seconds after the start (default 5)'
                    type: integer
                hold:
                    description: 'convergence: seconds until the cable is plugged in or the switch started again (0 = not)'
                    type: integer
                seconds:
                    description: 'convergence, iperf: how long the traffic runs (default 30, iperf 10)'
                    type: integer
                server:
                    description: 'iperf: the host VM (name or id) that runs iperf3 -s'
                    type: string
                client:
                    description: 'iperf: the host VM that runs iperf3 -c'
                    type: string
                serverIp:
                    description: 'iperf: the server''s address the client connects to (on its data port; default its management address)'
                    type: string
                proto:
                    description: 'iperf: tcp (default) or udp'
                    type: string
                bandwidth:
                    description: 'iperf: target rate (iperf3 -b: 100M, 1G; udp default 1M)'
                    type: string
                parallel:
                    description: 'iperf: parallel streams (iperf3 -P)'
                    type: integer
                reverse:
                    description: 'iperf: the server sends (iperf3 -R)'
                    type: boolean
            required:
                - id
                - name
                - kind
        TrafficView:
            type: object
            description: 'The traffic generator: its test ports, streams and their results now (live while a run goes on).'
