                    type: string
                file:
                    description: on this computer
                    type: string
                sha256:
                    type: string
                size:
                    type: integer
                url:
                    type: string
                md5:
                    type: string
                page:
                    type: string
                bus:
                    description: 'hdb…: ide, sata, scsi, virtio ("" = the image''s)'
                    type: string
            required:
                - slot
                - fileName
                - file
                - sha256
                - size
        EmuDot1x:
            type: object
            properties:
                user:
                    description: default user{n}
                    type: string
                password:
                    description: default "password"
                    type: string
                method:
                    description: md5 (default) or peap (PEAPv0 with EAP-MSCHAPv2 inside)
                    type: string
        EmuEncap:
            type: object
            properties:
                outer:
                    description: 'an outer VLAN tag (QinQ: 802.1ad S-tag) in front of the stream''s own'
                    anyOf:
