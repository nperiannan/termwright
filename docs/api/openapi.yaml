            description: 'Type on the keyboard of a lab device''s screen (VGA display: installers and systems without a serial console), or a line on an installer''s serial console. switch: the device; install: an install''s id (lab_install_status) instead. text is typed as keys (then Enter with enter); keys are QEMU key names (ret, esc, tab, up, down, f2, ctrl-alt-delete …); click clicks the mouse first (a computer with its desktop). console: true types the line on the installer''s serial console instead of its keyboard. The screen itself: GET /api/v1/lab/screen/{device} (or install:{id}) gives a PNG. Through the API it runs without asking.'
