# The Termwright local API, OpenAPI 3.2.1. Made by: go test -run TestOpenAPIDoc -update (do not edit by hand).
openapi: 3.2.1
info:
    title: Termwright local API
    summary: The emulated lab of Termwright for scripts, test frameworks and CI on this computer.
    description: |-
        The emulated lab of Termwright (switch VMs on KVM hosts) for your own scripts, test frameworks and CI, on this computer only.

        **Turn it on:** Settings → AI Assistant → Local API. The address and the key are there (*Copy Key*), and in `mcp.json` in Termwright's data folder (`url` and `token`), which a script can read. The key changes each time Termwright starts.

        **Send the key** as `Authorization: Bearer <key>`. Requests from web pages (with an Origin header) are refused.

        **Nothing is asked first**: unlike the Claude connector, the API is your own automation. Its changes show as *API* in the lab's Events.

        **Errors** are RFC 9457 problem details (`application/problem+json`): 400 a bad request, 401 no or a wrong key, 403 the API is off, 404 no such thing, 405 a wrong method (see Allow), 422 the lab could not do it.

        **The same from a terminal:** `termwright lab help`, for example `termwright lab traffic start voice` or `termwright lab traffic report --csv`.

        A typical test: add test ports (POST /lab/traffic/ports), add streams (POST /lab/traffic/streams), start (POST /lab/traffic/start), poll GET /lab/traffic until running is false, then GET /lab/traffic/report.
    version: 1.0.0
    license:
        name: Apache 2.0
        identifier: Apache-2.0
servers:
    - url: http://127.0.0.1:{port}/api/v1
      description: Termwright on this computer (its address is in mcp.json in the data folder, and in Settings → AI Assistant → Local API).
      variables:
        port:
            default: "8080"
            description: Chosen when Termwright starts.
security:
    - bearerAuth: []
tags:
    - name: Lab
      description: The open topology.
    - name: Tools
      description: 'The lab tools: switches, cables, power, consoles, cabling check, moves, captures, link check, Events and the traffic generator as one tool.'
    - name: Traffic
      description: 'The traffic generator: runs, live results and the report.'
    - name: Traffic ports
      summary: Test ports
      parent: Traffic
      description: Test ports on switch ports.
    - name: Traffic streams
      summary: Streams
      parent: Traffic
      description: Streams between test ports.
    - name: Traffic tests
      summary: Tests
      parent: Traffic
      description: RFC 2544, RFC 2889 learning and convergence tests, and their runs.
    - name: API
      description: This description.
paths:
    /openapi.json:
        get:
            operationId: getOpenAPI
            tags:
                - API
            summary: This description, as JSON
            description: The OpenAPI document of this API (as JSON; /openapi.yaml as YAML). It needs no key.
            security:
                - {}
            responses:
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
                200:
                    description: The OpenAPI document.
                    content:
                        application/json:
                            schema:
                                type: object
    /openapi.yaml:
        get:
            operationId: getOpenAPIYaml
            tags:
                - API
            summary: This description, as YAML
            description: The OpenAPI document of this API as YAML. It needs no key.
            security:
                - {}
            responses:
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
                200:
                    description: The OpenAPI document.
                    content:
                        application/yaml:
                            schema:
                                type: string
    /lab:
        get:
            operationId: getLab
            tags:
                - Lab
            summary: The lab
            description: 'The open topology: its switches with their state, management addresses and consoles, the cables and LAGs, the KVM hosts, images and the latest Events.'
            responses:
                200:
                    description: The lab.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Lab'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/tools:
        get:
            operationId: listTools
            tags:
                - Tools
            summary: The lab tools
            description: Every lab tool with its arguments (JSON Schema). Each one is POST /lab/tools/{name}.
            responses:
                200:
                    description: The tools.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Tool'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/screen/{id}:
        get:
            operationId: getScreen
            tags:
                - Lab
            summary: A device's screen
            description: 'A picture of what a lab device''s display shows now (its VGA screen: installers and systems without a serial console), as PNG. id: the device''s name or id, or install:{id} for an installer. Type on it with the lab_keys tool.'
            parameters:
                - name: id
                  in: path
                  required: true
                  description: The device (name or id), or install:{install id}.
                  schema:
                    type: string
            responses:
                200:
                    description: The screen.
                    content:
                        image/png:
                            schema:
                                type: string
                                format: binary
                409:
                    $ref: '#/components/responses/'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic:
        get:
            operationId: getTraffic
            tags:
                - Traffic
            summary: Test ports, streams and results
            description: The traffic generator now. While a run goes on, the results are live (counters, rates and the rate history for graphs); after it, they are final.
            responses:
                200:
                    description: The traffic generator.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrafficView'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/report:
        get:
            operationId: getTrafficReport
            tags:
                - Traffic
            summary: The report
            description: 'The last (or running) run''s report: a pass or fail per stream with its counters, loss, latency, jitter, order and the reason of a fail.'
            parameters:
                - name: format
                  in: query
                  required: false
                  description: json (the traffic view), csv, html or text.
                  schema:
                    type: string
                    enum:
                        - json
                        - csv
                        - html
                        - text
                    default: json
            responses:
                200:
                    description: The report.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrafficView'
                        text/csv:
                            schema:
                                type: string
                        text/html:
                            schema:
                                type: string
                        text/plain:
                            schema:
                                type: string
                400:
                    $ref: '#/components/responses/BadRequest'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/ports:
        post:
            operationId: addTestPort
            tags:
                - Traffic ports
            summary: Add a test port
            description: Puts a test port on a free port of a switch. A running switch takes it when it restarts (the result's note says so).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - switch
                                - port
                            properties:
                                switch:
                                    type: string
                                    description: The switch's name (or id).
                                port:
                                    type: string
                                    description: A free data port, named as the switch names it (1, 1/5, …).
                                name:
                                    type: string
                                    description: 'Its name (default: Test port n).'
                                ip:
                                    type: string
                                    description: 'IPv4 address with prefix (/24 when it has none), or dhcp: it takes one from a DHCP server (the lease shows in TestPort.lease).'
                                ip6:
                                    type: string
                                    description: 'IPv6 address with prefix (/64 when it has none), or slaac: it takes one from router advertisements.'
                                lldp:
                                    type: boolean
                                    default: true
                                    description: Announce it by LLDP every 30 s, so the switch sees Termwright <name> on its port.
                                gateway:
                                    type: string
                                    description: Gateway for streams to another network.
                                vlan:
                                    type: integer
                                    minimum: 0
                                    maximum: 4094
                                    description: Tags its own frames (ARP and ping answers) with this VLAN.
                                groups:
                                    type: array
                                    items:
                                        type: string
                                    description: Multicast groups it joins (IGMPv2 / MLDv1 reports every 10 s and on a query).
                        examples:
                            v4:
                                summary: An IPv4 test port
                                value:
                                    switch: leaf-1
                                    port: "5"
                                    ip: 10.10.0.1/24
                            dual:
                                summary: IPv4 and IPv6, in a multicast group
                                value:
                                    switch: leaf-2
                                    port: "5"
                                    ip: 10.10.0.2/24
                                    ip6: fd00::2/64
                                    groups:
                                        - 239.1.1.1
                            dhcp:
                                summary: 'Addresses from the network: DHCP and SLAAC'
                                value:
                                    switch: access-1
                                    port: "12"
                                    ip: dhcp
                                    ip6: slaac
            responses:
                201:
                    description: Added; the traffic view with it.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrafficView'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/ports/{port}:
        parameters:
            - name: port
              in: path
              required: true
              description: The test port's name (Test port 1) or id.
              schema:
                type: string
        patch:
            operationId: changeTestPort
            tags:
                - Traffic ports
            summary: Change a test port
            description: Changes its name, addresses, gateway, VLAN or multicast groups.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            minProperties: 1
                            additionalProperties: false
                            description: Only the fields given change.
                            properties:
                                name:
                                    type: string
                                ip:
                                    type: string
                                ip6:
                                    type: string
                                gateway:
                                    type: string
                                vlan:
                                    type: integer
                                    minimum: 0
                                    maximum: 4094
                                groups:
                                    type: array
                                    items:
                                        type: string
                                lldp:
                                    type: boolean
                        example:
                            groups:
                                - 239.1.1.1
                                - 239.1.1.2
            responses:
                200:
                    description: Changed; the traffic view.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrafficView'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
        delete:
            operationId: removeTestPort
            tags:
                - Traffic ports
            summary: Remove a test port
            description: Removes the test port and its streams.
            responses:
                204:
                    description: Removed.
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/streams:
        post:
            operationId: addStream
            tags:
                - Traffic streams
            summary: Add a stream
            description: 'Adds a stream. from and to can be test port names or ids. Without to: every other test port (broadcast), dstIp, or a multicast group in dstIp.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StreamInput'
                        examples:
                            voice:
                                summary: Voice-like UDP with DSCP EF
                                value:
                                    name: voice
                                    from: Test port 1
                                    to: Test port 2
                                    kind: udp
                                    size: 200
                                    pps: 1000
                                    seconds: 30
                                    dscp: 46
                                    maxLoss: 0.1
                                    maxLatency: 5
                                    maxJitter: 1
                            imixFlows:
                                summary: IMIX with 100 source addresses (for LAG / ECMP hashing)
                                value:
                                    name: imix-100
                                    from: Test port 1
                                    to: Test port 2
                                    kind: udp
                                    size: 64
                                    sizeMode: imix
                                    pps: 5000
                                    seconds: 60
                                    maxLoss: 0
                                    mods:
                                        - field: srcIp
                                          mode: inc
                                          count: 100
                            multicast:
                                summary: Multicast to the test ports that joined 239.1.1.1
                                value:
                                    name: mcast
                                    from: Test port 1
                                    kind: udp
                                    dstIp: 239.1.1.1
                                    size: 512
                                    pps: 500
                                    seconds: 20
                                    maxLoss: 0
                            ipv6:
                                summary: IPv6 ping between two test ports
                                value:
                                    name: v6-ping
                                    from: Test port 1
                                    to: Test port 2
                                    kind: icmp
                                    dstIp: fd00::2
                                    size: 100
                                    pps: 100
                                    count: 500
                                    maxLoss: 0
            responses:
                201:
                    description: Added; the traffic view with it.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrafficView'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/streams/{stream}:
        parameters:
            - name: stream
              in: path
              required: true
              description: The stream's name or id.
              schema:
                type: string
        put:
            operationId: replaceStream
            tags:
                - Traffic streams
            summary: Replace a stream
            description: Replaces the stream with the one given (its id stays).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StreamInput'
                        examples:
                            voice:
                                summary: Voice-like UDP with DSCP EF
                                value:
                                    name: voice
                                    from: Test port 1
                                    to: Test port 2
                                    kind: udp
                                    size: 200
                                    pps: 1000
                                    seconds: 30
                                    dscp: 46
                                    maxLoss: 0.1
                                    maxLatency: 5
                                    maxJitter: 1
                            imixFlows:
                                summary: IMIX with 100 source addresses (for LAG / ECMP hashing)
                                value:
                                    name: imix-100
                                    from: Test port 1
                                    to: Test port 2
                                    kind: udp
                                    size: 64
                                    sizeMode: imix
                                    pps: 5000
                                    seconds: 60
                                    maxLoss: 0
                                    mods:
                                        - field: srcIp
                                          mode: inc
                                          count: 100
                            multicast:
                                summary: Multicast to the test ports that joined 239.1.1.1
                                value:
                                    name: mcast
                                    from: Test port 1
                                    kind: udp
                                    dstIp: 239.1.1.1
                                    size: 512
                                    pps: 500
                                    seconds: 20
                                    maxLoss: 0
                            ipv6:
                                summary: IPv6 ping between two test ports
                                value:
                                    name: v6-ping
                                    from: Test port 1
                                    to: Test port 2
                                    kind: icmp
                                    dstIp: fd00::2
                                    size: 100
                                    pps: 100
                                    count: 500
                                    maxLoss: 0
            responses:
                200:
                    description: Replaced; the traffic view.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TrafficView'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
        delete:
            operationId: removeStream
            tags:
                - Traffic streams
            summary: Remove a stream
            description: Removes the stream.
            responses:
                204:
                    description: Removed.
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/tests:
        get:
            operationId: listTests
            tags:
                - Traffic tests
            summary: The saved tests
            description: The saved traffic tests of the open topology.
            responses:
                200:
                    description: The tests.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TrafficTest'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
        post:
            operationId: addTest
            tags:
                - Traffic tests
            summary: Add a test
            description: Saves a test with the topology. from, to and monitor can be test port names. Run it with POST /lab/traffic/tests/{test}/run.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestInput'
                        examples:
                            throughput:
                                summary: RFC 2544 throughput, both ways, three frame sizes
                                value:
                                    name: uplink-throughput
                                    kind: throughput
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    sizes:
                                        - 64
                                        - 512
                                        - 1518
                                    maxPps: 20000
                                    trial: 5
                            convergence:
                                summary: Pull a LAG member at 5 s, plug it in at 15 s
                                value:
                                    name: lag-failover
                                    kind: convergence
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    rate: 1000
                                    seconds: 30
                                    action: pull
                                    switch: leaf-1
                                    port: "1"
                                    at: 5
                                    hold: 10
                            iperf:
                                summary: iperf3 TCP between two Alpine hosts, 4 streams
                                value:
                                    name: host-tcp
                                    kind: iperf
                                    server: host-2
                                    client: host-1
                                    serverIp: 10.10.0.12
                                    proto: tcp
                                    parallel: 4
                                    seconds: 20
                            learning:
                                summary: RFC 2889 address caching, up to 8192 MACs
                                value:
                                    name: mac-table
                                    kind: learning
                                    from: Test port 1
                                    to: Test port 2
                                    monitor: Test port 3
                                    max: 8192
            responses:
                201:
                    description: Added; the saved tests.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TrafficTest'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/tests/{test}:
        parameters:
            - name: test
              in: path
              required: true
              description: The test's name or id.
              schema:
                type: string
        put:
            operationId: replaceTest
            tags:
                - Traffic tests
            summary: Replace a test
            description: Replaces the test with the one given (its id stays).
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/TestInput'
                        examples:
                            throughput:
                                summary: RFC 2544 throughput, both ways, three frame sizes
                                value:
                                    name: uplink-throughput
                                    kind: throughput
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    sizes:
                                        - 64
                                        - 512
                                        - 1518
                                    maxPps: 20000
                                    trial: 5
                            convergence:
                                summary: Pull a LAG member at 5 s, plug it in at 15 s
                                value:
                                    name: lag-failover
                                    kind: convergence
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    rate: 1000
                                    seconds: 30
                                    action: pull
                                    switch: leaf-1
                                    port: "1"
                                    at: 5
                                    hold: 10
                            iperf:
                                summary: iperf3 TCP between two Alpine hosts, 4 streams
                                value:
                                    name: host-tcp
                                    kind: iperf
                                    server: host-2
                                    client: host-1
                                    serverIp: 10.10.0.12
                                    proto: tcp
                                    parallel: 4
                                    seconds: 20
                            learning:
                                summary: RFC 2889 address caching, up to 8192 MACs
                                value:
                                    name: mac-table
                                    kind: learning
                                    from: Test port 1
                                    to: Test port 2
                                    monitor: Test port 3
                                    max: 8192
            responses:
                200:
                    description: Replaced; the saved tests.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TrafficTest'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
        delete:
            operationId: removeTest
            tags:
                - Traffic tests
            summary: Remove a test
            description: Removes the saved test (its past runs stay in /lab/traffic/runs).
            responses:
                204:
                    description: Removed.
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/tests/{test}/run:
        parameters:
            - name: test
              in: path
              required: true
              description: The test's name or id.
              schema:
                type: string
        post:
            operationId: runTest
            tags:
                - Traffic tests
            summary: Run a test
            description: 'Starts the test in the background and answers at once (202, Location: the run). Poll GET /lab/traffic/runs/{run} until status is not running. One test runs at a time, and not while other traffic runs.'
            responses:
                202:
                    description: Started.
                    headers:
                        Location:
                            description: 'The run: /api/v1/lab/traffic/runs/{run}'
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/TestRun'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/runs:
        get:
            operationId: listRuns
            tags:
                - Traffic tests
            summary: The test runs
            description: The running test (first) and the last 20 runs, newest first.
            responses:
                200:
                    description: The runs.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/TestRun'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /lab/traffic/runs/{run}:
        parameters:
            - name: run
              in: path
              required: true
