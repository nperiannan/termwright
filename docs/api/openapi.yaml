        LabModel:
            type: object
            properties:
                sku:
                    type: string
                family:
                    type: string
                os:
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                osName:
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: string
                ports:
                    type: integer
                layout:
                    description: '"16 2.5G multirate PoE, 8 1G copper"'
                    type: string
            required:
                - sku
                - family
                - os
                - osName
                - ports
                - layout
        LabOS:
            type: object
            properties:
                name:
                    type: string
                short:
                    type: string
                configCommand:
                    type: string
            required:
                - name
                - short
                - configCommand
        LagView:
            type: object
            properties:
                name:
                    type: string
                mode:
                    type: string
                source:
                    type: string
            required:
                - name
                - mode
                - source
        LatBin:
            type: object
            properties:
                lo:
                    description: ms
                    type: number
                hi:
                    description: ms
                    type: number
                n:
                    description: frames
                    type: integer
            required:
                - lo
                - hi
                - "n"
        Mark:
            type: object
            properties:
                vlan:
                    type: integer
                prio:
                    type: integer
                dscp:
                    type: integer
                n:
                    type: integer
            required:
                - vlan
                - prio
                - dscp
                - "n"
        PortResult:
            type: object
            properties:
                id:
                    description: the test port
                    type: string
                tx:
                    description: frames sent
                    type: integer
                rx:
                    description: frames received
                    type: integer
                txBytes:
                    description: bytes sent (with the FCS)
                    type: integer
                rxBytes:
                    description: bytes received
                    type: integer
                txRate:
                    description: frames per second, now
                    type: number
                rxRate:
                    description: frames per second, now
                    type: number
                txMbps:
                    description: Mbit/s on the wire, now (with the preamble and gap)
                    type: number
                rxMbps:
                    description: Mbit/s on the wire, now
                    type: number
                expected:
                    description: its streams' frames that should have arrived here
                    type: integer
                got:
                    description: of those, how many did
                    type: integer
                loss:
                    description: '%'
                    type: number
                latAvg:
                    description: ms (-1 = not measured)
                    type: number
                latMax:
                    description: ms
                    type: number
                errors:
                    description: frames it could not send, out of order or twice
                    type: integer
                streams:
                    description: 'per stream: its frames that arrived here'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type: integer
            required:
                - id
                - tx
                - rx
                - txBytes
                - rxBytes
                - txRate
                - rxRate
                - txMbps
                - rxMbps
                - expected
                - got
                - loss
                - latAvg
                - latMax
                - errors
        Stream:
            type: object
            description: Frames from one test port to another, to every other one (broadcast), to an address or to a multicast group.
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (unique; the API and command line find it by it)
                    type: string
                from:
                    description: the test port it is sent from (id; the API takes a name too)
                    type: string
                to:
                    description: a test port; "" = every other one (broadcast)
                    type: string
                kind:
                    description: udp, icmp, tcp (SYN), arp, raw, pcap (a capture's frames, replayed)
                    type: string
                vlan:
                    description: 802.1Q tag; 0 = untagged
                    type: integer
                prio:
                    description: 802.1p priority (0-7) in its VLAN tag
                    type: integer
                dstMac:
                    description: '"" = the destination test port''s (or the gateway''s, or broadcast)'
                    type: string
                srcIp:
                    description: '"" = the test ports'''
                    type: string
                dstIp:
                    description: '"" = the destination test port''s; an address that is not a test port (icmp: its replies are counted); a multicast group; IPv6 makes it an IPv6 stream'
                    type: string
                dport:
                    description: UDP or TCP destination port (default 5001 for UDP, 80 for TCP)
                    type: integer
                size:
                    description: frame bytes (60-9000; the smallest with sizeMode inc or random)
                    type: integer
                pps:
                    description: frames per second (1-100000)
                    type: integer
                seconds:
                    description: 'how long it sends (with pps: seconds × pps frames)'
                    type: integer
                count:
                    description: how many frames (instead of seconds)
                    type: integer
                maxLoss:
                    description: '% for a pass'
                    type: number
                maxLatency:
                    description: ms; 0 = not checked
                    type: number
                off:
                    description: left out of Start All
                    type: boolean
                dscp:
                    description: IP DSCP (0-63)
                    type: integer
                sizeMode:
                    description: '"" fixed, inc (Size..SizeMax, one more each frame), random, imix (64/594/1518 7:4:1)'
                    type: string
                sizeMax:
                    description: the largest frame with sizeMode inc or random
                    type: integer
                burst:
                    description: frames sent back to back (the rate is kept on average)
                    type: integer
                mods:
                    description: fields that change from frame to frame
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FieldChange'
                maxJitter:
                    description: ms for a pass (0 = not checked)
                    type: number
                test:
                    description: made by a test run for one of its trials (not one of the user's streams)
                    type: string
                rateUnit:
                    description: 'how the rate was given: "" frames per second (pps), mbps (Mbit/s on the wire), pct (% of the sending test port''s line rate)'
                    type: string
                rate:
                    description: the rate in that unit (pps is worked out from it)
                    type: number
                rtt:
                    description: 'round trip: the test port it goes to sends each frame back, and the latency is the round trip (measured on one clock, so also between test ports on two hosts)'
                    type: boolean
                pcap:
                    description: 'pcap: the capture file on this computer (classic pcap; Wireshark: Save As pcap)'
                    type: string
                pcapId:
                    description: 'pcap: the capture as Termwright keeps it (its contents'' hash; set when saved)'
                    type: string
                pcapFrames:
                    description: 'pcap: frames in the capture (set when saved)'
                    type: integer
                pcapSecs:
                    description: 'pcap: how long the capture lasts, s (set when saved)'
                    type: number
                pcapTiming:
                    description: 'pcap: send with the capture''s own gaps between frames (else at the rate)'
                    type: boolean
                loops:
                    description: 'pcap: times through the capture (default 1; count or seconds instead)'
                    type: integer
                rewriteMacs:
                    description: 'pcap: frames go from this test port''s MAC to the destination test port''s (else as captured)'
                    type: boolean
            required:
                - id
                - name
                - from
                - kind
                - size
                - pps
                - maxLoss
        StreamResult:
            type: object
            description: A stream's counters, added up over every KVM host, and its verdict.
            properties:
                id:
                    description: the stream
                    type: string
                tx:
                    description: frames sent
                    type: integer
                rx:
                    description: frames received at the test ports it is for (a duplicate counts once)
                    type: integer
                expected:
                    description: frames that should arrive (to every other test port for a broadcast)
                    type: integer
                other:
                    description: arrived at a test port it was not for (flooded)
                    type: integer
                loss:
                    description: '%'
                    type: number
                latAvg:
                    description: 'ms (-1 = not measured: the ends on different hosts)'
                    type: number
                latMax:
                    description: ms
                    type: number
                latMin:
                    description: ms
                    type: number
                jitter:
                    description: ms, the mean change of latency between frames
                    type: number
                ooo:
                    description: frames that arrived after a later one
                    type: integer
                dup:
                    description: frames that arrived twice (counted once)
                    type: integer
                txRate:
                    description: frames per second, now
                    type: number
                rxRate:
                    description: frames per second, now
                    type: number
                running:
                    description: it is still sending
                    type: boolean
                result:
                    description: '"", pass, fail'
                    type: string
                why:
                    description: why it failed
                    type: string
                p50:
                    description: 'latency percentiles, ms (from a histogram of quarter octaves: within 10 %)'
                    type: number
                p95:
                    description: 'ms: 95 % of the frames were faster'
                    type: number
                p99:
                    description: 'ms: 99 % of the frames were faster'
                    type: number
                hist:
                    description: the latency histogram, an octave a bar
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/LatBin'
                flows:
                    description: 'a stream with changing fields: its flows, the most lossy first (at most 32)'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FlowResult'
                flowsN:
                    description: how many flows it has sent
                    type: integer
                flowsLossy:
                    description: how many of them lost frames
                    type: integer
                marks:
                    description: the VLAN, priority and DSCP its frames arrived with
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/Mark'
                txMbps:
                    description: Mbit/s on the wire, now
                    type: number
                rxMbps:
                    description: Mbit/s on the wire received, now
                    type: number
            required:
                - id
                - tx
                - rx
                - expected
                - other
                - loss
                - latAvg
                - latMax
                - txRate
                - rxRate
                - running
                - result
        TestPort:
            type: object
            description: 'A test port: a sender and counter on a free switch port (no VM). It answers ARP, neighbour solicitations and ping at its addresses.'
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (Test port 1, …)
                    type: string
                vm:
                    description: the switch (its id) it is on
                    type: string
                port:
                    description: the switch port number it is on
                    type: integer
                mac:
                    description: its MAC address
                    type: string
                ip:
                    description: 'with its prefix (10.10.0.1/24): it answers ARP and ping there'
                    type: string
                ip6:
                    description: 'an IPv6 address with its prefix: it answers neighbour solicitations and ping there'
                    type: string
                groups:
                    description: multicast groups it joins (IGMP / MLD reports), to receive multicast streams
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                dhcp:
                    description: it takes its IPv4 address (and gateway) from a DHCP server
                    type: boolean
                slaac:
                    description: it takes its IPv6 address from router advertisements
                    type: boolean
                lldp:
                    description: it announces itself by LLDP every 30 s (the switch sees "Termwright <name>")
                    type: boolean
                lease:
                    description: the address it got by DHCP, and its gateway (filled in for the screens)
                    type: string
                lease6:
                    description: the IPv6 address it got by SLAAC (filled in for the screens)
                    type: string
                gw:
                    description: for streams to another network
                    type: string
                vlan:
                    description: it tags its own frames (ARP and ping answers) with this VLAN
                    type: integer
                speed:
                    description: its line rate, Mbit/s, for rates given as % of it (default 1000)
                    type: integer
                lag:
                    description: test ports with the same LAG name speak LACP (active) and form one link aggregation with the switch
                    type: string
                lacpFast:
                    description: LACP every second (else every 30 s)
                    type: boolean
                lacpUp:
                    description: 'the LAG as LACP has it: "up" or why not (filled in for the screens)'
                    type: string
                neighbor:
                    description: 'what the switch says on LLDP: its name and port (filled in for the screens)'
                    type: string
                clients:
                    description: many hosts behind it (DHCP, multicast, 802.1X), each with its own MAC
                    anyOf:
                        - $ref: '#/components/schemas/EmuClients'
                        - type: "null"
                stp:
                    description: it speaks spanning tree (STP or RSTP)
                    anyOf:
                        - $ref: '#/components/schemas/EmuSTP'
                        - type: "null"
                clientState:
                    description: ClientState is how its clients are doing (filled in for the screens).
                    anyOf:
                        - $ref: '#/components/schemas/EmuClientState'
                        - type: "null"
                stpState:
                    description: STPState is what it hears from the switch by spanning tree (filled in for the screens).
                    anyOf:
                        - $ref: '#/components/schemas/EmuSTPState'
                        - type: "null"
                portName:
                    description: as the switch names it (filled in for the screens)
                    type: string
                x:
                    description: on the canvas
                    type: number
                y:
                    description: on the canvas
                    type: number
            required:
                - id
                - name
                - vm
                - port
                - mac
        TestRow:
            type: object
            description: 'A line of a test run''s results: per frame size and direction (and load, for frame-loss).'
            properties:
                dir:
                    description: the direction (From → To), when the test runs both ways
                    type: string
                size:
                    description: frame bytes
                    type: integer
                pps:
                    description: 'throughput: the highest rate without loss; frame-loss: the rate tried'
                    type: number
                mbps:
                    description: the rate in Mbit/s of frames (pps × size × 8)
                    type: number
                load:
                    description: 'frame-loss: % of the top rate'
                    type: number
                loss:
                    description: '% lost'
                    type: number
                latMin:
                    description: ms
                    type: number
                latAvg:
                    description: ms
                    type: number
                latMax:
                    description: ms
                    type: number
                jitter:
                    description: ms
                    type: number
                burst:
                    description: 'back-to-back: the longest burst without loss (frames)'
                    type: integer
                addresses:
                    description: 'learning: the most source MACs learned without flooding'
                    type: integer
                lost:
                    description: 'convergence: frames lost'
                    type: integer
                outageMs:
                    description: 'convergence: lost frames ÷ rate, in ms'
                    type: number
                retrans:
                    description: 'iperf TCP: retransmitted segments'
                    type: integer
                trials:
                    description: trials it took
                    type: integer
                note:
                    description: 'what happened (convergence: the action), or why there is no number'
                    type: string
            required:
                - loss
        TestRun:
            type: object
            description: 'A run of a test: its progress while it runs, then its results.'
            properties:
                id:
                    description: the run
                    type: string
                test:
                    description: the test's id
                    type: string
                name:
                    description: the test's name
                    type: string
                kind:
                    description: the test's kind
                    type: string
                status:
                    description: running, done, failed, stopped
                    type: string
                step:
                    description: what it does now
                    type: string
                started:
                    description: RFC 3339
                    type: string
                ended:
                    description: RFC 3339
                    type: string
                rows:
                    description: the results so far
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/TestRow'
                log:
                    description: every trial and its outcome
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                error:
                    description: why it failed
                    type: string
            required:
                - id
                - test
                - name
                - kind
                - status
                - started
                - rows
        Tool:
            type: object
            description: 'A lab tool: the same tools the Claude connector and the in-app AI agent use.'
            properties:
                name:
                    type: string
                description:
                    type: string
                args:
                    type:
                        - object
                        - "null"
                    additionalProperties: {}
                required:
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - name
                - description
                - args
        TrafficTest:
            type: object
            description: 'A saved traffic test, run by Termwright as a series of trials on the traffic generator: RFC 2544 throughput, latency, frame-loss and back-to-back, RFC 2889 address learning, or convergence (traffic while a cable is pulled or a switch stops or restarts); or iperf3 between two host VMs of the lab.'
            properties:
                id:
                    description: its id (made by Termwright)
                    type: string
                name:
                    description: its name (unique)
                    type: string
                kind:
                    description: throughput, latency, frame-loss, back-to-back (RFC 2544), learning (RFC 2889 address caching), convergence, iperf (iperf3 between two host VMs)
                    type: string
                from:
                    description: the test port the frames go from (id; the API takes a name too)
                    type: string
                to:
                    description: the test port they go to
                    type: string
                both:
                    description: also the other way, at the same time (throughput, latency, frame-loss, convergence)
                    type: boolean
                monitor:
                    description: 'learning: a third test port that sees frames flooded to it'
                    type: string
                vlan:
                    description: 802.1Q tag on the test frames
                    type: integer
                sizes:
                    description: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)
                    type:
                        - array
                        - "null"
                    items:
                        type: integer
                trial:
                    description: seconds per trial (default 5)
                    type: integer
                maxPps:
                    description: the highest rate tried, frames per second (default 10000)
                    type: integer
                rate:
                    description: 'latency, frame-loss, convergence: the rate (default: latency the throughput found at that size, else 1000)'
                    type: integer
                loss:
                    description: loss % that still counts as none (default 0)
                    type: number
                resolution:
                    description: 'throughput, back-to-back, learning: the search stops when the step is below this % (default 2)'
                    type: number
                max:
                    description: 'back-to-back: the longest burst tried (frames, default 10000); learning: the most addresses tried (default 4096)'
                    type: integer
                action:
                    description: 'convergence: pull (a cable or LAG member), stop (a switch), restart (a switch)'
                    type: string
                switch:
                    description: 'convergence: the switch (name or id)'
                    type: string
                port:
                    description: 'convergence, pull: the port whose cable is pulled'
                    type: string
                at:
                    description: 'convergence: seconds after the start (default 5)'
                    type: integer
                hold:
                    description: 'convergence: seconds until the cable is plugged in or the switch started again (0 = not)'
                    type: integer
                seconds:
                    description: 'convergence, iperf: how long the traffic runs (default 30, iperf 10)'
                    type: integer
                server:
                    description: 'iperf: the host VM (name or id) that runs iperf3 -s'
                    type: string
                client:
                    description: 'iperf: the host VM that runs iperf3 -c'
                    type: string
                serverIp:
                    description: 'iperf: the server''s address the client connects to (default: its first data port with a fixed address, else its management address)'
                    type: string
                proto:
                    description: 'iperf: tcp (default) or udp'
                    type: string
                bandwidth:
                    description: 'iperf: target rate (iperf3 -b: 100M, 1G; udp default 1M)'
                    type: string
                parallel:
                    description: 'iperf: parallel streams (iperf3 -P)'
                    type: integer
                reverse:
                    description: 'iperf: the server sends (iperf3 -R)'
                    type: boolean
            required:
                - id
                - name
                - kind
        TrafficView:
            type: object
            description: 'The traffic generator: its test ports, streams and their results now (live while a run goes on).'
            properties:
                testers:
                    description: the test ports
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/TestPort'
                streams:
                    description: the streams
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/Stream'
                results:
                    description: 'per stream: its counters and verdict (the last run''s, or the running one''s)'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/StreamResult'
                running:
                    description: a run is going on
                    type: boolean
                started:
                    description: when the run started (RFC 3339)
                    type: string
                note:
                    description: something to do (restart a switch for its test port)
                    type: string
                history:
                    description: 'History: per stream, the run so far ([seconds since the start, tx/s, rx/s, loss % so far, average latency ms (-1: not measured)]), for the graphs.'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type:
                            - array
                            - "null"
                        items:
                            type: array
                            items:
                                type: number
                            minItems: 5
                            maxItems: 5
                ports:
                    description: 'per test port: its statistics over the run'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/PortResult'
                portHistory:
                    description: 'per test port: its rates over the last minute ([seconds since the start, tx/s, rx/s])'
                    type:
                        - object
                        - "null"
                    additionalProperties:
                        type:
                            - array
                            - "null"
                        items:
                            type: array
                            items:
                                type: number
                            minItems: 3
                            maxItems: 3
            required:
                - testers
                - streams
                - results
                - running
        Usage:
            type: object
            properties:
                hostCpus:
                    type: integer
                hostMemTotal:
                    description: MB
                    type: integer
                hostMemFree:
                    description: MB, available now
                    type: integer
                load:
                    type: number
                running:
                    type: integer
                vcpus:
                    description: of the running switches
                    type: integer
                ram:
                    description: MB, of the running switches
                    type: integer
                cores:
                    description: host cores they use now
                    type: number
                diskGb:
                    type: integer
                saved:
                    description: MB, about what the saved running states take on the hosts' disks
                    type: integer
            required:
                - hostCpus
                - hostMemTotal
                - hostMemFree
                - load
                - running
                - vcpus
                - ram
                - cores
                - diskGb
                - saved
        StreamInput:
            type: object
            description: A stream to add or to replace one with. Only from is needed; the rest has defaults (udp, 128 bytes, 100 pps, 10 s, no loss allowed). from and to can be test port names or ids. Unknown fields are refused.
            properties:
                name:
                    description: its name (unique; the API and command line find it by it)
                    type: string
                from:
                    description: the test port it is sent from (id; the API takes a name too)
                    type: string
                to:
                    description: a test port; "" = every other one (broadcast)
                    type: string
                kind:
                    description: udp, icmp, tcp (SYN), arp, raw, pcap (a capture's frames, replayed)
                    type: string
                vlan:
                    description: 802.1Q tag; 0 = untagged
                    type: integer
                prio:
                    description: 802.1p priority (0-7) in its VLAN tag
                    type: integer
                dstMac:
                    description: '"" = the destination test port''s (or the gateway''s, or broadcast)'
                    type: string
                srcIp:
                    description: '"" = the test ports'''
                    type: string
                dstIp:
                    description: '"" = the destination test port''s; an address that is not a test port (icmp: its replies are counted); a multicast group; IPv6 makes it an IPv6 stream'
                    type: string
                dport:
                    description: UDP or TCP destination port (default 5001 for UDP, 80 for TCP)
                    type: integer
                size:
                    description: frame bytes (60-9000; the smallest with sizeMode inc or random)
                    type: integer
                pps:
                    description: frames per second (1-100000)
                    type: integer
                seconds:
                    description: 'how long it sends (with pps: seconds × pps frames)'
                    type: integer
                count:
                    description: how many frames (instead of seconds)
                    type: integer
                maxLoss:
                    description: '% for a pass'
                    type: number
                maxLatency:
                    description: ms; 0 = not checked
                    type: number
                off:
                    description: left out of Start All
                    type: boolean
                dscp:
                    description: IP DSCP (0-63)
                    type: integer
                sizeMode:
                    description: '"" fixed, inc (Size..SizeMax, one more each frame), random, imix (64/594/1518 7:4:1)'
                    type: string
                sizeMax:
                    description: the largest frame with sizeMode inc or random
                    type: integer
                burst:
                    description: frames sent back to back (the rate is kept on average)
                    type: integer
                mods:
                    description: fields that change from frame to frame
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/FieldChange'
                maxJitter:
                    description: ms for a pass (0 = not checked)
                    type: number
                test:
                    description: made by a test run for one of its trials (not one of the user's streams)
                    type: string
                rateUnit:
                    description: 'how the rate was given: "" frames per second (pps), mbps (Mbit/s on the wire), pct (% of the sending test port''s line rate)'
                    type: string
                rate:
                    description: the rate in that unit (pps is worked out from it)
                    type: number
                rtt:
                    description: 'round trip: the test port it goes to sends each frame back, and the latency is the round trip (measured on one clock, so also between test ports on two hosts)'
                    type: boolean
                pcap:
                    description: 'pcap: the capture file on this computer (classic pcap; Wireshark: Save As pcap)'
                    type: string
                pcapId:
                    description: 'pcap: the capture as Termwright keeps it (its contents'' hash; set when saved)'
                    type: string
                pcapFrames:
                    description: 'pcap: frames in the capture (set when saved)'
                    type: integer
                pcapSecs:
                    description: 'pcap: how long the capture lasts, s (set when saved)'
                    type: number
                pcapTiming:
                    description: 'pcap: send with the capture''s own gaps between frames (else at the rate)'
                    type: boolean
                loops:
                    description: 'pcap: times through the capture (default 1; count or seconds instead)'
                    type: integer
                rewriteMacs:
                    description: 'pcap: frames go from this test port''s MAC to the destination test port''s (else as captured)'
                    type: boolean
            required:
                - from
            additionalProperties: false
        TestInput:
            type: object
            description: A test to add or to replace one with. kind is needed, and from and to (test port names or ids) for every kind but iperf; monitor for learning; action, switch and port for convergence; server and client (host VM names) for iperf. Unknown fields are refused.
            properties:
                name:
                    description: its name (unique)
                    type: string
                kind:
                    description: throughput, latency, frame-loss, back-to-back (RFC 2544), learning (RFC 2889 address caching), convergence, iperf (iperf3 between two host VMs)
                    type: string
                from:
                    description: the test port the frames go from (id; the API takes a name too)
                    type: string
                to:
                    description: the test port they go to
                    type: string
                both:
                    description: also the other way, at the same time (throughput, latency, frame-loss, convergence)
                    type: boolean
                monitor:
                    description: 'learning: a third test port that sees frames flooded to it'
                    type: string
                vlan:
                    description: 802.1Q tag on the test frames
                    type: integer
                sizes:
                    description: frame sizes (default 64, 128, 256, 512, 1024, 1280, 1518)
                    type:
                        - array
                        - "null"
                    items:
                        type: integer
                trial:
                    description: seconds per trial (default 5)
                    type: integer
                maxPps:
                    description: the highest rate tried, frames per second (default 10000)
                    type: integer
                rate:
                    description: 'latency, frame-loss, convergence: the rate (default: latency the throughput found at that size, else 1000)'
                    type: integer
                loss:
                    description: loss % that still counts as none (default 0)
                    type: number
                resolution:
                    description: 'throughput, back-to-back, learning: the search stops when the step is below this % (default 2)'
                    type: number
                max:
                    description: 'back-to-back: the longest burst tried (frames, default 10000); learning: the most addresses tried (default 4096)'
                    type: integer
                action:
                    description: 'convergence: pull (a cable or LAG member), stop (a switch), restart (a switch)'
                    type: string
                switch:
                    description: 'convergence: the switch (name or id)'
                    type: string
                port:
                    description: 'convergence, pull: the port whose cable is pulled'
                    type: string
                at:
                    description: 'convergence: seconds after the start (default 5)'
                    type: integer
                hold:
                    description: 'convergence: seconds until the cable is plugged in or the switch started again (0 = not)'
                    type: integer
                seconds:
                    description: 'convergence, iperf: how long the traffic runs (default 30, iperf 10)'
                    type: integer
                server:
                    description: 'iperf: the host VM (name or id) that runs iperf3 -s'
                    type: string
                client:
                    description: 'iperf: the host VM that runs iperf3 -c'
                    type: string
                serverIp:
                    description: 'iperf: the server''s address the client connects to (default: its first data port with a fixed address, else its management address)'
                    type: string
                proto:
                    description: 'iperf: tcp (default) or udp'
                    type: string
                bandwidth:
                    description: 'iperf: target rate (iperf3 -b: 100M, 1G; udp default 1M)'
                    type: string
                parallel:
                    description: 'iperf: parallel streams (iperf3 -P)'
                    type: integer
                reverse:
                    description: 'iperf: the server sends (iperf3 -R)'
                    type: boolean
            required:
                - kind
            additionalProperties: false
    responses:
        BadRequest:
            description: 'The request is not right: not JSON, an unknown field or format.'
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Unauthorized:
            description: No key, or a wrong one.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Forbidden:
            description: The local API is off, or the request came from a web page.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        NotFound:
            description: No such path, test port, stream or tool.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        MethodNotAllowed:
            description: Not this method here (the Allow header lists the ones that are).
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Unprocessable:
            description: 'The lab could not do it: the reason is in detail (no such switch, a port in use, no stream to start…).'
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: The key from Settings → AI Assistant → Local API → Copy Key (or token in mcp.json). A new one each time Termwright starts.
