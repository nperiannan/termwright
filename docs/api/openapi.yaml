                                        - manual
                                    type: string
                                name:
                                    description: 'the new image''s name (default: the ISO''s name)'
                                    type: string
                                password:
                                    description: 'root password for the new system (alpine: required)'
                                    type: string
                                ram_mb:
                                    description: memory for the installer (default 1024)
