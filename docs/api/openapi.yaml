                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SyslogSettings'
                        examples:
                            udp:
                                summary: UDP 514 and TLS 6514, files per sender
                                value:
                                    udp: 514
                                    tcp: 0
                                    tls: 6514
                                    saveFiles: true
                                    perHost: true
            responses:
                200:
                    description: Its state.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SyslogState'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /syslog/stop:
        post:
            operationId: syslogStop
            tags:
                - Syslog
            summary: Stop the syslog server
            description: Stops listening; the messages are kept until cleared.
            responses:
                200:
                    description: Its state.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SyslogState'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /syslog/messages:
        get:
            operationId: syslogMessages
            tags:
                - Syslog
            summary: Messages received
            description: The messages that match, oldest first (the newest limit). Rules that hide a message leave it out.
            parameters:
                - name: q
                  in: query
                  description: Words that must all be in the message, its host or program; /regex/ for a regular expression.
                  schema:
                    type: string
                - name: host
                  in: query
                  description: Only from this sender (address or host name).
                  schema:
                    type: string
                - name: severity
                  in: query
                  description: 'This severity or worse: emerg, alert, crit, err, warning, notice, info, debug or 0-7.'
                  schema:
                    type: string
                - name: minutes
                  in: query
                  description: Only the last minutes.
                  schema:
                    type: integer
                - name: after
                  in: query
                  description: Only messages with a larger id (to follow new ones).
                  schema:
                    type: integer
                - name: limit
                  in: query
                  description: At most this many (default 1000).
                  schema:
                    type: integer
            responses:
                200:
                    description: The messages.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SyslogView'
                400:
                    $ref: '#/components/responses/BadRequest'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
        delete:
            operationId: syslogClear
            tags:
                - Syslog
            summary: Clear the messages
            description: Forgets the messages received (the files stay).
            responses:
                204:
                    description: Cleared.
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /syslog/send:
        post:
            operationId: syslogSend
            tags:
                - Syslog
            summary: Send a test message
            description: 'Sends a syslog message (RFC 5424 or 3164) over UDP, TCP or TLS to a syslog server: to check that a server receives, or to set off its alerts.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SyslogSendIn'
                        examples:
                            test:
                                summary: An error to a server
                                value:
                                    target: 10.0.0.5
                                    facility: local7
                                    severity: err
                                    text: test from Termwright
            responses:
                200:
                    description: The message as sent.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    sent:
                                        type: string
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /syslog/rules:
        get:
            operationId: syslogRules
            tags:
                - Syslog
            summary: The syslog rules
            description: Rules that highlight, alert on or hide messages; the first that matches wins.
            responses:
                200:
                    description: The rules.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SyslogRule'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
        put:
            operationId: syslogSetRules
            tags:
                - Syslog
            summary: Replace the syslog rules
            description: 'Saves the rules ({"rules": [...]}).'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                rules:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/SyslogRule'
            responses:
                200:
                    description: The rules.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SyslogRule'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /snmp:
        post:
            operationId: snmp
            tags:
                - SNMP
            summary: Run an SNMP operation
            description: 'get, getnext, bulk, walk or set against a saved session''s SNMP settings (session properties → SNMP: version, community or v3 user; the community and passwords from the credential store) or a target given here. OIDs can be names from the loaded MIBs (sysDescr.0, IF-MIB::ifTable, ifOperStatus). Values come back with names and readable values. A set needs writes allowed on the session; through the API it is not asked, production sessions too (the scripts are the user''s own).'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SNMPRequest'
                        examples:
                            walk:
                                summary: Walk the interface table of a saved session
                                value:
                                    session: Lab/core-sw1
                                    op: walk
                                    oids:
                                        - IF-MIB::ifTable
                            get:
                                summary: Read a few scalars
                                value:
                                    session: Lab/core-sw1
                                    op: get
                                    oids:
                                        - sysDescr.0
                                        - sysUpTime.0
                                        - sysName.0
                            v3:
                                summary: An address and SNMPv3 credentials (not a saved session)
                                value:
                                    target:
                                        address: 10.0.0.1
                                        version: "3"
                                        user: netops
                                        auth: SHA-256
                                        authPass: …
                                        priv: AES
                                        privPass: …
                                    op: get
                                    oids:
                                        - sysDescr.0
                            set:
                                summary: 'Write: shut a port down'
                                value:
                                    session: Lab/core-sw1
                                    op: set
                                    values:
                                        - oid: ifAdminStatus.5
                                          value: down
            responses:
                200:
                    description: The values.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SNMPResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /snmp/mib:
        get:
            operationId: searchMib
            tags:
                - SNMP
            summary: Search the MIBs
            description: Objects of the loaded MIBs (the standard IETF and IANA MIBs built in, and the user's own) whose name, module or OID matches q.
            parameters:
                - name: q
                  in: query
                  required: true
                  description: A name (ifOper), a module (IF-MIB) or an OID prefix.
                  schema:
                    type: string
            responses:
                200:
                    description: The objects (at most 200).
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/SNMPMibNode'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /snmp/mib/{object}:
        get:
            operationId: getMibObject
            tags:
                - SNMP
            summary: A MIB object
            description: 'One object of the loaded MIBs by name or OID: its syntax, enums, access, index, description.'
            parameters:
                - name: object
                  in: path
                  required: true
                  description: A name (ifOperStatus, IF-MIB::ifOperStatus) or an OID.
                  schema:
                    type: string
            responses:
                200:
                    description: The object.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SNMPMibNode'
                404:
                    $ref: '#/components/responses/NotFound'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /snmp/traps:
        get:
            operationId: listTraps
            tags:
                - SNMP
            summary: Traps received
            description: The trap receiver's state (start it in SNMP → Traps) and the notifications it got, newest first, with names from the MIBs.
            responses:
                200:
                    description: The receiver and its notifications.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SNMPTrapsView'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /snmp/trap:
        post:
            operationId: sendTrap
            tags:
                - SNMP
            summary: Send a trap
            description: Sends a notification (v1, v2c or v3; v3 with Termwright's engine ID) to a trap receiver or a network management system, to test it.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SNMPTrapSendIn'
                        examples:
                            linkDown:
                                summary: linkDown of port 3
                                value:
                                    address: 10.0.0.5
                                    trapOid: IF-MIB::linkDown
                                    values:
                                        - oid: ifIndex.3
                                          value: "3"
                                        - oid: ifOperStatus.3
                                          value: down
            responses:
                200:
                    description: Sent.
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    sent:
                                        type: string
                400:
                    $ref: '#/components/responses/BadRequest'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /tools:
        get:
            operationId: listNetTools
            tags:
                - Network tools
            summary: The network tools
            description: 'The network tools (snmp, http, syslog) with their arguments (JSON Schema): the same tools the in-app AI assistant and the Claude connector use. Each one is POST /tools/{name}.'
            responses:
                200:
                    description: The tools.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Tool'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /tools/tests:
        post:
            operationId: net_tests
            tags:
                - Network tools
            summary: The tests tool
            description: 'Termwright tests: YAML files in the tests folder (cases/), each a list of steps - a command on a saved session (run) or an HTTP request (http) - with checks on what came back (contains, matches, a field or JSON value equals / greater / less, status, time). list lists the tests; show gives one as YAML; run runs tests (files, or none for all) and returns pass/fail per step, writing a JUnit XML file and an HTML report under reports/; save writes a test from YAML (and its Go test); generate writes the Go tests again (go test ./cases/... in the tests folder runs them through Termwright); step runs one step without its checks and returns its answer as JSON (used by the generated Go tests); results gives the last run''s report. Runs log in with the sessions'' saved logins in the background; a run touching production sessions is asked first. Through the API it runs without asking.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    description: what to do
                                    enum:
                                        - list
                                        - show
                                        - run
                                        - save
                                        - generate
                                        - step
                                        - results
                                    type: string
                                file:
                                    description: 'show/save/run: a test file relative to the tests folder, e.g. cases/vlan/add-vlan.yaml (cases/ and .yaml may be left out)'
                                    type: string
                                files:
                                    description: 'run: the tests to run (none: all)'
                                    items:
                                        type: string
                                    type: array
                                step:
                                    description: 'step: one step {run: {session, command, prompt}} or {http: {session, method, url, headers, body}}, timeout'
                                    type: object
                                vars:
                                    additionalProperties:
                                        type: string
                                    description: 'run: values for {{variables}} that win over the tests'' own'
                                    type: object
                                yaml:
                                    description: 'save: the test as YAML'
                                    type: string
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /tools/device:
        post:
            operationId: net_device
            tags:
                - Network tools
            summary: The device tool
            description: 'A saved session''s device facts and device type. facts: the model, version, serial number, MAC address, uptime and other facts read from it last time; refresh_facts logs in in the background (with the session''s saved login) and reads them now with the device type''s fact rules. identify logs in, runs the device types'' detect commands (show version, display version …) and says which device type''s Detect pattern matches; set_type sets the session''s device type (asked first). types lists the device types with their Detect patterns. Nothing is typed in the user''s tabs. Through the API it runs without asking.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    description: what to do
                                    enum:
                                        - facts
                                        - refresh_facts
                                        - identify
                                        - set_type
                                        - types
                                    type: string
                                session:
                                    description: the saved session's path, e.g. Datacenter/Core/core-sw1
                                    type: string
                                type:
                                    description: 'set_type: the device type''s name ("" clears it)'
                                    type: string
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /tools/snmp:
        post:
            operationId: net_snmp
            tags:
                - Network tools
            summary: The snmp tool
            description: 'SNMP with a saved session''s SNMP settings (session properties → SNMP; v1, v2c or v3) or an address and credentials: get, getnext, bulk and walk read; set writes (asked first on a production session, and only when the session allows writes). Values come back with the MIB''s names and readable values (enum names, times, MAC addresses). mib_search and mib_info look objects up in the loaded MIBs (the standard IETF MIBs and the user''s own); traps lists the notifications the trap receiver got; send_trap sends a test notification to a receiver. Through the API it runs without asking.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    description: what to do
                                    enum:
                                        - get
                                        - getnext
                                        - bulk
                                        - walk
                                        - set
                                        - mib_search
                                        - mib_info
                                        - traps
                                        - send_trap
                                    type: string
                                address:
                                    description: 'instead of session: host or host:port'
                                    type: string
                                community:
                                    description: with address, v1/v2c (default public)
                                    type: string
                                max:
                                    description: 'walk: at most this many values (default 2000 here)'
                                    type: integer
                                oids:
                                    description: 'OIDs or names: sysDescr.0, IF-MIB::ifTable, ifOperStatus, 1.3.6.1.2.1.2.2.1.8'
                                    items:
                                        type: string
                                    type: array
                                query:
                                    description: 'mib_search: a name, module or OID; mib_info: one object'
                                    type: string
                                session:
                                    description: a saved session's path (list_sessions); its SNMP settings and saved community / v3 passwords are used
                                    type: string
                                trap:
                                    description: 'send_trap: the notification (IF-MIB::linkDown or an OID), sent to address (port 162) with values'
                                    type: string
                                values:
                                    description: 'set: [{oid, value, type?}] - the type comes from the MIB when left out; an enum takes its name (down)'
                                    items:
                                        properties:
                                            oid:
                                                type: string
                                            type:
                                                type: string
                                            value:
                                                type: string
                                        type: object
                                    type: array
                                version:
                                    description: with address (default 2c)
                                    enum:
                                        - "1"
                                        - 2c
                                        - "3"
                                    type: string
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /tools/http:
        post:
            operationId: net_http
            tags:
                - Network tools
            summary: The http tool
            description: 'The REST API client with saved API sessions (Protocol API: base URL, authentication - API key, bearer token, login, basic, OAuth 2.0 - and {{variables}}; secrets stay in the credential store) and collections. send sends one request (a path goes after the session''s base URL; the login token is fetched and renewed by itself) or a saved one (collection + request); POST, PUT, PATCH and DELETE on a production session are asked first. run runs a collection''s requests with their tests; collections / collection list them; save adds or replaces a request in a collection (made when missing), with its pre-request script (preScript) and tests in Postman''s pm.* style (pm.test, pm.expect, pm.response.json(), pm.variables.set); import reads a cURL command, a Postman collection or an OpenAPI document into a collection; history lists the last requests; environments lists the environments (Postman''s) and globals; variables lists the variables a request can use and where each comes from (secret values hidden). Through the API it runs without asking.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    description: what to do
                                    enum:
                                        - send
                                        - run
                                        - collections
                                        - collection
                                        - save
                                        - import
                                        - history
                                        - environments
                                        - variables
                                    type: string
                                body:
                                    description: 'send: a JSON value (sent as JSON) or text'
                                collection:
                                    description: a collection's id or name
                                    type: string
                                data:
                                    description: 'run: CSV with a header line or a JSON array; one iteration per row'
                                    type: string
                                env:
                                    description: production uses the variables' production values
                                    enum:
                                        - ""
                                        - production
                                    type: string
                                environment:
                                    description: 'send / run / variables: an environment''s id or name (environments lists them); its variables win over the session''s'
                                    type: string
                                folder:
                                    description: 'run: only this folder'
                                    type: string
                                headers:
                                    additionalProperties:
                                        type: string
                                    description: 'send: extra headers'
                                    type: object
                                iterations:
                                    description: 'run: how many times'
                                    type: integer
                                method:
                                    description: 'send: GET (default), POST, PUT, PATCH, DELETE, HEAD, OPTIONS'
                                    type: string
                                name:
                                    description: 'import / save: the collection''s name'
                                    type: string
                                query:
                                    additionalProperties:
                                        type: string
                                    description: 'send: query parameters'
                                    type: object
                                request:
                                    description: 'send / run: a saved request''s id or name; save: the request object {name, folder, method, url, params, headers, body {mode, raw}, tests}'
                                session:
                                    description: an API session's path (list_sessions shows protocol API)
                                    type: string
                                text:
                                    description: 'import: the cURL command, Postman collection or OpenAPI document'
                                    type: string
                                url:
                                    description: 'send: a path (/rest/restconf/data/openconfig-interfaces:interfaces) or a full URL; {{variables}} work'
                                    type: string
                            required:
                                - action
            responses:
                200:
                    description: What it did or found, as text.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ToolResult'
                400:
                    $ref: '#/components/responses/BadRequest'
                404:
                    $ref: '#/components/responses/NotFound'
                422:
                    $ref: '#/components/responses/Unprocessable'
                401:
                    $ref: '#/components/responses/Unauthorized'
                403:
                    $ref: '#/components/responses/Forbidden'
                405:
                    $ref: '#/components/responses/MethodNotAllowed'
    /tools/syslog:
        post:
            operationId: net_syslog
            tags:
                - Network tools
            summary: The syslog tool
            description: 'The syslog server in Termwright (receives from devices over UDP, TCP and TLS while Termwright runs; senders are matched to saved sessions) and a syslog client. status: whether it listens, counts per severity, senders. messages: what was received, filtered by words or /regex/, sender, severity and minutes back (newest last). start / stop the server (ports: udp 514, tcp, tls 6514; ports below 1024 may need administrator rights - use 1514 then). send: a test message to a syslog server. clear forgets the messages. Through the API it runs without asking.'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                action:
                                    description: what to do
                                    enum:
                                        - status
                                        - messages
                                        - start
                                        - stop
                                        - send
                                        - clear
                                    type: string
                                facility:
                                    description: 'send: local7, user, … (default user)'
                                    type: string
                                host:
                                    description: 'messages: only from this sender (address or host name)'
                                    type: string
                                limit:
                                    description: 'messages: at most this many (default 200)'
                                    type: integer
                                minutes:
                                    description: 'messages: only the last minutes'
                                    type: integer
                                proto:
                                    description: 'send: transport (default udp)'
                                    enum:
                                        - udp
                                        - tcp
                                        - tls
                                    type: string
                                query:
                                    description: 'messages: words that must all be in the message, or /regex/'
