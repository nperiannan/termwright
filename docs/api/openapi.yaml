            tags:
                - Tools
            summary: Checkpoints of a running switch
            description: 'Checkpoints of a running switch: its whole state (configuration, tables, sessions) kept in its disk, restored in seconds - like a snapshot, while it runs. Actions: list (a switch''s checkpoints), take (now; note says why), restore (tag: back to that moment), remove (tag), auto (on: Termwright takes one before Claude or the API types on a switch, so lab_history revert undoes typed commands; off: none). Taking one pauses the switch for a moment. Through the API it runs without asking.'
