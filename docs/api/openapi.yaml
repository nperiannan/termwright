                    type: string
                folder:
                    description: Folder in the collection ("Interfaces/Ports"), "" = top level.
                    type: string
                method:
                    description: 'Method: GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS or any other word.'
                    type: string
                url:
                    description: 'URL: absolute, or a path (/rest/...) that goes after the session''s base URL.'
                    type: string
                params:
                    description: 'Params: query parameters added to the URL.'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPKeyValue'
                pathVars:
                    description: 'PathVars: values of the :name parts of the URL''s path.'
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPKeyValue'
                headers:
                    description: Headers sent with it.
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPKeyValue'
                body:
                    $ref: '#/components/schemas/HTTPBody'
                    description: Body sent with it.
                auth:
                    description: 'Auth: "" inherits (the collection''s, else the session''s), "none", "bearer", "basic" or "apikey".'
                    type: string
                authData:
                    description: 'AuthData: the values of its own authentication.'
                    anyOf:
                        - $ref: '#/components/schemas/HTTPReqAuth'
                        - type: "null"
                settings:
                    description: Settings of the request.
                    anyOf:
                        - $ref: '#/components/schemas/HTTPSettings'
                        - type: "null"
                preScript:
                    description: PreScript runs before it is sent (pm.variables.set ...).
                    type: string
                tests:
                    description: Tests run on the answer (pm.test("ok", () => pm.response.to.have.status(200))).
                    type: string
                description:
