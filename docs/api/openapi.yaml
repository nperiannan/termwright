                                        - 1518
                                    maxPps: 20000
                                    trial: 5
                            convergence:
                                summary: Pull a LAG member at 5 s, plug it in at 15 s
                                value:
                                    name: lag-failover
                                    kind: convergence
                                    from: Test port 1
                                    to: Test port 2
                                    both: true
                                    rate: 1000
                                    seconds: 30
                                    action: pull
                                    switch: leaf-1
                                    port: "1"
                                    at: 5
                                    hold: 10
                            iperf:
                                summary: iperf3 TCP between two Alpine hosts, 4 streams
                                value:
                                    name: host-tcp
