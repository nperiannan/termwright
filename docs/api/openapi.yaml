                - slots
                - values
        EmuPersonaDef:
            type: object
            properties:
                name:
                    description: what it is called ("Lab identity")
                    type: string
                file:
                    description: its path in the VM (/scratch/config.yaml)
                    type: string
                template:
                    description: Go text/template over PersonaData
                    type: string
                models:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuPersonaModel'
                values:
                    description: more fields, the same for all slots
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/EmuPersonaValue'
                stack:
                    description: the persona can be a stack of several slots
                    type: boolean
                modules:
                    description: what a module is called ("VIM")
                    type: string
                osName:
                    description: what the image is called as such a device (shown after the model)
                    type: string
                fsHas:
                    description: names at the top of the filesystem the file goes on, when the image mounts it from its own scripts
                    type:
                        - array
                        - "null"
                    items:
                        type: string
                check:
                    description: a CLI command whose output names the model once the persona took ("show version")
                    type: string
                serialMax:
                    description: 'the longest serial number the image takes: a longer one keeps its last characters'
                    type: integer
                serialSim:
                    description: 'the image takes only SIMxxxx-xxxx: any serial becomes that, from its last 8 letters and digits'
                    type: boolean
            required:
                - name
                - file
                - template
                - models
                - values
                - stack
                - modules
                - osName
                - check
        EmuPersonaModel:
            type: object
            properties:
                name:
                    type: string
                modules:
                    type:
                        - array
                        - "null"
                    items:
                        type: string
            required:
                - name
                - modules
        EmuPersonaValue:
            type: object
            properties:
                key:
                    type: string
                label:
                    type: string
                default:
                    type: string
            required:
                - key
                - label
                - default
        EmuPortMap:
            type: object
            properties:
                port:
                    type: integer
                vif:
                    type: integer
            required:
                - port
                - vif
        EmuRouting:
            type: object
            properties:
                proto:
                    description: ospf or bgp
                    type: string
                port:
                    description: the data port it speaks on (1 = the first)
                    type: integer
                routes:
                    description: how many prefixes it advertises (1-10000)
                    type: integer
                prefix:
                    description: the first one with its length (100.64.0.0/24); the others follow it
                    type: string
                area:
                    description: 'OSPF: the area (default 0.0.0.0)'
                    type: string
                as:
                    description: 'BGP: its AS (default 65001)'
                    type: integer
                peer:
                    description: 'BGP: the switch''s address on that port'
                    type: string
                peerAs:
                    description: 'BGP: the switch''s AS (default 65000)'
                    type: integer
            required:
                - proto
                - port
                - routes
                - prefix
        EmuSTP:
            type: object
            properties:
                mode:
                    description: stp or rstp
                    type: string
                prio:
                    description: its bridge priority (0-61440, steps of 4096; default 32768)
                    anyOf:
                        - type: integer
                        - type: "null"
                tc:
                    description: raise it by one to signal a topology change (the next BPDUs carry the TC flag)
                    type: integer
            required:
                - mode
        EmuSTPState:
            type: object
            properties:
                sent:
                    description: BPDUs sent
                    type: integer
                got:
                    description: BPDUs received
                    type: integer
                root:
                    description: the root bridge the switch announces (priority/MAC)
                    type: string
                bridge:
                    description: the switch's own bridge (priority/MAC)
                    type: string
                cost:
                    description: the switch's path cost to the root
                    type: integer
                role:
                    description: 'RSTP: the role of the switch port that sent it'
                    type: string
                rootIsUs:
                    description: the switch takes this test port as the root
                    type: boolean
                tc:
                    description: the last BPDU carried a topology change
                    type: boolean
            required:
                - sent
                - got
        EmuSlot:
            type: object
            properties:
                num:
                    type: integer
                model:
                    type: string
                serial:
                    type: string
                module:
                    type: string
                master:
                    type: boolean
                ports:
