                - serial
                - module
                - master
                - ports
        EmuTemplate:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                image:
                    type: string
                cpus:
                    type: integer
                ram:
                    description: MB
                    type: integer
                diskGb:
