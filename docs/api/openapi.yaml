            description: 'Microcontrollers (ESP32-S3, -C3, -C6, -H2) in the emulated lab, run by Espressif''s QEMU on a KVM host or on this computer (the one Termwright runs on; macOS or Linux, microcontrollers only). Actions: list (boards, firmwares, this computer as a host, the microcontrollers in the lab), this_computer (add this computer as a host), sample (get MicroPython''s newest release from micropython.org as a firmware: the ESP32-C3 only - the S3 and C6 builds stop in Espressif''s QEMU, the H2 has none), add (put microcontrollers of a board in the lab: its newest firmware, or MicroPython downloaded first; on this computer when it is a host), flash (give one another firmware of its board: its flash is made again). Type on their console (the UART: MicroPython''s >>> prompt) with lab_console; start and stop them with lab_power; cable their port 1 (Ethernet) with lab_cable. Changes are asked in Termwright first. Through the API it runs without asking.'
