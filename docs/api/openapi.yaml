                - name
                - portName
        HubView:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                kind:
                    description: hub, switch
                    type: string
                x:
                    type: number
                y:
                    type: number
                legs:
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HubLegView'
                ports:
                    description: Ports is how many ports it has (hub 8; L2 switch 8-24).
                    type: integer
                cfg:
                    description: Cfg is an L2 switch's VLANs and management address.
                    anyOf:
                        - $ref: '#/components/schemas/EmuHubCfg'
                        - type: "null"
                console:
                    description: Console is its command line's console session (L2 switch).
                    type: string
                ssh:
                    description: SSH is its command line's SSH session (L2 switch; works when the host's Python has paramiko).
                    type: string
