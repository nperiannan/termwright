                name:
                    description: the request's name
                    type: string
                method:
                    description: its method
                    type: string
                url:
                    description: the URL sent
                    type: string
                status:
                    description: 'the answer''s status (0: not sent)'
                    type: integer
                ms:
                    description: how long it took
                    type: integer
                tests:
                    description: its tests
                    type:
                        - array
                        - "null"
                    items:
                        $ref: '#/components/schemas/HTTPTestResult'
                error:
                    description: why it failed or was not sent
                    type: string
                pass:
