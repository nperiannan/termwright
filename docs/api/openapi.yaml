                client:
                    description: 'iperf: the host VM that runs iperf3 -c'
                    type: string
                serverIp:
                    description: 'iperf: the server''s address the client connects to (on its data port; default its management address)'
                    type: string
                proto:
                    description: 'iperf: tcp (default) or udp'
                    type: string
                bandwidth:
                    description: 'iperf: target rate (iperf3 -b: 100M, 1G; udp default 1M)'
                    type: string
                parallel:
                    description: 'iperf: parallel streams (iperf3 -P)'
                    type: integer
                reverse:
                    description: 'iperf: the server sends (iperf3 -R)'
                    type: boolean
            required:
                - kind
            additionalProperties: false
    responses:
        BadRequest:
            description: 'The request is not right: not JSON, an unknown field or format.'
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Unauthorized:
            description: No key, or a wrong one.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Forbidden:
            description: The local API is off, or the request came from a web page.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        NotFound:
            description: No such path, test port, stream or tool.
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        MethodNotAllowed:
            description: Not this method here (the Allow header lists the ones that are).
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
        Unprocessable:
            description: 'The lab could not do it: the reason is in detail (no such switch, a port in use, no stream to start…).'
            content:
                application/problem+json:
                    schema:
                        $ref: '#/components/schemas/Problem'
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            description: The key from Settings → AI Assistant → Local API → Copy Key (or token in mcp.json). A new one each time Termwright starts.
