    /lab/tools/cpu:
        post:
            operationId: tool_cpu
            tags:
                - Tools
            summary: CPU requests and limits of the emulated lab's switches and computers, in millicores as kubectl counts them (1000m = one host core)
            description: 'CPU requests and limits of the emulated lab''s switches and computers, in millicores as kubectl counts them (1000m = one host core): the request is its share when the host is busy (nothing is reserved; it may use more when the host is free), the limit the most it may use. They apply at once, no restart (a cgroup on its host). Without request_m and limit_m it reports each device''s use over the last hour: average, p95, peak, how often it went above its request, how many times its limit held it back, and advice. Use it to keep a busy switch from slowing the others, or to give a switch under test more of the host. Through the API it runs without asking.'
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                limit_m:
                                    description: its CPU limit in millicores (1500 = one and a half cores; 0 = no limit)
                                    type: integer
                                max_cores:
                                    description: 'older form of the limit: host cores (0.5 = half of one)'
                                    type: number
                                request_m:
                                    description: its CPU request in millicores (250 = 250m = a quarter of a core; 0 = none)
                                    type: integer
                                share:
                                    description: 'older form of the request: 100 = 1000m'
                                    type: integer
                                switches:
                                    description: names (none = all)
                                    items:
                                        type: string
                                    type: array
            responses:
                200:
